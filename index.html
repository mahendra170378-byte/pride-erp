const FONTS_HREF = "https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap";

const APP_CSS = [
":root{",
"--bg:#F3F5F7;--surface:#FFFFFF;--surface-2:#E9ECF0;--surface-3:#DBE1E8;--border:#D3D9E0;",
"--text:#1B2027;--text-muted:#5B6472;--text-faint:#8993A3;",
"--accent:#143A5C;--accent-strong:#0C273F;--accent-soft:#DEE6ED;--on-accent:#F6F9FC;",
"--warn:#C1671E;--warn-soft:#F7E5D0;--danger:#A8460F;--danger-soft:#F3DBC4;--good:#1D6FA5;--good-soft:#DCEAF3;",
"--shadow:0 1px 2px rgba(18,26,36,.07),0 6px 18px rgba(18,26,36,.06);--radius:10px;",
"--paper-bg:#FFFFFF;--paper-surface-2:#E9ECF0;--paper-border:#D3D9E0;--paper-text:#1B2027;--paper-muted:#5B6472;",
"--paper-accent:#143A5C;--paper-accent-strong:#0C273F;--paper-accent-soft:#DEE6ED;",
"}",
"@media (prefers-color-scheme: dark){:root:not([data-theme='light']){",
"--bg:#12161C;--surface:#1A2128;--surface-2:#222A33;--surface-3:#2B3540;--border:#37424E;",
"--text:#E7ECF2;--text-muted:#9CA8B5;--text-faint:#707C8C;",
"--accent:#5B9BD5;--accent-strong:#8FC1EA;--accent-soft:#1B2C3E;--on-accent:#07131F;",
"--warn:#E29A4E;--warn-soft:#3E2C15;--danger:#D97D3E;--danger-soft:#3A2312;--good:#5CA8D9;--good-soft:#15293A;",
"--shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.4);",
"}}",
":root[data-theme='dark']{",
"--bg:#12161C;--surface:#1A2128;--surface-2:#222A33;--surface-3:#2B3540;--border:#37424E;",
"--text:#E7ECF2;--text-muted:#9CA8B5;--text-faint:#707C8C;",
"--accent:#5B9BD5;--accent-strong:#8FC1EA;--accent-soft:#1B2C3E;--on-accent:#07131F;",
"--warn:#E29A4E;--warn-soft:#3E2C15;--danger:#D97D3E;--danger-soft:#3A2312;--good:#5CA8D9;--good-soft:#15293A;",
"--shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.4);",
"}",
"*,*::before,*::after{box-sizing:border-box}",
"html,body{margin:0;padding:0}",
"body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}",
"h1,h2,h3{font-family:'Barlow Semi Condensed',system-ui,sans-serif;font-weight:700;margin:0;text-wrap:balance}",
"button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}",
"table{border-collapse:collapse;width:100%}",
".tabular{font-variant-numeric:tabular-nums;font-family:'IBM Plex Mono',ui-monospace,monospace}",
"a{color:var(--accent)}",
".sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}",

/* topbar */
".topbar{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}",
".topbar-inner{max-width:1180px;margin:0 auto;padding:14px 24px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}",
".brand{display:flex;align-items:center;gap:10px;margin-right:auto}",
".brand-mark{flex:none}",
".brand-name{font-family:'Barlow Semi Condensed';font-weight:700;font-size:19px;letter-spacing:.2px}",
".brand-sub{display:block;font-family:'IBM Plex Mono';font-size:10.5px;color:var(--text-faint);letter-spacing:.08em;text-transform:uppercase;margin-top:1px}",
".nav{display:flex;gap:2px;margin-left:24px}",
".nav-tab{appearance:none;border:none;background:none;padding:10px 14px 12px;font-family:'Barlow Semi Condensed';font-weight:600;font-size:14.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);cursor:pointer;border-bottom:2.5px solid transparent}",
".nav-tab:hover{color:var(--text)}",
".nav-tab.active{color:var(--accent-strong);border-bottom-color:var(--accent)}",

/* layout */
".main{max-width:1180px;margin:0 auto;padding:28px 24px 80px}",
".panel-header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}",
".panel-title{font-size:26px}",
".panel-hint{color:var(--text-muted);font-size:13.5px;margin-top:4px}",
".toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}",
".card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}",
".card-pad{padding:20px 22px}",
".section-gap{margin-top:28px}",
".grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}",
".grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px 18px}",
"@media (max-width:780px){.grid-2,.grid-3{grid-template-columns:1fr}}",

/* buttons */
".btn{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:8px 14px;font-weight:500;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1.3}",
".btn:hover{border-color:var(--text-faint)}",
".btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}",
".btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}",
".btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}",
".btn-ghost{background:transparent;border-color:transparent;color:var(--text-muted)}",
".btn-ghost:hover{color:var(--text);background:var(--surface-2)}",
".btn-danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}",
".btn-danger:hover{border-color:var(--danger)}",
".btn-sm{padding:5px 10px;font-size:12.5px;border-radius:6px}",
".btn[disabled]{opacity:.5;cursor:not-allowed}",
".icon-btn{padding:5px 8px;line-height:1}",

/* fields */
".field{display:flex;flex-direction:column;gap:5px}",
".field.wide{grid-column:1/-1}",
".field label{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)}",
".field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:8px 10px;color:var(--text)}",
".field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}",
".field textarea{resize:vertical;min-height:64px;font-family:inherit}",
".hl-c-display{font-size:11.5px;color:var(--text-faint);font-family:'IBM Plex Mono';margin-top:4px}",
".hint{font-size:12px;color:var(--text-faint)}",
".callout{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--radius);padding:14px 16px;font-size:13.5px;line-height:1.6;color:var(--text)}",
".kbd{display:inline-block;padding:1px 7px;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;background:var(--surface);font-family:'IBM Plex Mono';font-size:12px}",
".status-banner{padding:11px 15px;border-radius:8px;font-size:13.5px;font-weight:500}",
".status-banner.ok{background:var(--good-soft);color:var(--good)}",
".status-banner.warn{background:var(--warn-soft);color:var(--warn)}",
".status-banner.info{background:var(--surface-2);color:var(--text-muted)}",

/* badges & pills */
".badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}",
".badge-draft{background:var(--warn-soft);color:var(--warn)}",
".badge-final{background:var(--good-soft);color:var(--good)}",
".badge-rejected{background:var(--danger-soft);color:var(--danger)}",
".badge-dot{width:6px;height:6px;border-radius:99px;background:currentColor}",

/* tables (app UI) */
".table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}",
"table.list-table{min-width:640px}",
"table.list-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--border);background:var(--surface-2)}",

/* Same layout used for @media print, applied via a toggled class so the
   "Export as PDF" button (html2pdf.js) can capture a clean A4-letterhead
   render on-screen, without needing the browser's print dialog. */
/* Pixel widths, not mm: html2canvas clones the document into an offscreen
   frame to rasterize it, and that clone's layout can reflow relative to the
   browser window's own width unless every size here is a plain px value
   AND html2canvas is told the exact capture width to use (see PDF_CAPTURE_PX
   below) — that combination is what actually keeps content from spilling
   past the right edge in the exported PDF. 718px == 190mm, 1021px == 270mm,
   98px == 26mm, all at 96 CSS px/inch. */

const DOC_TYPES = ["mrs","dc","field_service_report","ho_report"];
const DOC_TYPE_LABELS = { mrs:"Material Requisition (MRS)", dc:"Delivery Challan (DC)", field_service_report:"Field Service Report", ho_report:"HO Report" };

// Department-specific job titles for the same staff/senior/dept_head ladder —
// e.g. Service uses Technician / Senior Technician / Service Manager. Purely
// a display label; permissions are governed by the underlying seniority value.
const DEPT_SENIORITY_LABELS = { service: { staff:"Technician", senior:"Senior Technician", dept_head:"Service Manager" } };
function seniorityLabelFor(dept, sen){
  if(!sen) return "";
  const overrides = DEPT_SENIORITY_LABELS[dept];
  return (overrides && overrides[sen]) || SENIORITY_LABELS[sen] || sen;
}
// Access to the Sales tools — Quotes (AC Project offers), the Sales Customer
// database and Products — is now purely department-driven: Sales department
// members and the director. Service maintains its own, entirely separate
// customer + installation-base database and AMC quote flow, reached only
// through Departments > Service (see isServiceManager below and
// renderDepartmentsView) — never through these Sales tabs.
function hasSalesAccess(){ return isDeptDirector() || myDepartment()==="sales"; }
function isServiceManager(){ return isDeptDirector() || (myDepartment()==="service" && myDeptSeniority()==="dept_head"); }
// Effective seniority for department purposes: a director always has full access to every
// department regardless of the profiles.department/seniority columns (which stay null for them).
function myDeptSeniority(){ return (myProfile && myProfile.role==="director") ? "director" : (myProfile && myProfile.seniority) || null; }
function myDepartment(){ return myProfile ? myProfile.department||null : null; }
function isDeptDirector(){ return !!(myProfile && myProfile.role==="director"); }
function hasDeptAccess(){ return isDeptDirector() || !!myDepartment(); }
function areDeptPartners(a,b){
  if(!a || !b || a===b) return false;
  return state.departmentLinks.some(function(link){
    return (link.a===a && link.b===b) || (link.a===b && link.b===a);
  });
}
// Which departments the signed-in user can see documents for (own dept always;
// partner departments too, but only once they're a dept_head there; director sees all).
function visibleDepartments(){
  if(isDeptDirector()) return DEPARTMENTS.slice();
  const mine = myDepartment();
  if(!mine) return [];
  const out = [mine];
  if(myDeptSeniority()==="dept_head"){
    DEPARTMENTS.forEach(function(d){ if(d!==mine && areDeptPartners(mine,d)) out.push(d); });
  }
  return out;
}
function canCreateInDept(dept){ return isDeptDirector() || myDepartment()===dept; }
function canApproveInDept(dept){ return isDeptDirector() || (myDepartment()===dept && myDeptSeniority()==="dept_head"); }

function uid(p){ return p+"_"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function safeFileName(s){ return String(s==null?"":s).replace(/[\/\\]/g,"-"); }
function num(v){ const n = Number(v); return isFinite(n) ? n : 0; }
function fmtINR(n){
  n = num(n);
  const rounded = Math.round(n*100)/100;
  const opts = { maximumFractionDigits:2, minimumFractionDigits: (Math.abs(rounded%1)>0.001?2:0) };
  return "₹" + rounded.toLocaleString("en-IN", opts);
}
function fmtNum(n,d){ n=num(n); return n.toLocaleString("en-IN",{maximumFractionDigits:d==null?2:d}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDaysISO(iso, days){
  const d = new Date((iso||todayISO())+"T00:00:00");
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso+"T00:00:00");
  if(isNaN(d)) return iso;
  return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}

/* ============================== computations ============================== */

function itemEffectiveRate(item){ const d = Math.min(100, Math.max(0, num(item.discount))); return num(item.rate) * (1 - d/100); }
function itemAmount(item){ return num(item.qty) * itemEffectiveRate(item); }
function partSubtotal(items){ return (items||[]).reduce((s,i)=> s + itemAmount(i), 0); }
function distributionTotalTR(rows){ return (rows||[]).reduce((s,r)=> s + num(r.capacity)*num(r.qty), 0); }
function distributionTotalQty(rows){ return (rows||[]).reduce((s,r)=> s + num(r.qty), 0); }
function amcSubtotal(items){ return (items||[]).reduce((s,i)=> s + num(i.qty)*num(i.rate), 0); }
function amcTotalMachines(items){ return (items||[]).reduce((s,i)=> s + num(i.qty), 0); }
function quoteTotals(q){
  const gst = num(q.gstPercent);
  if(q.quoteType==="service"){
    const sub = amcSubtotal(q.amcItems);
    const gstAmt = sub*gst/100, total = sub+gstAmt;
    return { aSub:sub, bSub:0, aGst:gstAmt, bGst:0, aTotal:total, bTotal:0, grandExcl:sub, grandIncl:total };
  }
  const aSub = partSubtotal(q.partA), bSub = partSubtotal(q.partB);
  const aGst = aSub*gst/100, bGst = bSub*gst/100;
  const aTotal = aSub+aGst, bTotal = bSub+bGst;
  return { aSub, bSub, aGst, bGst, aTotal, bTotal, grandExcl: aSub+bSub, grandIncl: aTotal+bTotal };
}

/* ============================== persistence (Supabase) ==============================
   Every save writes straight to Supabase (RLS-enforced per the signed-in
   user's role) and then reloads just the affected slice of `state` from the
   server response, so the in-memory model always reflects what the DB
   actually has (including server-assigned ids and quote numbers) rather
   than trusting the client's optimistic guess. No page reload is needed —
   unlike the old Artifact-publish flow, a Supabase write doesn't blow away
   the current view, so callers just get a plain nextView patch back. */

let saving = false;

async function runSave(task, nextView){
  saving = true; view.saveError = null; updatePersistIndicator(); renderApp();
  try{
    const patch = await task();
    saving = false;
    Object.assign(view, nextView, patch || {});
    renderApp();
    return { ok:true };
  }catch(err){
    saving = false;
    view.saveError = "Couldn't save (" + ((err && err.message) || "please try again") + ").";
    renderApp();
    return { ok:false, error:err };
  }
}

function isClientId(id){ return typeof id === "string" && id.indexOf("_") >= 0; }

/* ---- customers (+ nested project sites) ---- */
async function reloadCustomers(){
  const [{data:custs,error:cErr}, {data:sites,error:sErr}] = await Promise.all([
    sb.from("customers").select("*").order("name"),
    sb.from("customer_sites").select("*")
  ]);
  if(cErr) throw cErr;
  if(sErr) throw sErr;
  state.customers = (custs||[]).map(function(c){
    return {
      id:c.id, name:c.name, phone:c.phone||"", email:c.email||"", gstin:c.gstin||"", pincode:c.pincode||"",
      billingAddressLines:c.address||"",
      sites:(sites||[]).filter(function(s){ return s.customer_id===c.id; }).map(function(s){
        return { id:s.id, label:s.label||"", addressLines:s.address||"", pincode:s.pincode||"" };
      }),
      createdAt:c.created_at, updatedAt:c.updated_at
    };
  });
}
async function saveCustomer(cd, nextView){
  return runSave(async function(){
    const row = { name:cd.name.trim(), phone:cd.phone||null, email:cd.email||null, gstin:cd.gstin||null, pincode:cd.pincode||null, address:cd.billingAddressLines||null };
    let customerId = cd.id;
    if(isClientId(cd.id)){
      const {data,error} = await sb.from("customers").insert(Object.assign({}, row, { created_by:session.user.id })).select().single();
      if(error) throw error;
      customerId = data.id;
    } else {
      const {error} = await sb.from("customers").update(row).eq("id", cd.id);
      if(error) throw error;
    }
    const {data:existingSites, error:sErr} = await sb.from("customer_sites").select("*").eq("customer_id", customerId);
    if(sErr) throw sErr;
    const existingIds = new Set((existingSites||[]).map(function(s){ return s.id; }));
    const keepIds = new Set();
    for(const s of (cd.sites||[])){
      const siteRow = { label:s.label||"", address:s.addressLines||null, pincode:s.pincode||null };
      if(existingIds.has(s.id)){
        keepIds.add(s.id);
        const {error} = await sb.from("customer_sites").update(siteRow).eq("id", s.id);
        if(error) throw error;
      } else {
        const {error} = await sb.from("customer_sites").insert(Object.assign({ customer_id:customerId }, siteRow));
        if(error) throw error;
      }
    }
    for(const old of (existingSites||[])){
      if(!keepIds.has(old.id)) await sb.from("customer_sites").delete().eq("id", old.id);
    }
    await reloadCustomers();
    return {};
  }, nextView);
}
async function deleteCustomer(id, nextView){
  return runSave(async function(){
    const {error} = await sb.from("customers").delete().eq("id", id);
    if(error) throw error;
    await reloadCustomers();
    state.quotes.forEach(function(q){ if(q.customerId===id && q.quoteType!=="service"){ q.customerId=null; q.siteId=null; } });
    return {};
  }, nextView);
}

async function saveServiceCustomer(cd, nextView){
  return runSave(async function(){
    const row = { name:cd.name.trim(), phone:cd.phone||null, email:cd.email||null, gstin:cd.gstin||null, pincode:cd.pincode||null, address:cd.billingAddressLines||null };
    let customerId = cd.id;
    if(isClientId(cd.id)){
      const {data,error} = await sb.from("service_customers").insert(Object.assign({}, row, { created_by:session.user.id })).select().single();
      if(error) throw error;
      customerId = data.id;
    } else {
      const {error} = await sb.from("service_customers").update(row).eq("id", cd.id);
      if(error) throw error;
    }
    const {data:existingSites, error:sErr} = await sb.from("service_customer_sites").select("*").eq("customer_id", customerId);
    if(sErr) throw sErr;
    const existingIds = new Set((existingSites||[]).map(function(s){ return s.id; }));
    const keepIds = new Set();
    for(const s of (cd.sites||[])){
      const siteRow = { label:s.label||"", address:s.addressLines||null, pincode:s.pincode||null, equipment:s.equipment||[] };
      if(existingIds.has(s.id)){
        keepIds.add(s.id);
        const {error} = await sb.from("service_customer_sites").update(siteRow).eq("id", s.id);
        if(error) throw error;
      } else {
        const {error} = await sb.from("service_customer_sites").insert(Object.assign({ customer_id:customerId }, siteRow));
        if(error) throw error;
      }
    }
    for(const old of (existingSites||[])){
      if(!keepIds.has(old.id)) await sb.from("service_customer_sites").delete().eq("id", old.id);
    }
    await reloadServiceCustomers();
    return {};
  }, nextView);
}
async function deleteServiceCustomer(id, nextView){
  return runSave(async function(){
    const {error} = await sb.from("service_customers").delete().eq("id", id);
    if(error) throw error;
    await reloadServiceCustomers();
    state.quotes.forEach(function(q){ if(q.customerId===id && q.quoteType==="service"){ q.customerId=null; q.siteId=null; } });
    return {};
  }, nextView);
}

/* ---- quotes (metadata as columns for listing/filtering, full document as jsonb) ---- */
function rowToQuote(row){
  const isService = row.data && row.data.quoteType==="service";
  return Object.assign({}, row.data||{}, {
    id:row.id, quoteNo:row.quote_no, status:row.status,
    customerId: isService ? row.service_customer_id : row.customer_id,
    siteId: isService ? row.service_site_id : row.site_id,
    createdBy:row.created_by,
    createdAt:row.created_at, updatedAt:row.updated_at
  });
}
async function reloadQuotes(){
  const {data,error} = await sb.from("quotes").select("*").order("updated_at",{ascending:false});
  if(error) throw error;
  state.quotes = (data||[]).map(rowToQuote);
}
async function saveQuote(q, nextView, alsoPrint, forcedQuoteNo){
  return runSave(async function(){
    let savedRow;
    if(isClientId(q.id)){
      const isService = q.quoteType==="service";
      // A revision (see revisionedQuoteNo) already knows its own quote_no —
      // the root offer's number plus a #-0N suffix — so it skips the normal
      // sequence RPC entirely rather than being assigned the next fresh
      // number in line.
      let quoteNo = forcedQuoteNo;
      if(!quoteNo){
        const {data:seqData, error:seqErr} = await sb.rpc(isService ? "next_service_quote_seq" : "next_quote_seq");
        if(seqErr) throw seqErr;
        quoteNo = isService ? "PAS/Service/"+String(seqData).padStart(3,"0") : "PAS-"+String(seqData).padStart(4,"0");
      }
      const toStore = Object.assign({}, q, { quoteNo:quoteNo });
      const {data,error} = await sb.from("quotes").insert({
        quote_no:quoteNo,
        customer_id: isService ? null : (q.customerId||null),
        site_id: isService ? null : (q.siteId||null),
        service_customer_id: isService ? (q.customerId||null) : null,
        service_site_id: isService ? (q.siteId||null) : null,
        status:q.status||"draft", data:toStore, created_by:session.user.id
      }).select().single();
      if(error) throw error;
      savedRow = data;
    } else {
      const isServiceUpd = q.quoteType==="service";
      const {data,error} = await sb.from("quotes").update({
        quote_no:q.quoteNo,
        customer_id: isServiceUpd ? null : (q.customerId||null),
        site_id: isServiceUpd ? null : (q.siteId||null),
        service_customer_id: isServiceUpd ? (q.customerId||null) : null,
        service_site_id: isServiceUpd ? (q.siteId||null) : null,
        status:q.status||"draft", data:q
      }).eq("id", q.id).select().single();
      if(error) throw error;
      savedRow = data;
    }
    await reloadQuotes();
    const saved = rowToQuote(savedRow);
    return alsoPrint ? { printQuoteId:saved.id, draft:saved } : {};
  }, nextView);
}
async function deleteQuote(id, nextView){
  return runSave(async function(){
    const {error} = await sb.from("quotes").delete().eq("id", id);
    if(error){
      // 23503 = foreign key violation — the database itself refuses to
      // delete a quote that an AMC contract (and its service-visit history)
      // is still linked to, rather than silently orphaning or cascading
      // that away. Surface that as a plain sentence instead of the raw
      // Postgres constraint error.
      if(error.code==="23503") throw new Error("This quote can't be deleted — it's linked to an AMC contract and its service visit history. Remove the contract first if you really need to delete it.");
      throw error;
    }
    await reloadQuotes();
    return {};
  }, nextView);
}

/* ---- AMC contracts + the 4-visit PM schedule (Service department) ---- */
async function reloadAmc(){
  const [{data:contracts,error:cErr},{data:visits,error:vErr}] = await Promise.all([
    sb.from("amc_contracts").select("*").order("contract_start",{ascending:false}),
    sb.from("amc_service_visits").select("*").order("scheduled_date")
  ]);
  if(cErr) throw cErr;
  if(vErr) throw vErr;
  state.amcContracts = (contracts||[]).map(function(c){
    return {
      id:c.id, quoteId:c.quote_id, customerId:c.customer_id, siteId:c.site_id, planLabel:c.plan_label||"",
      contractStart:c.contract_start, contractEnd:c.contract_end, status:c.status,
      approvedBy:c.approved_by, approvedAt:c.approved_at, createdAt:c.created_at
    };
  });
  state.amcVisits = (visits||[]).map(function(v){
    return {
      id:v.id, contractId:v.contract_id, pmNumber:v.pm_number, scheduledDate:v.scheduled_date, status:v.status,
      assignedTo:v.assigned_to, assignedBy:v.assigned_by, assignedAt:v.assigned_at,
      completedBy:v.completed_by, completedAt:v.completed_at,
      reportFilePath:v.report_file_path, reportFileName:v.report_file_name,
      hasChargeable:!!v.has_chargeable, chargeableItems:v.chargeable_items||[], chargeableNote:v.chargeable_note||"",
      verifiedBy:v.verified_by, verifiedAt:v.verified_at, verificationNote:v.verification_note||"",
      fsr:v.fsr||{}, photoPaths:v.photo_paths||[]
    };
  });
}
// Marks a finalized AMC quote as approved by the client and opens its AMC
// contract — which auto-generates the 4 PM visits (months 1/5/8/11 from the
// contract start date) via a database trigger.
async function markAmcClientApproved(q, nextView){
  return runSave(async function(){
    const approvedQuote = Object.assign({}, q, {
      clientApproved:true, clientApprovedBy:session.user.id, clientApprovedAt:new Date().toISOString()
    });
    const {error:qErr} = await sb.from("quotes").update({ data:approvedQuote }).eq("id", q.id);
    if(qErr) throw qErr;
    const {error:cErr} = await sb.from("amc_contracts").insert({
      quote_id:q.id, customer_id:q.customerId||null, site_id:q.siteId||null,
      plan_label:q.amcPlanLabel||null,
      contract_start:(q.amc&&q.amc.periodStart) || todayISO(),
      contract_end:(q.amc&&q.amc.periodEnd) || null,
      approved_by:session.user.id
    });
    if(cErr) throw cErr;
    await Promise.all([reloadQuotes(), reloadAmc()]);
    return {};
  }, nextView);
}

// "Mark service complete" — the technician's own signed-off submission for a
// PM visit (status → "completed", awaiting the Service Manager's Close). The
// signed FSR copy and site photos are their own always-available actions
// (uploadSignedFsr / uploadVisitPhotos below) so they can be attached before,
// during, or after this submission — Close is what actually requires the
// signed copy to be on file, not this step.
async function completeVisit(visitId, payload, nextView){
  return runSave(async function(){
    const patch = {
      status:"completed", completed_by:session.user.id, completed_at:new Date().toISOString(),
      has_chargeable: !!payload.hasChargeable, chargeable_note: payload.chargeableNote||null
    };
    const {error} = await sb.from("amc_service_visits").update(patch).eq("id", visitId);

  }, nextView);

// The signed FSR copy the customer hands back after the visit — required
// before the Service Manager can Close the job (see verifyVisit's UI gate).
// In practice this is very often a phone photo of the signed paper (not a
// scanned PDF) — often HEIC on an iPhone, not even JPEG — so no file type is
// filtered out at the picker, the department-docs bucket no longer
// restricts by MIME type at all, and this trusts the browser-reported
// file.type for the upload's Content-Type, falling back to a generic
// octet-stream (never assuming PDF) when the browser doesn't report one.
// The path also gets a timestamp, same as photos, so re-uploading a
// corrected copy after a "drop" never collides with the previous object's
// storage path (the department-docs bucket only grants INSERT, not UPDATE,
// so any same-path re-upload would otherwise be silently rejected by
// storage RLS).
async function uploadSignedFsr(visitId, file, nextView){
  return runSave(async function(){
    const path = "service/amc-report/"+visitId+"-"+Date.now()+"-"+safeFileName(file.name||"report");
    const {error:upErr} = await sb.storage.from("department-docs").upload(path, file, { contentType:file.type||"application/octet-stream", upsert:true });
    if(upErr) throw upErr;
    const {error} = await sb.from("amc_service_visits").update({ report_file_path:path, report_file_name:file.name||"report.pdf" }).eq("id", visitId);
    if(error) throw error;
    await reloadAmc();
    return {};
  }, nextView);
}
// Closing is the Service Manager's step ("job complete, file it") — kept as
// the existing verified/verifiedBy machinery under the hood (see
// amc_service_visits.status), just relabelled "Close" in the UI, and the
// click handler only shows the button once a signed FSR copy is on file.
async function verifyVisit(visitId, note, nextView){

    const {error} = await sb.from("amc_service_visits").update({

    }).eq("id", visitId);
    if(error) throw error;
    await reloadAmc();
    return {};
  }, nextView);
}

// Saves the Field Service Report form fields for one PM visit as a single
// jsonb blob (mirrors how quotes.data is stored) — separate from
// completeVisit so a technician can save progress on the form at any point,
// not just at final submission. The friendly "Service Report No." is only
// ever assigned once (via the next_fsr_seq() sequence) and then kept as-is
// on every later save.
async function saveFsr(visitId, fsrData, nextView){
  return runSave(async function(){
    const data = Object.assign({}, fsrData);
    if(!data.serviceReportNo){
      const {data:seqData, error:seqErr} = await sb.rpc("next_fsr_seq");
      if(seqErr) throw seqErr;
      data.serviceReportNo = "FSR-"+String(seqData).padStart(4,"0");
    }
    const {error} = await sb.from("amc_service_visits").update({ fsr:data }).eq("id", visitId);
    if(error) throw error;
    await reloadAmc();
    return {};
  }, nextView);
}
// Site photos are optional and additive — each call appends newly chosen
// files to whatever's already on file rather than replacing them, so a
// technician can add "a few site photographs" across more than one upload.
async function uploadVisitPhotos(visitId, files, nextView){
  return runSave(async function(){
    const v = state.amcVisits.find(function(x){ return x.id===visitId; });
    const existing = (v && v.photoPaths) || [];
    const uploaded = existing.slice();
    for(let i=0;i<files.length;i++){
      const file = files[i];
      const path = "service/amc-photo/"+visitId+"-"+Date.now()+"-"+i+"-"+safeFileName(file.name||"photo.jpg");
      const {error:upErr} = await sb.storage.from("department-docs").upload(path, file, { contentType:file.type||"image/jpeg", upsert:true });
      if(upErr) throw upErr;
      uploaded.push({ path:path, name:file.name||"photo.jpg" });
    }
    const {error} = await sb.from("amc_service_visits").update({ photo_paths:uploaded }).eq("id", visitId);
    if(error) throw error;
    await reloadAmc();
    return {};
  }, nextView);
}
// "Drop" a photo that was already uploaded. Storage DELETE rights are
// director-only under the department-docs bucket policy (see uploadVisitPhotos
// comment above), so this only removes the DB reference — the object itself
// is left in storage rather than attempting a delete that would fail RLS for
// a technician/service-manager caller.
async function removeVisitPhoto(visitId, idx, nextView){
  return runSave(async function(){
    const v = state.amcVisits.find(function(x){ return x.id===visitId; });
    const existing = ((v && v.photoPaths) || []).slice();
    existing.splice(idx, 1);
    const {error} = await sb.from("amc_service_visits").update({ photo_paths:existing }).eq("id", visitId);
    if(error) throw error;
    await reloadAmc();
    return {};
  }, nextView);
}
// "Drop" the signed FSR copy before re-uploading a corrected one. Same
// storage-RLS caveat as removeVisitPhoto — only the DB reference is cleared.
async function removeSignedFsr(visitId, nextView){
  return runSave(async function(){
    const {error} = await sb.from("amc_service_visits").update({ report_file_path:null, report_file_name:null }).eq("id", visitId);
    if(error) throw error;
    await reloadAmc();
    return {};
  }, nextView);
}

async function createDocument(payload, file, nextView){
  return runSave(async function(){
    const row = {
      doc_type: payload.docType, department: payload.department, title: payload.title||"",
      notes: payload.notes||null, linked_quote_id: payload.linkedQuoteId||null, linked_site_id: payload.linkedSiteId||null,
      created_by: session.user.id
    };
    const {data,error} = await sb.from("documents").insert(row).select("id").single();
    if(error) throw error;
    if(file){
      // Trust the browser-reported file.type (like the AMC photo/signed-copy
      // uploads) instead of hardcoding "application/pdf" — that hardcoding
      // silently failed the bucket's old MIME allow-list for any attachment
      // that wasn't literally a PDF. The bucket no longer restricts by MIME
      // type at all and the file picker has no accept filter, so any file
      // type goes through; fall back to a generic type only when the
      // browser doesn't report one, never assume PDF.
      const path = payload.department+"/"+payload.docType+"/"+data.id+"-"+Date.now()+"-"+safeFileName(file.name||"upload");
      const {error:upErr} = await sb.storage.from("department-docs").upload(path, file, { contentType:file.type||"application/octet-stream", upsert:false });
      if(upErr) throw upErr;
      const {error:updErr} = await sb.from("documents").update({ file_path:path, file_name:file.name||"upload.pdf" }).eq("id", data.id);
      if(updErr) throw updErr;
    }
    await reloadDocuments();
    return {};
  }, nextView||{});
}

/* ---- Offer revisions ----
   A "revision" is a full, independent quote row (its own id, its own
   quote_no, its own editable content) that's linked back to the original
   ("root") offer via revisionRootId, and numbered via revisionNo (0 = the
   original, 1/2/3.. = each later revision). The saved quote_no for a
   revision is the root's own quote_no with "#-01", "#-02" etc appended, so
   e.g. revising PAS-0004 twice gives PAS-0004#-01 and PAS-0004#-02 while
   the original PAS-0004 stays exactly as first issued — nothing renumbers
   or overwrites it. Old quotes saved before this feature existed have no
   revisionRootId/revisionNo at all, which every helper below treats the
   same as "the original" (root = itself, revision 0). */
function revisionRootId(q){ return (q && q.revisionRootId) || (q && q.id); }
function revisionFamily(q){
  const rootId = revisionRootId(q);
  return state.quotes.filter(function(x){ return revisionRootId(x)===rootId; })
    .sort(function(a,b){ return (a.revisionNo||0)-(b.revisionNo||0); });
}
function revisionedQuoteNo(baseNo, revisionNo){
  if(!revisionNo) return baseNo;
  return baseNo + "#-" + String(revisionNo).padStart(2,"0");
}
function quoteNoCellHTML(q){
  const n = q.revisionNo||0;
  if(!n) return "<b>"+esc(q.quoteNo)+"</b>";
  return "<span style=\"padding-left:14px;color:var(--text-muted)\">↳ "+esc(q.quoteNo)+"</span><br>"+
    "<span class=\"hint\" style=\"padding-left:14px\">Revision "+n+"</span>";
}
// Groups a quote list so every revision of the same offer sits together
// (original first, then Revision 1, 2, ...), with the most recently active
// family shown first — this is what makes "track this offer's revisions"
// actually work in a plain flat table instead of scattering them by date.
function sortQuotesWithRevisionGrouping(list){
  const groups = {}, order = [];
  list.forEach(function(q){
    const rid = revisionRootId(q);
    if(!groups[rid]){ groups[rid] = []; order.push(rid); }
    groups[rid].push(q);
  });
  order.forEach(function(rid){ groups[rid].sort(function(a,b){ return (a.revisionNo||0)-(b.revisionNo||0); }); });
  order.sort(function(a,b){
    const la = groups[a].reduce(function(m,x){ return (x.updatedAt||"")>m ? (x.updatedAt||"") : m; }, "");
    const lb = groups[b].reduce(function(m,x){ return (x.updatedAt||"")>m ? (x.updatedAt||"") : m; }, "");
    return lb.localeCompare(la);
  });
  let out = [];
  order.forEach(function(rid){ out = out.concat(groups[rid]); });
  return out;
}
function newRevisionRowActionsHTML(q){
  return "<button class=\"btn btn-sm btn-ghost\" data-action=\"new-revision\" data-id=\""+q.id+"\" title=\"Start a new revision of this offer — keeps the same offer number with a #-0N suffix\">+ Revision</button>";
}
// Shown right above the Quote No. field in the editor — "in front of" the
// offer number, so it's the first thing you see whether you're looking at
// a revision (which one, and of what) or the original (and whether it's
// since picked up any revisions of its own).
function revisionContextHTML(q){
  const n = q.revisionNo||0;
  const rootId = revisionRootId(q);
  if(n>0){
    const root = state.quotes.find(function(x){ return x.id===rootId; });
    return "<div class=\"hint\" style=\"margin-bottom:10px\">This is <b>Revision "+n+"</b> of offer "+esc((root&&root.quoteNo)||"—")+".</div>";
  }
  const laterRevisions = state.quotes.filter(function(x){ return x.id!==q.id && revisionRootId(x)===rootId; });
  if(laterRevisions.length){
    return "<div class=\"hint\" style=\"margin-bottom:10px\">"+laterRevisions.length+" revision"+(laterRevisions.length===1?"":"s")+" of this offer "+(laterRevisions.length===1?"exists":"exist")+" — see the list.</div>";
  }
  return "";
}

/* ============================== Heat Load Calculator ==============================
   Reproduces (to full float precision — the reference workbook truncates at a
   few intermediate steps, we don't) the ETD-style cooling-load method used in
   the user's own reference spreadsheet (Heat_Load_Ranka_CG.xlsx — "AMTREX" /
   Pride Air Systems templates). Formula chain and every fixed constant below
   were reverse-engineered from that workbook's cell formulas and verified to
   match its two worked examples to within rounding. This is an internal
   editor-only tool (never printed on the quotation) that feeds a computed
   tonnage into Annexure I — AC Distribution via "Add to AC Distribution". */

/* Orientation tables for solar/transmission gain — temp-diff and factor are
   fixed constants of this method (confirmed identical across both real
   example sheets, at two different Indian sites), NOT per-job inputs. Only
   the area per orientation is entered by the user. */
const GLASS_ORIENT = [
  { key:"N",  label:"North", tempDiff:23  },
  { key:"E",  label:"East",  tempDiff:12  },
  { key:"W",  label:"West",  tempDiff:163 },
  { key:"S",  label:"South", tempDiff:12  },
  { key:"NE", label:"N-E",   tempDiff:12  },
  { key:"NW", label:"N-W",   tempDiff:138 },
  { key:"SE", label:"S-E",   tempDiff:12  },
  { key:"SW", label:"S-W",   tempDiff:85  }
];
const GLASS_SOLAR_FACTOR = 0.56;
const WALL_ORIENT = [
  { key:"N",  label:"North", tempDiff:24 },
  { key:"E",  label:"East",  tempDiff:38 },
  { key:"W",  label:"West",  tempDiff:32 },
  { key:"S",  label:"South", tempDiff:36 },
  { key:"NE", label:"N-E",   tempDiff:30 },
  { key:"NW", label:"N-W",   tempDiff:26 },
  { key:"SE", label:"S-E",   tempDiff:38 },
  { key:"SW", label:"S-W",   tempDiff:34 }
];
const WALL_TRANS_FACTOR = 0.34;
const ROOF_TEMP_DIFF = 55;

function trunc2(x){ return Math.trunc(x*100 + (x<0?-1e-9:1e-9))/100; }

/* Pure calculation — safe to call on every keystroke, no DOM/state access. */
function calcHeatLoad(r){
  const area = num(r.area), height = num(r.height), airChanges = num(r.airChanges);
  const cfmPerPerson = num(r.cfmPerPerson), numPeople = num(r.numPeople);
  const outsideDB = num(r.outsideDB), outsideGR = num(r.outsideGR);
  const insideDB = num(r.insideDB), insideGR = num(r.insideGR);
  const dbDiff = outsideDB - insideDB;
  const grDiff = outsideGR - insideGR;

  const cfmVol = area*height*airChanges/60;
  const cfmOcc = cfmPerPerson*numPeople;
  const cfmCal = Math.max(cfmVol, cfmOcc);

  const glassRows = GLASS_ORIENT.map(function(o){
    const a = num((r.glass||{})[o.key]);
    return { key:o.key, label:o.label, area:a, tempDiff:o.tempDiff, factor:GLASS_SOLAR_FACTOR, gain:a*o.tempDiff*GLASS_SOLAR_FACTOR };
  });
  const glassTotal = glassRows.reduce(function(s,x){ return s+x.gain; },0);
  const glassAreaTotal = glassRows.reduce(function(s,x){ return s+x.area; },0);

  const wallRows = WALL_ORIENT.map(function(o){
    const a = num((r.wall||{})[o.key]);
    return { key:o.key, label:o.label, area:a, tempDiff:o.tempDiff, factor:WALL_TRANS_FACTOR, gain:a*o.tempDiff*WALL_TRANS_FACTOR };
  });
  const wallTotal = wallRows.reduce(function(s,x){ return s+x.gain; },0);

  const roofArea = num(r.roofArea), roofFactor = num(r.roofFactor);
  const roofGain = roofArea*ROOF_TEMP_DIFF*roofFactor;

  // AGLS = plain glass conduction (orientation-independent), factor 1.13.
  // Area is a direct manual entry — matches the reference workbook exactly,
  // where this is its own typed-in cell (not auto-derived from the glass
  // orientation areas; the two aren't always the same number on a real job).
  const aglsArea = num(r.aglsArea);
  const aglsGain = aglsArea*dbDiff*1.13;
  const partitionsArea = num(r.partitionsArea);
  const partitionsGain = partitionsArea*(dbDiff-5)*0.34;
  const ceilingArea = num(r.ceilingArea);
  const ceilingGain = ceilingArea*(dbDiff-5)*0.42;
  const floorArea = num(r.floorArea);
  const floorGain = floorArea*(dbDiff-5)*0.52;

  const bypassSensible = cfmCal*dbDiff*0.15*1.08;
  const bypassLatent = cfmCal*grDiff*0.15*0.68;

  const peopleSensible = numPeople*245;
  const peopleLatent = numPeople*205;
  const applianceWatts = num(r.applianceWatts);
  const applianceGain = applianceWatts*3.4;
  const lightingWattsPerSft = num(r.lightingWattsPerSft);
  const lightGain = (lightingWattsPerSft*area)*3.4*1.25;

  const subTotalSensible = glassTotal+wallTotal+roofGain+aglsGain+partitionsGain+ceilingGain+floorGain+bypassSensible+peopleSensible+applianceGain+lightGain;
  const safetySensible = subTotalSensible*0.125;
  const roomSensibleHeat = subTotalSensible+safetySensible;

  const subTotalLatent = bypassLatent+peopleLatent;
  const safetyLatent = trunc2(subTotalLatent*0.05);
  const roomLatentHeat = subTotalLatent+safetyLatent;

  const roomTotalHeat = roomSensibleHeat+roomLatentHeat;

  const oaSensible = cfmCal*dbDiff*0.85*1.08;
  const oaLatent = cfmCal*grDiff*0.85*0.68;
  const oaSubTotal = oaSensible+oaLatent;

  const total = roomTotalHeat+oaSubTotal;
  const heatGainSafety = total*0.03;
  const grandTotalHeat = total+heatGainSafety;
  const grandTotalTons = grandTotalHeat/12000;

  const shf = roomTotalHeat>0 ? trunc2(roomSensibleHeat/roomTotalHeat) : 0;
  const selectedADP = num(r.selectedADP);
  const dehumRise = 0.85*(insideDB-selectedADP);
  const dehumCfm = dehumRise>0 ? trunc2(roomSensibleHeat/1.08/dehumRise) : 0;
  const tonsAsPerCfm = dehumCfm/400;

  const tonnageRequired = Math.max(grandTotalTons, tonsAsPerCfm);

  return {
    cfmVol:cfmVol, cfmOcc:cfmOcc, cfmCal:cfmCal, dbDiff:dbDiff, grDiff:grDiff,
    glassRows:glassRows, glassTotal:glassTotal, glassAreaTotal:glassAreaTotal,
    wallRows:wallRows, wallTotal:wallTotal,
    roofGain:roofGain, aglsArea:aglsArea, aglsGain:aglsGain, partitionsGain:partitionsGain, ceilingGain:ceilingGain, floorGain:floorGain,
    bypassSensible:bypassSensible, bypassLatent:bypassLatent,
    peopleSensible:peopleSensible, peopleLatent:peopleLatent, applianceGain:applianceGain, lightGain:lightGain,
    subTotalSensible:subTotalSensible, safetySensible:safetySensible, roomSensibleHeat:roomSensibleHeat,
    subTotalLatent:subTotalLatent, safetyLatent:safetyLatent, roomLatentHeat:roomLatentHeat,
    roomTotalHeat:roomTotalHeat,
    oaSensible:oaSensible, oaLatent:oaLatent, oaSubTotal:oaSubTotal,
    total:total, heatGainSafety:heatGainSafety, grandTotalHeat:grandTotalHeat, grandTotalTons:grandTotalTons,
    shf:shf, dehumRise:dehumRise, dehumCfm:dehumCfm, tonsAsPerCfm:tonsAsPerCfm, tonnageRequired:tonnageRequired,
    btuPerSftGrand: area>0 ? trunc2(grandTotalHeat/area) : 0,
    btuPerSftSensible: area>0 ? trunc2(roomSensibleHeat/area) : 0,
    sftPerPerson: numPeople>0 ? area/numPeople : 0,
    cfmPerSft: area>0 ? dehumCfm/area : 0,
    tonsPerSft: area>0 ? tonsAsPerCfm/area : 0,
    tonsPerPerson: numPeople>0 ? tonsAsPerCfm/numPeople : 0,
    dehumCfmPerTon: tonsAsPerCfm>0 ? dehumCfm/tonsAsPerCfm : 0,
    areaPerTon: tonsAsPerCfm>0 ? area/tonsAsPerCfm : 0
  };
}

      { label:"Sub Total", value:fmtNum(r.subTotalSensible,0) },

function heatLoadDocumentHTML(q, c){
  const jobLabel = heatLoadJobLabel(q);
  const dateStr = hldFmtDateSlash(q.date);
  const rooms = q.heatLoadRooms||[];
  /* A single-room job doesn't need its own cover page — the cover's
     banner and totals would just be the one room's own numbers a second
     time. Fold the title/meta block straight onto the room's first page
     instead, saving a full page on the common case. Multi-room jobs keep
     the standalone cover, since the "Rooms in this Job" summary table
     there is genuinely doing something a single room page can't. */
  if(rooms.length === 1){
    const totalPages = 3;
    const headerBlock = heatLoadDocHeaderBlockHTML(q, c, jobLabel);
    return heatLoadRoomPagesHTML(rooms[0], c, jobLabel, dateStr, 1, totalPages, headerBlock).join("");
  }
  const totalPages = 1 + rooms.length*3;
  let pageNum = 1;
  let html = heatLoadCoverPageHTML(q, c, pageNum, totalPages);
  rooms.forEach(function(room){
    pageNum += 1;
    const pages = heatLoadRoomPagesHTML(room, c, jobLabel, dateStr, pageNum, totalPages);
    html += pages.join("");
    pageNum += 3;
  });
  return html;
}

// Returns the linked site's installation-base equipment rows for an AMC
// quote draft (or [] if no customer/site is linked yet).
function serviceSiteEquipment(q){
  if(!q || !q.siteId || !q.customerId) return [];
  const c = findServiceCustomer(q.customerId);
  const site = c ? (c.sites||[]).find(function(s){ return s.id===q.siteId; }) : null;
  return site ? (site.equipment||[]) : [];
}
function equipmentBaseName(eq){
  const parts = [];
  if(eq.acType) parts.push(eq.acType);
  if(eq.capacity) parts.push(eq.capacity);
  let label = parts.join(" – ") || "AC unit";
  const mm = [eq.make, eq.model].filter(Boolean).join(" ");
  if(mm) label += " ("+mm+")";
  return label;
}
function equipmentDropdownLabel(eq){
  let label = equipmentBaseName(eq);
  if(eq.qty) label += " — Qty "+eq.qty;
  return label;
}
function siteDropdownItemsHTML(customerId, query){
  const c = customerId ? findCustomer(customerId) : null;
  const sites = c ? (c.sites||[]) : [];
  const q = (query||"").trim().toLowerCase();
  let html = "<div class=\"catalog-dropdown-item\" data-action=\"select-site-item\" data-site-id=\"\"><span>— No specific site (clear) —</span></div>";
  if(!c){
    html += "<div class=\"catalog-dropdown-empty\">Select a customer above to pick from their saved sites, or just type a custom address</div>";
    return html;
  }
  const filtered = q ? sites.filter(function(s){
    return (s.label||"").toLowerCase().indexOf(q)!==-1 || (s.addressLines||"").toLowerCase().indexOf(q)!==-1;
  }) : sites;
  if(!filtered.length){
    html += "<div class=\"catalog-dropdown-empty\">"+(sites.length ? "No matching sites" : "No saved sites for this customer — add one in the Customers tab, or just type a custom address")+"</div>";
    return html;
  }
  filtered.forEach(function(s){
    const preview = (s.addressLines||"").split("\n")[0]||"";
    html += "<div class=\"catalog-dropdown-item\" data-action=\"select-site-item\" data-site-id=\""+s.id+"\"><span><b>"+esc(s.label||"(untitled site)")+"</b>"+(preview?(" — "+esc(preview)):"")+"</span></div>";
  });
  return html;
}
function closeSiteDropdown(){
  const dd = document.querySelector("[data-site-dropdown]");
  if(dd) dd.hidden = true;
}
function openSiteDropdown(customerId, query){
  const dd = document.querySelector("[data-site-dropdown]");
  if(!dd) return;
  dd.innerHTML = siteDropdownItemsHTML(customerId, query||"");
  dd.hidden = false;
}
function selectSiteInDraft(siteId){
  if(!view.draft) return;
  const c = view.draft.customerId ? findCustomer(view.draft.customerId) : null;
  const site = (siteId && c) ? (c.sites||[]).find(function(s){ return s.id===siteId; }) : null;
  view.draft.siteId = site ? site.id : null;
  view.draft.client.siteAddressLines = site ? (site.addressLines||"") : "";
  closeSiteDropdown();
  renderApp();
}

/* Copies a customer's (and optionally a site's) address into the quote
   draft's printable client snapshot — a one-time copy, not a live link, so
   a quote already sent to a client stays frozen even if the customer
   record is corrected later. Re-selecting a customer/site overwrites the
   snapshot again, which is the expected "pick and fill" behaviour. */
function applyCustomerToDraft(q, customerId, siteId){
  q.customerId = customerId || null;
  q.siteId = null;
  if(!customerId){ return; }
  const c = q.quoteType==="service" ? findServiceCustomer(customerId) : findCustomer(customerId);
  if(!c) return;
  q.client.name = c.name;
  q.client.addressLines = c.billingAddressLines || "";
  q.client.siteAddressLines = "";
  if(siteId){
    const site = (c.sites||[]).find(function(s){ return s.id===siteId; });
    if(site){ q.siteId = site.id; q.client.siteAddressLines = site.addressLines || ""; }
  }
}

function productDropdownItemsHTML(section, query){
  const all = state.products.filter(function(p){ return p.section===section; });
  const q = (query||"").trim().toLowerCase();
  const items = q ? all.filter(function(p){
    return (p.name||"").toLowerCase().indexOf(q)!==-1 || (p.category||"").toLowerCase().indexOf(q)!==-1;
  }) : all;
  if(!items.length){
    return "<div class=\"catalog-dropdown-empty\">"+(all.length ? "No matches" : "No products in catalog yet")+"</div>";
  }
  const byCat = {};
  items.forEach(function(p){ (byCat[p.category||"Other"] = byCat[p.category||"Other"]||[]).push(p); });
  let html = "";
  Object.keys(byCat).sort().forEach(function(cat){
    html += "<div class=\"catalog-dropdown-group\">"+esc(cat)+"</div>";
    byCat[cat].forEach(function(p){
      html += "<div class=\"catalog-dropdown-item\" data-action=\"select-catalog-item\" data-part=\""+section+"\" data-id=\""+p.id+"\">"+
        "<span>"+esc(p.name)+"</span><span class=\"catalog-dropdown-rate\">"+fmtINR(p.rate)+"</span>"+
      "</div>";
    });
  });
  return html;
}

function closeCatalogDropdown(part){

function addCatalogItemToDraft(part, pid){
  const prod = state.products.find(function(p){ return p.id===pid; });
  if(!prod) return;
  const arr = view.draft[part==="A"?"partA":"partB"];
  arr.push({ id: rowIdCounter(), name: prod.name, unit: prod.unit, qty:1, rate: prod.rate, discount:0, hsn: prod.hsn||"" });

function amcApprovalHTML(q){
  const canApprove = !isClientId(q.id) && (isDeptDirector() || (myProfile && q.createdBy===myProfile.id));
  if(q.clientApproved){
    const approver = findEmployeeAny(q.clientApprovedBy);
    return "<div class=\"status-banner ok section-gap\">Client approved"+(approver?" by "+esc(approver.fullName):"")+(q.clientApprovedAt?" on "+fmtDate(q.clientApprovedAt.slice(0,10)):"")+" — this AMC contract is live in the Service department's AMC database, with its 4 PM visits scheduled.</div>";
  }
  if(isClientId(q.id)){
    return "<div class=\"status-banner info section-gap\">Save this quote first, then mark it \"Client Approved\" once the client has signed off — that's what opens the AMC contract and schedules the 4 PM visits.</div>";
  }
  if(q.status!=="final"){
    return "<div class=\"status-banner info section-gap\">Set Status to \"Final\" and save, then mark it \"Client Approved\" once the client has signed off.</div>";
  }
  if(!canApprove) return "";
  return "<div class=\"status-banner warn section-gap\" style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap\">"+
    "<span>Once the client has signed off on this AMC offer, mark it approved to open the contract and start the 4 PM visit schedule.</span>"+
    "<button class=\"btn btn-primary\" data-action=\"mark-amc-approved\">Mark Client Approved</button>"+
  "</div>";
}

/* ---- live recompute without full re-render ---- */
function recomputeEditorTotals(){
  const q = view.draft;
  if(!q) return;
  const t = quoteTotals(q);
  const map = { aTotal:t.aTotal, bTotal:t.bTotal, grandIncl:t.grandIncl, amcSub:t.aSub, amcGst:t.aGst };
  Object.keys(map).forEach(function(k){
    const el = document.querySelector("[data-total='"+k+"']");
    if(el) el.textContent = fmtINR(map[k]);
  });
}

function productsGrouped(){
  const groups = { A:{}, B:{} };
  state.products.forEach(function(p){

    cats.forEach(function(cat){

      groups[cat].forEach(function(p){ rows += productRowHTML(p); });

    "<h3 class=\"section-title\">"+esc(sectionLabel)+"</h3>"+

/* Phase 1: department documents (MRS, Delivery Challan, Field Service Report,
   HO Report), all single-level approval (the creating department's head, or
   the director). "department" on a document is whichever department created
   and owns it — staff can only file into their own department; a director
   picks one explicitly since they don't belong to any single department. */

// Used for the Departments module's optional "linked site" field on a
// document (e.g. a Field Service Report) — pools sites from both Sales' and
// Service's separate customer databases, since either department can raise
// documents.
function allSitesFlat(){
  const out = [];
  state.customers.forEach(function(c){
    (c.sites||[]).forEach(function(s){ out.push({ id:s.id, label:c.name+" — "+(s.label||"Site") }); });
  });
  state.serviceCustomers.forEach(function(c){
    (c.sites||[]).forEach(function(s){ out.push({ id:s.id, label:c.name+" — "+(s.label||"Site") }); });
  });
  return out;
}
function quoteOptionsFlat(){
  return state.quotes.map(function(q){ return { id:q.id, label:q.quoteNo+" — "+((q.client&&q.client.name)||"—") }; });
}
function docStatusBadgeHTML(status){
  const cls = status==="approved" ? "badge-final" : status==="rejected" ? "badge-rejected" : "badge-draft";
  return "<span class=\"badge "+cls+"\"><span class=\"badge-dot\"></span>"+esc(DOC_STATUS_LABELS[status]||status)+"</span>";
}
function documentCardHTML(doc, opts){
  const isPartnerView = opts && opts.partnerView;
  const canApprove = !isPartnerView && doc.status==="pending" && canApproveInDept(doc.department);
  const creator = findEmployeeAny(doc.createdBy);
  const approver = findEmployeeAny(doc.approvedBy);
  const quote = doc.linkedQuoteId ? state.quotes.find(function(q){ return q.id===doc.linkedQuoteId; }) : null;
  const site = doc.linkedSiteId ? allSitesFlat().find(function(s){ return s.id===doc.linkedSiteId; }) : null;
  return "<div class=\"doc-card\" data-doc-id=\""+doc.id+"\">"+
    "<div class=\"doc-card-top\">"+
      "<div><span class=\"doc-type-tag\">"+esc(DOC_TYPE_LABELS[doc.docType]||doc.docType)+"</span>"+
        (isPartnerView ? "<span class=\"hint\" style=\"margin-left:8px\">"+esc(DEPARTMENT_LABELS[doc.department])+"</span>" : "")+
      "</div>"+
      docStatusBadgeHTML(doc.status)+
    "</div>"+
    "<div class=\"doc-card-title\">"+esc(doc.title||"(untitled)")+"</div>"+
    (doc.notes ? "<div class=\"doc-card-notes\">"+esc(doc.notes)+"</div>" : "")+
    (quote ? "<div class=\"doc-card-meta\">Quote: "+esc(quote.quoteNo)+" — "+esc((quote.client&&quote.client.name)||"")+"</div>" : "")+
    (site ? "<div class=\"doc-card-meta\">Site: "+esc(site.label)+"</div>" : "")+
    (doc.filePath ? "<div class=\"doc-card-meta\"><button class=\"btn btn-sm btn-ghost\" data-action=\"open-doc-file\" data-id=\""+doc.id+"\">📎 "+esc(doc.fileName||"View PDF")+"</button></div>" : "")+
    "<div class=\"doc-card-foot\">"+
      "<span class=\"hint\">"+(creator?esc(creator.fullName):"—")+" · "+(doc.createdAt?new Date(doc.createdAt).toLocaleDateString("en-IN"):"")+"</span>"+
      (doc.status!=="pending" ? "<span class=\"hint\">"+(doc.status==="approved"?"Approved":"Rejected")+" by "+(approver?esc(approver.fullName):"—")+(doc.approvalNote?" — "+esc(doc.approvalNote):"")+"</span>" : "")+

/* ---- Field Service Report (FSR) — one per PM visit, auto-filled from the
   customer/site/contract/technician data already on file, saved as a single
   jsonb blob (mirrors quotes.data) independently of the visit's
   completed/closed status so a technician can save progress mid-job. ---- */
function fsrDefaultsFor(v){
  const contract = state.amcContracts.find(function(c){ return c.id===v.contractId; });
  const customer = contract && contract.customerId ? findServiceCustomer(contract.customerId) : null;
  const site = contract && contract.siteId && customer ? (customer.sites||[]).find(function(s){ return s.id===contract.siteId; }) : null;
  const sourceQuote = contract ? state.quotes.find(function(q){ return q.id===contract.quoteId; }) : null;
  const assignedEmp = findEmployeeAny(v.assignedTo);
  const equip = site ? (site.equipment||[]) : [];
  const singleEq = equip.length===1 ? equip[0] : null;
  const today = todayISO();
  return {
    customerName:(customer&&customer.name)||"",
    customerAddress:(site&&site.addressLines)||(customer&&customer.billingAddressLines)||"",
    type:{ amc:true, warranty:false, postWarranty:false, commissioning:false },
    technicianName:(assignedEmp&&assignedEmp.fullName)||"",
    complaintNo:"", complaintDate:today, complaintTime:"",
    // "base" = picked from the site's installation-base equipment (capacity/
    // equipment/model auto-filled and locked to the picked entry); "custom" =
    // freely typed. Defaults to "base" only when the site actually has
    // equipment on file to pick from.
    equipmentMode: equip.length ? "base" : "custom",
    capacity:singleEq?(singleEq.capacity||""):"", equipment:singleEq?equipmentBaseName(singleEq):"", model:singleEq?(singleEq.model||""):"",
    equipmentId:singleEq?(singleEq.id||""):"",
    serviceReportNo:"", reportDate:today,
    purpose:{ prevMaintenance:true, breakDown:false, adjSetting:false, customerEducation:false, warrantyClaim:false, other:false, otherText:"" },
    personName:(sourceQuote&&sourceQuote.amc&&sourceQuote.amc.contactPerson)||"",
    srNoEquipment:"", natureOfComplaint:"", compressorNo:"",
    attendedDate:today, attendedTime:"", completionTime:"",
    observationWorkDone:"", supplyAmcWoNo:(sourceQuote&&sourceQuote.quoteNo)||"",
    spares:[], customerRemarks:"",
    technicianSignDate:"", customerSignDate:""
  };
}
// Auto-filled defaults, with whatever's already been saved on the visit
// layered on top (a saved empty value still wins — that's the technician
// deliberately clearing it, not a gap to re-fill) — EXCEPT technicianName,
// which always tracks whoever is currently assigned rather than freezing
// whatever name happened to be saved earlier, so re-assigning the job
// updates it automatically everywhere (form, print, PDF) with no extra step.
function fsrDataFor(v){
  const defaults = fsrDefaultsFor(v);
  const saved = v.fsr||{};
  const merged = Object.assign({}, defaults, saved);
  merged.type = Object.assign({}, defaults.type, saved.type||{});
  merged.purpose = Object.assign({}, defaults.purpose, saved.purpose||{});
  merged.spares = (saved.spares && saved.spares.length) ? saved.spares : defaults.spares;
  merged.technicianName = defaults.technicianName;
  return merged;
}
function ensureFsrDraft(visitId){
  if(view.fsrDraftVisitId===visitId && view.fsrDraft) return;

function visitsDueThisMonth(){
  const now = new Date();
  return state.amcVisits.filter(function(v){
    if(v.status==="completed"||v.status==="verified") return false;
    const d = new Date(v.scheduledDate+"T00:00:00");
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  });
}
function visitsOverdue(){
  const today = new Date(new Date().toDateString());
  return state.amcVisits.filter(function(v){
    if(v.status==="completed"||v.status==="verified") return false;
    const d = new Date(v.scheduledDate+"T00:00:00");
    return d < today && !(d.getFullYear()===today.getFullYear() && d.getMonth()===today.getMonth());
  });
}
function visitsChargeableAwaitingBilling(){
  return state.amcVisits.filter(function(v){ return v.hasChargeable && (v.status==="completed"||v.status==="verified"); });

function contractVisits(contract){
  return state.amcVisits.filter(function(v){ return v.contractId===contract.id; }).sort(function(a,b){ return a.pmNumber-b.pmNumber; });
}
// "date" sort: nearest not-yet-closed visit first (most urgent at the top);
// contracts whose all 4 visits are closed sink to the bottom, most-recently
// closed first among those. "name" sort: customer name A→Z.
function contractSortKey(contract, mode){
  if(mode==="name"){
    const customer = contract.customerId ? findServiceCustomer(contract.customerId) : null;
    return (customer&&customer.name)||"";
  }
  const visits = contractVisits(contract);
  const open = visits.filter(function(v){ return v.status!=="verified"; });
  if(open.length){
    return open.slice().sort(function(a,b){ return (a.scheduledDate||"").localeCompare(b.scheduledDate||""); })[0].scheduledDate||"";
  }
  const closed = visits.slice().sort(function(a,b){ return (b.scheduledDate||"").localeCompare(a.scheduledDate||""); });
  return "9999-"+((closed[0]&&closed[0].scheduledDate)||"");
}
function pmsChipHTML(v){
  const info = amcVisitStatusInfo(v);
  const cls = v.status==="verified" ? "pms-chip-done" : (v.status==="completed" ? "pms-chip-progress" : "pms-chip-due");
  const overdue = (v.status==="pending"||v.status==="assigned") && new Date(v.scheduledDate+"T00:00:00") < new Date(new Date().toDateString());
  return "<span class=\"pms-chip "+cls+(overdue?" pms-chip-overdue":"")+"\">PM"+v.pmNumber+" · "+esc(overdue?"Overdue":info.label)+"</span>";
}
// One row per customer/contract (a customer with more than one AMC site has
// one row per contract — the site name in the row tells them apart), showing
// all 4 PM visits as compact status chips; clicking the row expands it into
// the 4 PM tabs, each opening that visit's full detail (assignment, FSR
// form, attachments, submit/close).
function pmsRowHTML(contract){
  const customer = contract.customerId ? findServiceCustomer(contract.customerId) : null;
  const site = contract.siteId && customer ? (customer.sites||[]).find(function(s){ return s.id===contract.siteId; }) : null;
  const visits = contractVisits(contract);
  const expanded = view.pmsExpandedContractId===contract.id;
  let html = "<div class=\"card card-pad pms-row-card section-gap\">"+
    "<button class=\"pms-row-header\" data-action=\"toggle-pms-row\" data-id=\""+contract.id+"\">"+
      "<div class=\"pms-row-title\"><b>"+esc((customer&&customer.name)||"—")+"</b>"+(site?" <span class=\"hint\">— "+esc(site.label)+"</span>":"")+
        "<div class=\"hint\">"+fmtDate(contract.contractStart)+(contract.contractEnd?(" to "+fmtDate(contract.contractEnd)):"")+"</div></div>"+
      "<div class=\"pms-chip-row\">"+visits.map(pmsChipHTML).join("")+"</div>"+
      "<span class=\"pms-row-caret\">"+(expanded?"▲":"▼")+"</span>"+
    "</button>";
  if(expanded){
    const activeVisit = visits.find(function(v){ return v.id===view.pmsActiveVisitTab; }) || visits[0];
    html += "<div class=\"pms-tabstrip\">"+visits.map(function(v){
      const info = amcVisitStatusInfo(v);
      return "<button class=\"pms-tab"+(activeVisit&&activeVisit.id===v.id?" active":"")+"\" data-action=\"select-pms-tab\" data-id=\""+v.id+"\">PM "+v.pmNumber+"<span class=\"pms-tab-status\">"+esc(info.label)+"</span></button>";
    }).join("")+"</div>";
    if(activeVisit) html += "<div class=\"pms-tab-panel\">"+amcVisitDetailHTML(activeVisit,{managerView:true})+"</div>";
  }
  html += "</div>";
  return html;
}
function pmsFilteredSortedContracts(){
  const q = (view.pmsSearch||"").trim().toLowerCase();
  let list = state.amcContracts.slice();
  if(q){
    list = list.filter(function(c){
      const customer = c.customerId ? findServiceCustomer(c.customerId) : null;
      return customer && (customer.name||"").toLowerCase().indexOf(q)!==-1;
    });
  }
  const mode = view.pmsSort||"date";
  list.sort(function(a,b){ return contractSortKey(a,mode).localeCompare(contractSortKey(b,mode)); });
  return list;
}

/* ============================== AC Service / AMC document (always 3 pages) ==============================
   Page 1 is the offer letter with the machine/rate table; page 2 is the
   "Copy of Contract" cover — parties, and the Scope of Contract (what's
   covered / spares free of cost / exclusions); page 3 is the general terms
   & conditions, the contract-details block and signatures. This layout is
   fixed regardless of the classic/modern doc-template setting — the AMC
   format intentionally looks different from the AC Project quote. */
function amcGstRowsHTML(q,t){
  const isIgst = (q.amc||{}).gstType==="IGST";
  if(isIgst){
    return "<tr class=\"sub\"><td colspan=\"5\" style=\"text-align:right\">IGST @ "+fmtNum(q.gstPercent,1)+"% Extra</td><td class=\"num\">"+fmtINR(t.aGst)+"</td></tr>";
  }
  const half = t.aGst/2, halfPct = num(q.gstPercent)/2;
  return "<tr class=\"sub\"><td colspan=\"5\" style=\"text-align:right\">CGST @ "+fmtNum(halfPct,1)+"% Extra</td><td class=\"num\">"+fmtINR(half)+"</td></tr>"+
    "<tr class=\"sub\"><td colspan=\"5\" style=\"text-align:right\">SGST @ "+fmtNum(halfPct,1)+"% Extra</td><td class=\"num\">"+fmtINR(half)+"</td></tr>";
}
function amcDocTableHTML(q,t){
  const items = q.amcItems||[];
  const rowCount = Math.max(items.length,1);
  const planLabelHtml = nl2br(q.amcPlanLabel||"Annual Maintenance Contract");
  const rows = items.length ? items.map(function(it,i){
    return "<tr>"+(i===0?"<td rowspan=\""+rowCount+"\" style=\"width:130px;text-align:center;vertical-align:middle;font-weight:600\">"+planLabelHtml+"</td>":"")+
      "<td>"+esc(it.name)+"</td><td style=\"width:78px\">"+esc(it.hsn||"")+"</td><td class=\"num\" style=\"width:50px\">"+fmtNum(it.qty)+"</td><td class=\"num\" style=\"width:84px\">"+fmtNum(it.rate)+"</td><td class=\"num\" style=\"width:104px\">"+fmtNum(num(it.qty)*num(it.rate))+"</td></tr>";
  }).join("") : "<tr><td style=\"width:130px;text-align:center;vertical-align:middle;font-weight:600\">"+planLabelHtml+"</td><td colspan=\"5\" style=\"text-align:center;color:#8993A3\">No machines added</td></tr>";
  return "<table class=\"doc-table\"><thead><tr><th>Type of contract</th><th>Description of machine</th><th>HSN/SAC</th><th class=\"num\">Qty</th><th class=\"num\">Rate</th><th class=\"num\">Amount</th></tr></thead><tbody>"+
    rows+
    "<tr class=\"sub\"><td colspan=\"5\" style=\"text-align:right\">Basic Total :</td><td class=\"num\">"+fmtINR(t.aSub)+"</td></tr>"+
    amcGstRowsHTML(q,t)+
    "<tr class=\"grand\"><td colspan=\"5\" style=\"text-align:right\"><b>Grand Total</b></td><td class=\"num\"><b>"+fmtINR(t.aTotal)+"</b></td></tr>"+

}

    "<div class=\"sign-block\">Thanking You,<br>"+esc(c.signatoryLine)+

/* The quotation is always exactly four pages: Cover, AC Unit Distribution
   (Annexure I, shown even when no rows are entered yet), BOQ (Annexure II),
   and Terms & Conditions (Annexure III) — each wrapped in the same
   repeating letterhead via docPage(). */
function renderQuoteDocumentInner(q,t,c){
