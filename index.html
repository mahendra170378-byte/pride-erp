/* ============================== event wiring ============================== */

function setField(obj, path, value){
  const parts = path.split(".");
  let cur = obj;
  for(let i=0;i<parts.length-1;i++){ cur = cur[parts[i]]; }
  cur[parts[parts.length-1]] = value;
}
function getField(obj, path){
  const parts = path.split(".");
  let cur = obj;
  for(let i=0;i<parts.length;i++){ if(cur==null) return undefined; cur = cur[parts[i]]; }
  return cur;
}
// Belt-and-braces sync: every [data-field] element's live on-screen value is
// re-applied to the draft right before it's saved. Normally onAppInput keeps
// the draft in lockstep with the DOM on every keystroke, but this catches
// the odd case where a value changed without an "input" event actually
// reaching us (browser autofill, some mobile keyboards, a date picker
// commit) — so what's on screen when you hit Save is always what gets
// saved, regardless of cause.
function syncEditorFieldsFromDom(q){
  if(!q) return;
  document.querySelectorAll("#app [data-field]").forEach(function(el){
    let val = el.value;
    if(el.dataset.field==="gstPercent") val = num(val);
    setField(q, el.dataset.field, val);
  });
}

function attachGlobalHandlers(){
  const app = byId("app");

  app.addEventListener("click", onAppClick);
  app.addEventListener("change", onAppChange);
  app.addEventListener("input", onAppInput);
  app.addEventListener("focusin", onAppFocusIn);
  app.addEventListener("keydown", onAppKeydown);
  document.addEventListener("click", onDocumentClickCloseCatalog);

  updatePersistIndicator();
}

function onAppFocusIn(e){
  const t = e.target;
  if(t.dataset && t.dataset.catalogInput){
    openCatalogDropdown(t.dataset.catalogInput, t.value);
  }
  if(t.dataset && t.dataset.siteInput){
    openSiteDropdown(view.draft ? view.draft.customerId : null, t.value);
  }
}

function onAppKeydown(e){
  const t = e.target;
  if(t.dataset && t.dataset.siteInput){
    if(e.key==="Escape") closeSiteDropdown();
    return;
  }
  if(!(t.dataset && t.dataset.catalogInput)) return;
  const part = t.dataset.catalogInput;
  if(e.key==="Enter"){
    e.preventDefault();
    const dd = document.querySelector("[data-catalog-dropdown='"+part+"']");
    const first = dd && !dd.hidden && dd.querySelector(".catalog-dropdown-item[data-id]");
    if(first) addCatalogItemToDraft(part, first.dataset.id);
  }else if(e.key==="Escape"){
    closeCatalogDropdown(part);
  }
}

function onDocumentClickCloseCatalog(e){
  document.querySelectorAll("[data-catalog-dropdown]:not([hidden])").forEach(function(dd){
    const picker = dd.closest("[data-catalog-picker]");
    if(picker && !picker.contains(e.target)) dd.hidden = true;
  });
  const sitedd = document.querySelector("[data-site-dropdown]:not([hidden])");
  if(sitedd){
    const picker = sitedd.closest("[data-site-picker]");
    if(picker && !picker.contains(e.target)) sitedd.hidden = true;
  }
}

function onAppInput(e){
  const t = e.target;
  if(t.id==="pms-search"){
    view.pmsSearch = t.value;
    renderPmsList();
    return;
  }
  const fsrForm = t.closest("[data-fsr-form]");
  if(fsrForm && t.dataset.ffield){
    ensureFsrDraft(fsrForm.dataset.visitId);
    setField(view.fsrDraft, t.dataset.ffield, t.value);
    return;
  }
  if(fsrForm){
    const spareRow = t.closest("tr[data-frow-id]");
    if(spareRow){
      ensureFsrDraft(fsrForm.dataset.visitId);
      const sp = (view.fsrDraft.spares||[]).find(function(s){ return s.id===spareRow.dataset.frowId; });
      if(sp){
        if(t.classList.contains("fsr-sp-code")) sp.partCode = t.value;
        else if(t.classList.contains("fsr-sp-desc")) sp.description = t.value;
        else if(t.classList.contains("fsr-sp-qty")) sp.qty = t.value;
        else if(t.classList.contains("fsr-sp-rs")) sp.priceRs = t.value;
        else if(t.classList.contains("fsr-sp-ps")) sp.pricePs = t.value;
      }
      return;
    }
  }
  if(view.tab==="editor" && view.draft){
    if(t.dataset.catalogInput){
      openCatalogDropdown(t.dataset.catalogInput, t.value);
      return;
    }
    if(t.dataset.siteInput){
      openSiteDropdown(view.draft.customerId, t.value);
      setField(view.draft, "client.siteAddressLines", t.value);
      return;
    }
    if(t.dataset.field){
      let val = t.value;
      if(t.dataset.field==="gstPercent") val = num(val);
      setField(view.draft, t.dataset.field, val);
      if(t.dataset.field==="gstPercent") recomputeEditorTotals();
      return;
    }
    const hlRoomEl = t.closest("[data-hlroom-id]");
    if(hlRoomEl && t.dataset.hlPath){
      const room = (view.draft.heatLoadRooms||[]).find(function(x){ return x.id===hlRoomEl.dataset.hlroomId; });
      if(room){
        const path = t.dataset.hlPath;
        const val = path==="name" ? t.value : num(t.value);
        setHeatLoadField(room, path, val);
        if(path==="outsideDB" || path==="insideDB"){
          const cEl = hlRoomEl.querySelector("[data-hl-c-for=\""+path+"\"]");
          if(cEl) cEl.textContent = "≈ "+fmtNum(fToC(val),1)+" °C";
        }
        const resBlock = hlRoomEl.querySelector("[data-hl-resultsblock]");
        if(resBlock) resBlock.outerHTML = heatLoadResultsBlockHTML(room);
      }
      return;
    }
    const amcRow = t.closest("[data-amc-items-body] tr[data-row-id]");
    if(amcRow){
      const item = (view.draft.amcItems||[]).find(function(i){ return i.id===amcRow.dataset.rowId; });
      if(item){
        if(t.classList.contains("amc-item-name")) item.name = t.value;
        else if(t.classList.contains("amc-item-hsn")) item.hsn = t.value;
        else if(t.classList.contains("amc-item-qty")) item.qty = num(t.value);
        else if(t.classList.contains("amc-item-rate")) item.rate = num(t.value);
        if(t.classList.contains("amc-item-qty")||t.classList.contains("amc-item-rate")){
          const amt = num(item.qty)*num(item.rate);
          const cell = amcRow.querySelector("[data-amc-amount-for='"+item.id+"']");
          if(cell) cell.textContent = fmtINR(amt);
          if(t.classList.contains("amc-item-qty")) updateAmcMachineCount();
          recomputeEditorTotals();
        }
      }
      return;
    }
    const row = t.closest("tr[data-row-id]");
    if(row){
      const part = row.dataset.part;
      const item = view.draft[part==="A"?"partA":"partB"].find(function(i){ return i.id===row.dataset.rowId; });
      if(item){
        if(t.classList.contains("item-name")) item.name = t.value;
        else if(t.classList.contains("item-hsn")) item.hsn = t.value;
        else if(t.classList.contains("item-unit")) item.unit = t.value;
        else if(t.classList.contains("item-qty")) item.qty = num(t.value);
        else if(t.classList.contains("item-rate")) item.rate = num(t.value);
        else if(t.classList.contains("item-discount")) item.discount = Math.min(100, Math.max(0, num(t.value)));
        if(t.classList.contains("item-qty")||t.classList.contains("item-rate")||t.classList.contains("item-discount")){
          const amt = itemAmount(item);
          const cell = row.querySelector("[data-amount-for='"+item.id+"']");
          if(cell) cell.textContent = fmtINR(amt);
          recomputeEditorTotals();
        }
      }
      return;
    }
    const drow = t.closest("tr[data-drow-id]");
    if(drow){
      const r = view.draft.distribution.find(function(x){ return x.id===drow.dataset.drowId; });
      if(r){
        if(t.classList.contains("d-area")) r.area = t.value;
        else if(t.classList.contains("d-unittype")) r.unitType = t.value;
        else if(t.classList.contains("d-capacity")) r.capacity = num(t.value);
        else if(t.classList.contains("d-qty")) r.qty = num(t.value);
        if(t.classList.contains("d-capacity")||t.classList.contains("d-qty")){
          const cell = drow.querySelector("[data-dtotal-for='"+r.id+"']");
          if(cell) cell.textContent = fmtNum(num(r.capacity)*num(r.qty),2)+" TR";
          const totalsRow = document.querySelector("[data-dist-totals]");
          if(totalsRow){
            const qtyCell = totalsRow.querySelector(".dist-total-qty");
            const trCell = totalsRow.querySelector(".dist-total-tr");
            if(qtyCell) qtyCell.textContent = fmtNum(distributionTotalQty(view.draft.distribution),0);
            if(trCell) trCell.textContent = fmtNum(distributionTotalTR(view.draft.distribution),2)+" TR";
          }
        }
      }
      return;
    }
    const termRow = t.closest(".term-row[data-term-idx]");
    if(termRow && termRow.closest("[data-terms-list]")){
      const idx = Number(termRow.dataset.termIdx);
      const term = view.draft.terms[idx];
      if(term){
        if(t.classList.contains("term-label")) term.label = t.value;
        else if(t.classList.contains("term-value")) term.value = t.value;
      }
      return;
    }
  }
  if(view.tab==="customer-editor" && view.customerDraft){
    if(t.dataset.cfield){
      setField(view.customerDraft, t.dataset.cfield, t.value);
      return;
    }
    const siteCard = t.closest(".site-card[data-site-idx]");
    if(siteCard){
      const site = view.customerDraft.sites[Number(siteCard.dataset.siteIdx)];
      if(site){
        if(t.classList.contains("site-label")) site.label = t.value;
        else if(t.classList.contains("site-address")) site.addressLines = t.value;
        else if(t.classList.contains("site-pincode")) site.pincode = t.value;
      }
      return;
    }
  }
  if(view.tab==="service-customer-editor" && view.serviceCustomerDraft){
    if(t.dataset.cfield){
      setField(view.serviceCustomerDraft, t.dataset.cfield, t.value);
      return;
    }
    const siteCard = t.closest(".site-card[data-site-idx]");
    if(siteCard){
      const site = view.serviceCustomerDraft.sites[Number(siteCard.dataset.siteIdx)];
      if(site){
        const eqRow = t.closest(".equip-row[data-eq-idx]");
        if(eqRow){
          const eq = (site.equipment||[])[Number(eqRow.dataset.eqIdx)];
          if(eq){
            if(t.classList.contains("eq-type")) eq.acType = t.value;
            else if(t.classList.contains("eq-capacity")) eq.capacity = t.value;
            else if(t.classList.contains("eq-qty")) eq.qty = t.value;
            else if(t.classList.contains("eq-make")) eq.make = t.value;
            else if(t.classList.contains("eq-model")) eq.model = t.value;
          }
          return;
        }
        if(t.classList.contains("site-label")) site.label = t.value;
        else if(t.classList.contains("site-address")) site.addressLines = t.value;
        else if(t.classList.contains("site-pincode")) site.pincode = t.value;
      }
      return;
    }
  }
}

function onAppChange(e){
  const t = e.target;
  const fsrForm = t.closest("[data-fsr-form]");
  if(fsrForm){
    if(t.dataset.ffield && t.type==="checkbox"){
      ensureFsrDraft(fsrForm.dataset.visitId);
      setField(view.fsrDraft, t.dataset.ffield, t.checked);
      return renderApp();
    }
    if(t.dataset.role==="fsr-equip-pick"){
      const visitId = fsrForm.dataset.visitId;
      const v = state.amcVisits.find(function(x){ return x.id===visitId; });
      const contract = v && state.amcContracts.find(function(c){ return c.id===v.contractId; });
      const customer = contract && contract.customerId ? findServiceCustomer(contract.customerId) : null;
      const site = contract && contract.siteId && customer ? (customer.sites||[]).find(function(s){ return s.id===contract.siteId; }) : null;
      const eq = site && (site.equipment||[]).find(function(x){ return x.id===t.value; });
      if(eq){
        ensureFsrDraft(visitId);
        view.fsrDraft.equipmentId = eq.id;
        view.fsrDraft.capacity = eq.capacity||"";
        view.fsrDraft.equipment = equipmentBaseName(eq);
        view.fsrDraft.model = eq.model||"";
      }
      return renderApp();
    }
  }
  if(t.dataset.role==="fsr-photos-input" && t.type==="file"){
    const visitId = t.dataset.visitId;
    if(visitId && t.files && t.files.length){
      view.fsrPendingPhotos = view.fsrPendingPhotos || {};
      const existing = view.fsrPendingPhotos[visitId] || [];
      view.fsrPendingPhotos[visitId] = existing.concat(Array.from(t.files));
      t.value = ""; // clear the picker so the same file can be re-chosen after a drop
      return renderApp();
    }
  }
  if(view.tab==="editor" && view.draft){
    if(t.dataset.role==="customer-select"){
      applyCustomerToDraft(view.draft, t.value||null, null);
      return renderApp();
    }
    if(t.dataset.role==="site-select"){
      applyCustomerToDraft(view.draft, view.draft.customerId, t.value||null);
      return renderApp();
    }
    if(t.classList.contains("hl-city-select")){
      const hlRoomEl = t.closest("[data-hlroom-id]");
      const room = hlRoomEl && (view.draft.heatLoadRooms||[]).find(function(x){ return x.id===hlRoomEl.dataset.hlroomId; });
      if(room){
        const city = state.cityConditions.find(function(c){ return c.id===t.value; });
        room.cityId = t.value||"";
        if(city){ room.outsideDB = city.outsideDB; room.outsideWB = city.outsideWB; room.outsideGR = city.outsideGR; }
        hlRoomEl.outerHTML = heatLoadRoomCardHTML(room);
      }
      return;
    }
  }
  if(view.tab==="print" && t.dataset.action==="toggle-include-heatload"){
    view.printIncludeHeatLoad = t.checked;
    return renderApp();
  }
  if(view.tab==="employees"){
    const row = t.closest("tr[data-emp-id]");
    if(row){
      const id = row.dataset.empId;
      if(t.classList.contains("emp-role")) return updateEmployee(id, { role:t.value });
      if(t.classList.contains("emp-position")) return updateEmployee(id, { job_title:t.value.trim()||null });
      if(t.classList.contains("emp-department")) return updateEmployee(id, { department:t.value||null });
      if(t.classList.contains("emp-seniority")) return updateEmployee(id, { seniority:t.value||null });
      if(t.classList.contains("emp-active")) return updateEmployee(id, { is_active:t.checked });
    }
  }
}

function onAppClick(e){
  const navBtn = e.target.closest("[data-nav]");
  if(navBtn){
    view.tab = navBtn.dataset.nav;
    if(view.tab!=="editor") view.draft = null;
    if(view.tab!=="customer-editor") view.customerDraft = null;
    if(view.tab!=="service-customer-editor") view.serviceCustomerDraft = null;
    if(view.tab!=="quotes") view.customerFilter = null;
    view.editingProductId = null; view.confirmDeleteId = null; view.justSaved = false; view.saveError = null;
    view.inviteOpen = false; view.inviteMsg = null;
    return renderApp();
  }
  const btn = e.target.closest("[data-action]");
  if(!btn) return;
  const action = btn.dataset.action;

  if(action==="new-quote"){
    view.draft = newDraftQuote(btn.dataset.type);
    view.editorReturnTab = null;
    view.tab = "editor";
    return renderApp();
  }
  if(action==="open-quote"){
    const q = state.quotes.find(function(x){ return x.id===btn.dataset.id; });
    if(q){ view.draft = deepClone(q); view.editorReturnTab = null; view.tab = "editor"; renderApp(); }
    return;
  }
  if(action==="new-service-amc-quote"){
    view.draft = newDraftQuote("service");
    view.editorReturnTab = "departments";
    view.tab = "editor";
    return renderApp();
  }
  if(action==="open-service-amc-quote"){
    const q = state.quotes.find(function(x){ return x.id===btn.dataset.id; });
    if(q){ view.draft = deepClone(q); view.editorReturnTab = "departments"; view.tab = "editor"; renderApp(); }
    return;
  }
  if(action==="mark-amc-approved"){
    const q = view.draft;
    if(!q || q.clientApproved || isClientId(q.id)) return;
    q.clientApproved = true;
    q.clientApprovedBy = session.user.id;
    q.clientApprovedAt = new Date().toISOString();
    markAmcClientApproved(q, {});
    return;
  }
  if(action==="dup-quote"){
    const q = state.quotes.find(function(x){ return x.id===btn.dataset.id; });
    if(q){
      const copy = deepClone(q);
      copy.id = uid("q"); // placeholder; the server assigns the real id + quote no on insert
      copy.status = "draft";
      copy.createdAt = new Date().toISOString();
      copy.updatedAt = new Date().toISOString();
      // A plain Duplicate is a brand-new, unrelated offer (fresh sequential
      // number, no link back) — unlike "+ Revision" below, so make sure it
      // doesn't inherit the source's revision family if it happened to be
      // a revision itself.
      delete copy.revisionRootId;
      delete copy.revisionNo;
      if(copy.quoteType==="service"){ copy.clientApproved=false; copy.clientApprovedBy=null; copy.clientApprovedAt=null; }
      saveQuote(copy, { tab:"quotes" });
    }
    return;
  }
  if(action==="new-revision"){
    const src = state.quotes.find(function(x){ return x.id===btn.dataset.id; });
    if(!src) return;
    const rootId = revisionRootId(src);
    const root = state.quotes.find(function(x){ return x.id===rootId; }) || src;
    const family = revisionFamily(src);
    const nextNo = family.reduce(function(m,x){ return Math.max(m, x.revisionNo||0); }, 0) + 1;
    const copy = deepClone(src);
    copy.id = uid("q"); // placeholder; the server assigns the real row id on insert
    copy.status = "draft";
    copy.revisionRootId = rootId;
    copy.revisionNo = nextNo;
    copy.createdAt = new Date().toISOString();
    copy.updatedAt = new Date().toISOString();
    if(copy.quoteType==="service"){ copy.clientApproved=false; copy.clientApprovedBy=null; copy.clientApprovedAt=null; }
    saveQuote(copy, {}, false, revisionedQuoteNo(root.quoteNo, nextNo));
    return;
  }
  if(action==="ask-del-quote" || action==="ask-del-product" || action==="ask-del-customer" || action==="ask-del-service-customer"){
    view.confirmDeleteId = btn.dataset.id;
    return renderApp();
  }
  if(action==="cancel-delete"){
    view.confirmDeleteId = null;
    return renderApp();
  }
  if(action==="del-quote"){
    view.confirmDeleteId = null;
    // Stay on whichever list we're already looking at (Sales Quotes or the
    // Service department's AMC Quotes) rather than forcing a jump to the
    // Sales tab, which a Service-only user may not even have.
    deleteQuote(btn.dataset.id, {});
    return;
  }
  if(action==="back-to-list"){
    view.tab = view.editorReturnTab || "quotes"; view.draft = null; view.editorReturnTab = null;
    return renderApp();
  }

  /* customers */
  if(action==="new-customer"){
    view.customerDraft = newDraftCustomer();
    view.tab = "customer-editor";
    view.saveError = null;
    return renderApp();
  }
  if(action==="edit-customer"){
    const c = findCustomer(btn.dataset.id);
    if(c){ view.customerDraft = deepClone(c); view.tab = "customer-editor"; view.saveError = null; renderApp(); }
    return;
  }
  if(action==="back-to-customers"){
    view.tab = "customers"; view.customerDraft = null;
    return renderApp();
  }
  if(action==="save-customer"){
    const cd = view.customerDraft;
    if(!cd) return;
    if(!cd.name.trim()){
      view.saveError = "Customer name is required.";
      return renderApp();
    }
    cd.updatedAt = new Date().toISOString();
    saveCustomer(cd, { tab:"customers", customerDraft:null });
    return;
  }
  if(action==="del-customer"){
    view.confirmDeleteId = null;
    deleteCustomer(btn.dataset.id, { tab:"customers" });
    return;
  }
  if(action==="add-site"){
    if(!view.customerDraft) return;
    view.customerDraft.sites = view.customerDraft.sites || [];
    view.customerDraft.sites.push({ id: uid("site"), label:"", addressLines:"", pincode:"" });
    return renderApp();
  }
  if(action==="remove-site"){
    if(!view.customerDraft) return;
    view.customerDraft.sites.splice(Number(btn.dataset.idx), 1);
    return renderApp();
  }

  /* Service department's own customer + installation-base database — fully
     separate from Sales' customers above (see the reloadServiceCustomers/
     saveServiceCustomer functions and the split_sales_and_service_customer_databases
     migration). Reached only through Departments > Service. */
  if(action==="new-service-customer"){
    view.serviceCustomerDraft = newDraftServiceCustomer();
    view.tab = "service-customer-editor";
    view.saveError = null;
    return renderApp();
  }
  if(action==="edit-service-customer"){
    const c = findServiceCustomer(btn.dataset.id);
    if(c){ view.serviceCustomerDraft = deepClone(c); view.tab = "service-customer-editor"; view.saveError = null; renderApp(); }
    return;
  }
  if(action==="back-to-service-customers"){
    view.tab = "service-customers"; view.serviceCustomerDraft = null;
    return renderApp();
  }
  if(action==="save-service-customer"){
    const cd = view.serviceCustomerDraft;
    if(!cd) return;
    if(!cd.name.trim()){
      view.saveError = "Customer name is required.";
      return renderApp();
    }
    cd.updatedAt = new Date().toISOString();
    saveServiceCustomer(cd, { tab:"service-customers", serviceCustomerDraft:null });
    return;
  }
  if(action==="del-service-customer"){
    view.confirmDeleteId = null;
    deleteServiceCustomer(btn.dataset.id, { tab:"service-customers" });
    return;
  }
  if(action==="add-service-site"){
    if(!view.serviceCustomerDraft) return;
    view.serviceCustomerDraft.sites = view.serviceCustomerDraft.sites || [];
    view.serviceCustomerDraft.sites.push({ id: uid("site"), label:"", addressLines:"", pincode:"", equipment:[] });
    return renderApp();
  }
  if(action==="remove-service-site"){
    if(!view.serviceCustomerDraft) return;
    view.serviceCustomerDraft.sites.splice(Number(btn.dataset.idx), 1);
    return renderApp();
  }
  if(action==="add-service-equipment-row"){
    if(!view.serviceCustomerDraft) return;
    const site = view.serviceCustomerDraft.sites[Number(btn.dataset.siteIdx)];
    if(!site) return;
    site.equipment = site.equipment || [];
    site.equipment.push({ id: uid("eq"), acType:"", capacity:"", qty:1, make:"", model:"" });
    return renderApp();
  }
  if(action==="remove-service-equipment-row"){
    if(!view.serviceCustomerDraft) return;
    const site = view.serviceCustomerDraft.sites[Number(btn.dataset.siteIdx)];
    if(!site || !site.equipment) return;
    site.equipment.splice(Number(btn.dataset.eqIdx), 1);
    return renderApp();
  }
  if(action==="new-quote-for-customer"){
    view.draft = newDraftQuote(btn.dataset.type);
    applyCustomerToDraft(view.draft, btn.dataset.id, null);
    view.tab = "editor";
    return renderApp();
  }
  if(action==="view-customer-quotes"){
    view.customerFilter = btn.dataset.id;
    view.tab = "quotes";
    view.customerDraft = null;
    return renderApp();
  }
  if(action==="clear-customer-filter"){
    view.customerFilter = null;
    return renderApp();
  }
  if(action==="save-quote" || action==="save-and-print" || action==="save-and-print-heatload"){
    const q = view.draft;
    syncEditorFieldsFromDom(q);
    q.updatedAt = new Date().toISOString();
    const wantsPrint = action==="save-and-print" || action==="save-and-print-heatload";
    const nextView = wantsPrint
      ? { tab:"print", printKind: action==="save-and-print-heatload" ? "heatload" : "quote", printIncludeHeatLoad:false }
      : { tab: view.editorReturnTab || "quotes", draft:null, editorReturnTab:null };
    saveQuote(q, nextView, wantsPrint);
    return;
  }
  if(action==="select-catalog-item"){
    addCatalogItemToDraft(btn.dataset.part, btn.dataset.id);
    return;
  }
  if(action==="select-site-item"){
    selectSiteInDraft(btn.dataset.siteId||null);
    return;
  }
  if(action==="add-custom-item"){
    const part = btn.dataset.part;
    const arr = view.draft[part==="A"?"partA":"partB"];
    arr.push({ id: rowIdCounter(), name:"", unit:"Nos", qty:1, rate:0, discount:0, hsn:"" });
    renderEditorPartTable(part);
    recomputeEditorTotals();
    return;
  }
  if(action==="remove-item"){
    const part = btn.dataset.part;
    const arr = view.draft[part==="A"?"partA":"partB"];
    const idx = arr.findIndex(function(i){ return i.id===btn.dataset.id; });
    if(idx>=0) arr.splice(idx,1);

    recomputeEditorTotals();

  if(action==="add-amc-item"){
    view.draft.amcItems = view.draft.amcItems||[];

    renderAmcItemsTable();
    recomputeEditorTotals();

  }
  if(action==="add-amc-item-from-equipment"){

    const eq = serviceSiteEquipment(view.draft).find(function(x){ return x.id===eqId; });
    if(!eq) return;
    view.draft.amcItems = view.draft.amcItems||[];
    view.draft.amcItems.push({ id: rowIdCounter(), name: equipmentBaseName(eq), hsn:"998715", qty: num(eq.qty)||1, rate:0 });

    recomputeEditorTotals();
    return;
  }
  if(action==="remove-amc-item"){
    const arr = view.draft.amcItems||[];
    const idx = arr.findIndex(function(i){ return i.id===btn.dataset.id; });
    if(idx>=0) arr.splice(idx,1);
    renderAmcItemsTable();
    recomputeEditorTotals();

  if(action==="add-drow"){

  if(action==="remove-drow"){

      btn.textContent = "Added ✓";

    }
    return;

  if(action==="add-city-row"){
    state.cityConditions.push({ id: uid("city"), city:"", state:"", outsideDB:100, outsideWB:78, outsideGR:90, notes:"" });

  /* products */
  if(action==="edit-product"){ view.editingProductId = btn.dataset.id; return renderApp(); }
  if(action==="cancel-edit-product"){ view.editingProductId = null; return renderApp(); }
  if(action==="save-product"){
    const row = btn.closest("tr[data-prow-id]");
    const p = state.products.find(function(x){ return x.id===btn.dataset.id; });
    if(p){
      const edited = Object.assign({}, p, {
        section: row.querySelector(".ep-section").value,
        category: row.querySelector(".ep-category").value.trim(),
        name: row.querySelector(".ep-name").value.trim(),
        unit: row.querySelector(".ep-unit").value.trim(),
        rate: num(row.querySelector(".ep-rate").value),
        hsn: row.querySelector(".ep-hsn").value.trim(),
        notes: row.querySelector(".ep-notes").value.trim()
      });
      view.editingProductId = null;
      saveProduct(edited, { tab:"products" });
    } else {
      view.editingProductId = null;
      renderApp();
    }
    return;
  }
  if(action==="ask-del-product"){ view.confirmDeleteId = btn.dataset.id; return renderApp(); }
  if(action==="del-product"){
    view.confirmDeleteId = null;
    deleteProduct(btn.dataset.id, { tab:"products" });
    return;
  }
  if(action==="open-quickadd"){ view.quickAddOpen[btn.dataset.section] = true; return renderApp(); }

  if(action==="quickadd-save"){
    const s = btn.dataset.section;
    const name = byId("qa-name-"+s).value.trim();
    if(!name){ byId("qa-name-"+s).focus(); return; }
    const p = {
      id: uid("p"), section:s,
      category: byId("qa-category-"+s).value.trim()||"Other",
      name: name,
      unit: byId("qa-unit-"+s).value.trim()||"Nos",
      rate: num(byId("qa-rate-"+s).value),
      hsn: byId("qa-hsn-"+s).value.trim(),
      notes: byId("qa-notes-"+s).value.trim()
    };
    view.quickAddOpen[s] = false;
    saveProduct(p, { tab:"products" });
    return;
  }
  if(action==="toggle-import"){ view.importOpen = !view.importOpen; return renderApp(); }
  if(action==="bulk-import-run"){
    const text = byId("bulk-import-text").value;
    const lines = text.split(/\n+/).map(function(l){ return l.trim(); }).filter(Boolean);
    const newProducts = [];
    lines.forEach(function(line){
      const parts = line.split(/\t|,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(function(s){ return s.trim(); });
      if(parts.length<5) return;
      const section = /^b/i.test(parts[0]) ? "B" : "A";
      newProducts.push({ id: uid("p"), section:section, category: parts[1]||"Other", name: parts[2]||"", unit: parts[3]||"Nos", rate: num(parts[4]), hsn: parts[5]||"", notes: parts[6]||"" });
    });
    const msg = byId("bulk-import-msg");
    if(newProducts.length===0){ if(msg) msg.textContent = "No valid rows found."; return; }
    bulkSaveProducts(newProducts, { tab:"products", importOpen:false });
    return;
  }

  /* departments */
  if(action==="select-dept"){
    view.activeDepartment = btn.dataset.dept;
    view.deptFormOpen = false; view.deptMsg = null; view.confirmDeleteId = null;
    return renderApp();
  }
  if(action==="back-to-dept-home"){
    view.activeDepartment = null;
    view.deptFormOpen = false; view.deptMsg = null; view.confirmDeleteId = null;
    return renderApp();
  }
  if(action==="open-dept-form"){ view.deptFormOpen = true; view.deptFormType = view.deptFormType||"mrs"; view.deptMsg = null; return renderApp(); }
  if(action==="cancel-dept-form"){ view.deptFormOpen = false; view.deptMsg = null; return renderApp(); }
  if(action==="save-dept-doc"){
    const dept = btn.dataset.dept;
    if(!canCreateInDept(dept)) return;
    const typeEl = byId("dept-form-type");
    const titleEl = byId("dept-form-title");
    const quoteEl = byId("dept-form-quote");
    const siteEl = byId("dept-form-site");
    const notesEl = byId("dept-form-notes");
    const fileEl = byId("dept-form-file");
    const title = titleEl ? titleEl.value.trim() : "";
    if(!title){ if(titleEl) titleEl.focus(); view.deptMsg = "Give the document a title."; return renderApp(); }
    const docType = typeEl ? typeEl.value : "mrs";
    const file = (fileEl && fileEl.files && fileEl.files[0]) ? fileEl.files[0] : null;
    const payload = {
      docType: docType, department: dept, title: title,
      notes: notesEl ? notesEl.value.trim() : "",
      linkedQuoteId: (quoteEl && quoteEl.value) ? quoteEl.value : null,
      linkedSiteId: (siteEl && siteEl.value) ? siteEl.value : null
    };
    createDocument(payload, file, { deptFormOpen:false, deptMsg:null });
    return;
  }
  if(action==="approve-doc" || action==="reject-doc"){
    const id = btn.dataset.id;
    const card = btn.closest(".doc-card");
    const noteEl = card ? card.querySelector(".doc-approval-note") : null;
    decideDocument(id, action==="approve-doc", noteEl ? noteEl.value.trim() : "");
    return;
  }
  if(action==="open-doc-file"){
    const doc = state.documents.find(function(d){ return d.id===btn.dataset.id; });
    if(doc) openDocumentFile(doc);
    return;
  }
  if(action==="ask-del-doc"){
    if(view.confirmDeleteId === btn.dataset.id){ deleteDocument(btn.dataset.id); return; }
    view.confirmDeleteId = btn.dataset.id;
    return renderApp();
  }

  /* AMC service visits / PMS list */
  if(action==="toggle-pms-row"){
    const id = btn.dataset.id;
    view.pmsExpandedContractId = (view.pmsExpandedContractId===id) ? null : id;
    view.pmsActiveVisitTab = null; view.fsrDraft = null; view.fsrDraftVisitId = null; view.visitReportOpenId = null;
    return renderApp();
  }
  if(action==="select-pms-tab"){
    view.pmsActiveVisitTab = btn.dataset.id;
    view.fsrDraft = null; view.fsrDraftVisitId = null; view.visitReportOpenId = null;
    return renderApp();
  }
  if(action==="pms-sort"){
    view.pmsSort = btn.dataset.sort;
    return renderApp();
  }
  if(action==="assign-visit"){
    const card = btn.closest("[data-visit-id]");
    const sel = card ? card.querySelector(".visit-assign-select") : null;
    if(!sel || !sel.value) return;
    assignVisit(btn.dataset.id, sel.value, {});
    return;
  }
  if(action==="open-visit-report-form"){
    view.visitReportOpenId = btn.dataset.id;
    return renderApp();
  }
  if(action==="cancel-visit-report"){
    view.visitReportOpenId = null;
    return renderApp();
  }
  if(action==="save-visit-complete"){
    const chargeEl = byId("visit-chargeable-flag");
    const noteEl = byId("visit-chargeable-note");
    completeVisit(btn.dataset.id, {
      hasChargeable: !!(chargeEl && chargeEl.checked),
      chargeableNote: noteEl ? noteEl.value.trim() : ""
    }, { visitReportOpenId:null });

  if(action==="verify-visit"){
    if(btn.disabled) return;
    const card = btn.closest("[data-visit-id]");
    const noteEl = card ? card.querySelector(".visit-verify-note") : null;
    verifyVisit(btn.dataset.id, noteEl ? noteEl.value.trim() : "", {});
    return;

  if(action==="open-visit-file"){
    const v = state.amcVisits.find(function(x){ return x.id===btn.dataset.id; });
    if(v) openVisitReportFile(v);
    return;
  }
  if(action==="open-visit-photo"){
    const v = state.amcVisits.find(function(x){ return x.id===btn.dataset.id; });

  if(action==="upload-signed-fsr"){
    const visitId = btn.dataset.id;
    const fileEl = byId("visit-signed-fsr-file-"+visitId);

    uploadSignedFsr(visitId, file, {});

  }
  if(action==="upload-visit-photos"){
    const visitId = btn.dataset.id;
    const files = (view.fsrPendingPhotos && view.fsrPendingPhotos[visitId]) || [];
    if(!files.length){ view.deptMsg = "Choose one or more photos first."; return renderApp(); }
    uploadVisitPhotos(visitId, files.slice(), {}).then(function(result){
      if(result && result.ok && view.fsrPendingPhotos){
        view.fsrPendingPhotos[visitId] = [];
        renderApp();
      }

    return;
  }
  if(action==="set-fsr-equip-mode"){
    const form = btn.closest("[data-fsr-form]");
    const visitId = form && form.dataset.visitId;
    if(visitId){
      ensureFsrDraft(visitId);
      view.fsrDraft.equipmentMode = btn.dataset.mode;
      if(btn.dataset.mode==="custom"){
        // switching to custom clears the locked-in base-equipment pick so
        // typed values don't look like they're still tied to that entry
        view.fsrDraft.equipmentId = "";
      }
      renderApp();
    }
    return;
  }
  if(action==="drop-visit-photo"){
    const visitId = btn.dataset.id;
    const idx = Number(btn.dataset.idx);
    removeVisitPhoto(visitId, idx, {});
    return;
  }
  if(action==="drop-signed-fsr"){
    const visitId = btn.dataset.id;
    removeSignedFsr(visitId, {});
    return;
  }
  if(action==="drop-pending-photo"){
    const visitId = btn.dataset.id;
    const idx = Number(btn.dataset.idx);
    if(view.fsrPendingPhotos && view.fsrPendingPhotos[visitId]){
      view.fsrPendingPhotos[visitId].splice(idx, 1);
    }
    renderApp();
    return;
  }
  if(action==="add-fsr-spare"){
    const visitId = btn.dataset.id;
    ensureFsrDraft(visitId);
    view.fsrDraft.spares = view.fsrDraft.spares || [];
    view.fsrDraft.spares.push({ id:uid("sp"), partCode:"", description:"", qty:"", priceRs:"", pricePs:"" });
    renderFsrSparesTable();
    return;
  }
  if(action==="remove-fsr-spare"){
    if(view.fsrDraft){
      view.fsrDraft.spares = (view.fsrDraft.spares||[]).filter(function(s){ return s.id!==btn.dataset.id; });
      renderFsrSparesTable();
    }
    return;
  }
  if(action==="save-fsr"){
    const visitId = btn.dataset.id;
    ensureFsrDraft(visitId);
    // Belt-and-braces sync — same defensive pattern as syncEditorFieldsFromDom
    // — re-applies every visible field's on-screen value right before save,
    // so a value that changed without an "input" event reaching us (browser
    // autofill, some mobile keyboards) still gets saved.
    const form = document.querySelector("[data-fsr-form][data-visit-id=\""+visitId+"\"]");
    if(form){
      form.querySelectorAll("[data-ffield]").forEach(function(el){
        const val = el.type==="checkbox" ? el.checked : el.value;
        setField(view.fsrDraft, el.dataset.ffield, val);
      });
    }
    saveFsr(visitId, view.fsrDraft, { fsrDraft:null, fsrDraftVisitId:null });
    return;
  }
  if(action==="download-fsr-pdf"){
    view.printVisitId = btn.dataset.id;
    view.tab = "print-fsr";
    return renderApp();
  }

  /* employees */
  if(action==="open-invite"){ view.inviteOpen = true; view.inviteMsg = null; return renderApp(); }
  if(action==="cancel-invite"){ view.inviteOpen = false; view.inviteMsg = null; return renderApp(); }
  if(action==="send-invite"){
    const name = byId("inv-name").value.trim();
    const email = byId("inv-email").value.trim();
    const role = byId("inv-role").value;
    const position = byId("inv-position").value.trim();
    const department = byId("inv-department").value;
    const seniority = byId("inv-seniority").value;
    if(!email){ view.inviteMsg = "Enter an email address."; return renderApp(); }
    return inviteEmployee({ full_name:name, email:email, role:role, job_title:position, department:department, seniority:seniority });
  }

  /* settings */
  if(action==="settings-tab"){
    view.settingsTab = btn.dataset.tab;
    document.querySelectorAll("[data-settings-tab-panel]").forEach(function(el){
      el.hidden = el.dataset.settingsTabPanel !== view.settingsTab;
    });
    document.querySelectorAll("[data-settings-tab-btn]").forEach(function(el){
      el.classList.toggle("active", el.dataset.settingsTabBtn===view.settingsTab);
    });
    return;

  if(action==="save-settings"){
    const newSettings = {
      company: {
        name: byId("s-company-name").value.trim(),
        phone: byId("s-company-phone").value.trim(),
        addressLines: byId("s-company-address").value.split("\n").map(function(s){return s.trim();}).filter(Boolean),
        signatoryName: byId("s-signatory-name").value.trim(),
        signatoryLine: byId("s-signatory-line").value.trim(),
        gstin: byId("s-company-gstin").value.trim(),
        pan: byId("s-company-pan").value.trim(),
        bank: {
          name: byId("s-bank-name").value.trim(),
          accountName: byId("s-bank-accname").value.trim(),
          accountNo: byId("s-bank-accno").value.trim(),
          ifsc: byId("s-bank-ifsc").value.trim(),
          branch: byId("s-bank-branch").value.trim()
        }
      },
      docTemplate: (function(){ const el=document.querySelector('input[name="doc-template"]:checked'); return el?el.value:"classic"; })(),
      defaultGstPercent: num(byId("s-gst").value),
      defaultTerms: Array.prototype.map.call(document.querySelectorAll("[data-settings-terms-list] .term-row"), function(r){

      // AMC (Service) defaults aren't on this Sales-only screen any more —
      // carry the current values straight through unchanged (see Service's
      // own Settings, "save-service-settings" below).
      defaultAmcPlanLabel: state.defaultAmcPlanLabel,
      defaultAmcIntro: state.defaultAmcIntro,
      defaultAmcPaymentTerms: state.defaultAmcPaymentTerms,
      defaultAmcScope: state.defaultAmcScope,
      defaultAmcTermsText: state.defaultAmcTermsText

    const cityRows = Array.prototype.map.call(document.querySelectorAll("[data-settings-cities-list] tr[data-city-id]"), function(tr){

        id: tr.dataset.cityId,

        state: tr.querySelector(".city-state").value.trim(),
        outsideDB: num(tr.querySelector(".city-db").value),

        outsideGR: num(tr.querySelector(".city-gr").value),
        notes: tr.querySelector(".city-notes").value.trim()

    saveSettings(newSettings, { tab:"settings", justSaved:true, settingsTab:view.settingsTab }, cityRows, view.citiesDeletedIds||[]);

  if(action==="save-service-settings"){
    const newSettings = {

      defaultGstPercent: state.defaultGstPercent,
      defaultTerms: state.defaultTerms,
      defaultAmcPlanLabel: byId("s-amc-planlabel").value,
      defaultAmcIntro: byId("s-amc-intro").value,
      defaultAmcPaymentTerms: byId("s-amc-payterms").value,
      defaultAmcScope: {
        covered: byId("s-amc-scope-covered").value,
        spares: byId("s-amc-scope-spares").value,
        excluded: byId("s-amc-scope-excluded").value
      },
      defaultAmcTermsText: byId("s-amc-termstext").value
    };
    saveSettings(newSettings, { tab:"service-settings", justSaved:true });
    return;
  }
  if(action==="logout"){
    sb.auth.signOut();
    return;
  }

  /* print */
  if(action==="back-to-editor-from-print"){
    view.tab = "editor";
    return renderApp();
  }
  if(action==="do-print"){
    setPrintMsg("info","Opening your browser's print dialog… if nothing appears in a couple of seconds, this view has it blocked — use Ctrl/Cmd+P instead, or Download quote below.");
    try{ window.print(); }catch(e){ setPrintMsg("warn","Couldn't open the print dialog from this button. Use Ctrl/Cmd+P, or Download quote below."); }

  if(action==="export-pdf"){
    const q = state.quotes.find(function(x){ return x.id===btn.dataset.id; });
    if(!q) return;
    exportQuotePDF(q);
    return;

  if(action==="back-to-dept-from-fsr-print"){

    return renderApp();
  }
  if(action==="export-fsr-pdf"){
    const v = state.amcVisits.find(function(x){ return x.id===btn.dataset.id; });
    if(!v) return;
    exportFsrPDF(v);
    return;

  if(action==="export-text"){
    const q = state.quotes.find(function(x){ return x.id===btn.dataset.id; });

  if(action==="export-excel"){
    const q = state.quotes.find(function(x){ return x.id===btn.dataset.id; });
    if(!q) return;
    exportQuoteExcel(q);
    return;

  if(action==="download-html"){
    const q = state.quotes.find(function(x){ return x.id===btn.dataset.id; });
    if(!q) return;
    downloadQuoteHTML(q);
    return;
  }
}

/* Matches the px width baked into the .pdf-export-mode CSS above (718px ==
   190mm, the A4 content width after 10mm side margins). html2canvas clones
   the page into an offscreen frame to rasterize it, and — unless told
   otherwise — sizes that clone's viewport to the real browser window's
   width, not the target element's own width. On a wide desktop window that
   makes the clone reflow wider than 718px, so the capture (and everything
   placed in it, including the letterhead and the quote-number line) runs
   past the printable area and gets cropped at the PDF page edge. Pinning
   both `width` and `windowWidth` to PDF_CAPTURE_PX forces the clone to use
   the same 718px viewport the CSS was written for, regardless of how wide
   the browser window actually is. */
const PDF_CAPTURE_PX = 718;

/* Builds an isolated, fixed-width offscreen copy of the print document
   (rather than capturing the live, in-flow .print-page directly) so the
   capture can never inherit width/scroll quirks from the surrounding app
   shell — same defensive purpose as the windowWidth pin above, belt and
   suspenders. Positioned off the visible canvas so nothing flashes on
   screen while the PDF is generated. */
function buildPdfExportHolder(source){
  const holder = document.createElement("div");
  /* position:absolute (not fixed) — html2canvas's DOM-cloning capture step
     has long-standing bugs with position:fixed elements (the clone can lose
     the fixed positioning and land somewhere else in the cloned document,
     so html2canvas crops the region where the ORIGINAL element was, which
     is now empty → a blank page). absolute is reliably preserved through
     the clone. Placed inside a fixed-size, overflow-hidden wrapper (added
     at call sites below) so it never affects page scroll height while
     off-screen. */
  holder.style.position = "absolute";
  holder.style.left = "0";
  holder.style.top = "0";
  holder.style.width = PDF_CAPTURE_PX + "px";
  holder.className = "print-page pdf-export-mode";
  holder.innerHTML = source.innerHTML;
  document.body.appendChild(holder);
  return holder;
}

/* Renders each .doc-page / .m-page inside the export holder to the PDF as
   its OWN html2canvas capture + own jsPDF page, instead of handing the
   whole (possibly multi-page) holder to html2pdf.js's combined
   capture-then-slice pipeline. That combined approach renders every page of
   a document into ONE giant canvas (a 3-page A4 quote at scale:2 is roughly
   1436×6100px) and then relies on the "pagebreak" plugin to cut it apart
   afterwards — on many phones (limited canvas memory/tile size) that single
   oversized canvas silently comes back blank or truncated, which is what
   "most of them are coming blank" looks like in practice: the FSR (always
   one page, so one small canvas) tends to work, while the 3-page quote/AMC
   documents don't. Capturing one page at a time keeps each canvas small
   regardless of how many pages the document has, and sidesteps the
   pagebreak-slicing step entirely. Falls back to the old single-shot
   html2pdf().from(holder) path if html2canvas/jsPDF aren't exposed as
   globals by whatever build of the bundle actually loaded, so this is
   strictly additive rather than a hard cutover. */
function renderHolderPagesToPdf(holder, filename){
  const pageEls = Array.prototype.slice.call(holder.querySelectorAll(".doc-page, .m-page"));
  const H2C = window.html2canvas;
  const JsPDFCtor = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
  if(!pageEls.length || typeof H2C !== "function" || typeof JsPDFCtor !== "function"){
    const opt = {
      margin: [12,10,12,10],
      filename: filename,
      image: { type:"jpeg", quality:0.98 },
      html2canvas: { scale:2, useCORS:true, backgroundColor:"#ffffff", width:PDF_CAPTURE_PX, windowWidth:PDF_CAPTURE_PX, scrollX:0, scrollY:0 },
      jsPDF: { unit:"mm", format:"a4", orientation:"portrait" },
      pagebreak: { mode:["css","legacy"], before:".doc-page + .doc-page, .m-page + .m-page, .m-page + .doc-page, .doc-page + .m-page" }
    };
    return html2pdf().set(opt).from(holder).save();
  }
  const marginXmm = 10, marginTopMm = 12, pageWidthMm = 210 - marginXmm*2; // A4 width minus left+right margin
  const pdf = new JsPDFCtor({ unit:"mm", format:"a4", orientation:"portrait" });
  let chain = Promise.resolve();
  pageEls.forEach(function(pageEl, i){
    chain = chain.then(function(){
      return H2C(pageEl, { scale:2, useCORS:true, backgroundColor:"#ffffff", width:PDF_CAPTURE_PX, windowWidth:PDF_CAPTURE_PX, scrollX:0, scrollY:0 });
    }).then(function(canvas){
      const imgData = canvas.toDataURL("image/jpeg", 0.98);
      const imgHeightMm = canvas.height * pageWidthMm / canvas.width;
      if(i>0) pdf.addPage("a4","portrait");
      pdf.addImage(imgData, "JPEG", marginXmm, marginTopMm, pageWidthMm, imgHeightMm);
    });
  });
  // Hand the finished PDF to savePdfBlob (below) instead of calling
  // pdf.save() directly, so the browser's save-location dialog (where
  // supported) can offer a folder to choose rather than silently landing
  // in the default Downloads folder.
  return chain.then(function(){ return savePdfBlob(pdf.output("blob"), filename); });
}

/* Lets the user pick where the exported PDF is saved via the File System
   Access API's native save dialog (folder + filename), instead of it
   silently landing in the browser's default downloads folder — supported on
   Chromium-based desktop and Android browsers. Everywhere else (Safari,
   Firefox, older Chrome) window.showSaveFilePicker doesn't exist, so this
   transparently falls back to the normal browser download. */
async function savePdfBlob(blob, filename){
  if(typeof window.showSaveFilePicker === "function"){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description:"PDF document", accept:{ "application/pdf":[".pdf"] } }]
      });
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      return;
    }catch(err){
      // AbortError == the user cancelled the picker on purpose — respect
      // that instead of silently falling back to a default-folder download.
      if(err && err.name==="AbortError") throw err;
      // Any other failure (e.g. the API exists but is blocked in this
      // context) — fall through to the normal download below.
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

/* Renders the print document straight to a downloaded PDF file — no OS
   print dialog involved. Each .doc-page / .m-page becomes its own PDF
   page (see renderHolderPagesToPdf above). */
function exportQuotePDF(q){
  if(typeof html2pdf === "undefined"){
    setPrintMsg("warn","PDF export library didn't load — check your internet connection and try again, or use Ctrl/Cmd+P instead.");
    return;
  }
  const source = document.querySelector(".print-page");
  if(!source){ setPrintMsg("warn","Nothing to export yet."); return; }
  setPrintMsg("info","Generating PDF…");
  /* Wrapper clips the (visually offscreen, but now normal-flow via
     position:absolute) holder so it can never appear on screen or add
     page scroll while html2canvas is capturing it. */
  const clip = document.createElement("div");
  /* absolute, not fixed — same reason as the holder itself: html2canvas's
     clone step is unreliable with position:fixed anywhere in the captured
     element's ancestor chain, not just on the element itself. */
  clip.style.position = "absolute";
  clip.style.left = "0";
  clip.style.top = "0";
  clip.style.width = "1px";
  clip.style.height = "1px";
  clip.style.overflow = "hidden";
  clip.style.opacity = "0.01"; // effectively invisible, but never display:none/visibility:hidden — those make some browsers skip painting content entirely, which is another common cause of a blank html2canvas capture
  clip.style.pointerEvents = "none";
  clip.style.zIndex = "-1";
  document.body.appendChild(clip);
  const holder = buildPdfExportHolder(source);
  clip.appendChild(holder);
  const filename = safeFileName(q.quoteNo)+".pdf";
  function cleanup(){
    if(clip.parentNode) document.body.removeChild(clip);
  }
  /* Give the freshly-inserted holder a couple of paint frames to finish
     laying out (fonts, the injected <style> block, images) before handing
     it to html2canvas — capturing on the same tick it's inserted is a
     common cause of an empty/partial capture. */
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      renderHolderPagesToPdf(holder, filename).then(function(){
        cleanup();
        setPrintMsg("ok","Saved "+filename+" — check your browser's downloads (or the folder you chose).");
      }).catch(function(err){
        cleanup();
        if(err && err.name==="AbortError"){ setPrintMsg("info","Export cancelled."); return; }
        setPrintMsg("warn","Couldn't generate the PDF ("+((err&&err.message)||"unknown error")+") — try Ctrl/Cmd+P instead, or Download quote (HTML) below.");
      });
    });
  });
}

/* Real website, no sandbox — a plain Blob + anchor click is all downloads
   need here (the old claudeDownloads capability dance was only for the
   Artifact's sandboxed context). */
async function offerDownload(filename, data){
  try{
    const mime = /\.html$/.test(filename) ? "text/html" : "text/plain";
    const blob = new Blob([data], { type: mime+";charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    setPrintMsg("ok","Saved "+filename+" — check your browser's downloads.");
  }catch(err){
    setPrintMsg("warn","Couldn't save "+filename+" — try again, or use the Ctrl/Cmd+P tip above.");
  }
}

    });
  }
  const forgot = byId("forgot-link");
  if(forgot){
    forgot.addEventListener("click", async function(e){
      e.preventDefault();
      const email = byId("li-email").value.trim();
      if(!email){ showLogin("Enter your email above first, then click \"Forgot your password?\" again.", false); return; }
      const {error} = await sb.auth.resetPasswordForEmail(email);
      showLogin(error ? (error.message||"Couldn't send reset email.") : "Password reset email sent — check your inbox.", false);
    });
  }
}

function showBlockedScreen(message){
  document.body.classList.remove("read-only");
  byId("app").innerHTML = "<div class=\"login-wrap\"><div class=\"login-card\">"+
    "<div class=\"login-brand\">"+brandMarkSVG()+"<span class=\"brand-name\">PRIDE ERP</span></div>"+
    "<p class=\"login-hint\">"+esc(message)+"</p>"+
    "<button class=\"btn\" id=\"logout-blocked\">Log out</button>"+
  "</div></div>";
  const btn = byId("logout-blocked");
  if(btn) btn.addEventListener("click", function(){ sb.auth.signOut(); });
}

async function enterApp(){
  const {data} = await sb.auth.getUser();
  const user = data && data.user;
  if(!user){ showLogin(); return; }
  const {data:profile, error} = await sb.from("profiles").select("*").eq("id", user.id).single();
  if(error || !profile){
    showBlockedScreen("Your account isn't set up yet. Ask your director to add you, then sign in again.");
    return;
  }
  if(!profile.is_active){
    showBlockedScreen("Your account has been deactivated. Contact your director.");
    return;
  }
  myProfile = profile;
  // A plain technician with no department assigned has no reason to be in the
  // app at all — but once a director gives them a department, they get in to
  // use the Departments module even though the quote tool stays off-limits.
  if(profile.role==="technician" && !profile.department){
    showBlockedScreen("Nothing's been set up for your account yet. Contact your director if you think this is wrong.");
    return;
  }
  canEdit = (profile.role==="director" || profile.department==="sales");
  // Departments is the app's home screen for everyone now — Sales' and
  // Service's own tools are launched from inside their department tile.
  view.tab = "departments";
  byId("app").innerHTML = "<div class=\"login-wrap\"><div class=\"login-card\"><p class=\"login-hint\">Loading your data…</p></div></div>";
  try{
    await loadAllData();
  }catch(err){
    byId("app").innerHTML = "<div class=\"login-wrap\"><div class=\"login-card\"><p class=\"login-hint\">Couldn't load data: "+esc((err&&err.message)||"unknown error")+"</p><button class=\"btn\" id=\"retry-load\">Retry</button></div></div>";
    const retry = byId("retry-load");
    if(retry) retry.addEventListener("click", enterApp);
    return;
  }
  renderApp();
}

function boot(){
  const styleEl = document.createElement("style");
  styleEl.textContent = APP_CSS;
  document.head.appendChild(styleEl);
  const linkEl = document.createElement("link");
  linkEl.rel = "stylesheet"; linkEl.href = FONTS_HREF;
  document.head.appendChild(linkEl);

  sb.auth.onAuthStateChange(function(event, newSession){
    session = newSession;
    if(event==="SIGNED_OUT" || !newSession){
      myProfile = null; canEdit = false; state = emptyState();
      showLogin();
      return;
    }
    if(event==="TOKEN_REFRESHED" && myProfile){ return; } // already in the app, nothing to reload
    enterApp();
  });
}

if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}

})();
</script>
