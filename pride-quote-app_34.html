/* ============================== Purchase Order — A4 print/PDF ==============================
   Laid out against a sample PO format the user supplied, field-for-field:
   the standard Daikin + Pride Air Systems letterhead (same banner/footer as
   quotes/AMC/Repair/DC, via docPage()), then an Issued By/Invoice To + PO
   Details box pair, a Supplier/Delivery Details box pair, the item table
   with per-line GST, an Amount-in-Words + totals box, and numbered Terms &
   Conditions.
   IMPORTANT: this must go through docPage() (letterheadHeader + …Footer)
   rather than a bare "<div class="doc-page">…</div>" — the print/PDF CSS
   has a rule that absolutely-positions .doc-page's LAST child to the
   bottom of the page (that's how the short letterhead footer normally
   pins itself there). Skip docPage() and whatever content happens to come
   last — e.g. the Terms & Conditions list — gets ripped out of flow and
   overlaid across the whole page instead, which is exactly the garbled/
   overlapping print and blank-PDF-export bug reported against the first
   version of this document. */
function poKVRow(label, value){
  return "<div style=\"display:flex;gap:10px;margin-top:4px;font-size:12.5px\">"+
    "<div style=\"width:150px;flex:0 0 150px;color:var(--paper-muted)\">"+esc(label)+"</div>"+
    "<div style=\"flex:1\">"+esc(value||"—")+"</div>"+
  "</div>";
}
function poDocumentHTML(po, c){
  const items = po.items||[];
  const rows = items.length ? items.map(function(it,i){
    const amount = num(it.qty)*num(it.rate);
    const gst = amount*num(it.gstPercent)/100;
    const total = amount+gst;
    return "<tr><td style=\"width:26px\">"+(i+1)+"</td><td>"+esc(it.name)+"</td><td style=\"width:64px\">"+esc(it.hsn||"")+"</td>"+
      "<td class=\"num\" style=\"width:50px\">"+fmtNum(it.qty,2)+"</td><td class=\"num\" style=\"width:82px\">"+fmtINR(num(it.rate))+"</td>"+
      "<td style=\"width:50px\">"+esc(it.unit||"")+"</td><td class=\"num\" style=\"width:92px\">"+fmtINR(amount)+"</td>"+
      "<td class=\"num\" style=\"width:50px\">"+fmtNum(it.gstPercent,1)+"%</td><td class=\"num\" style=\"width:82px\">"+fmtINR(gst)+"</td>"+
      "<td class=\"num\" style=\"width:92px\">"+fmtINR(total)+"</td></tr>";
  }).join("") : "<tr><td colspan=\"10\" style=\"text-align:center;color:#8993A3\">No items</td></tr>";

  const netTotal = items.reduce(function(s,it){ return s+num(it.qty)*num(it.rate); }, 0);
  const gstTotal = items.reduce(function(s,it){ return s+num(it.qty)*num(it.rate)*num(it.gstPercent)/100; }, 0);
  const grandRaw = netTotal+gstTotal;
  const grandRounded = Math.round(grandRaw);
  const roundOff = grandRounded-grandRaw;

  const terms = (po.termsText||"").split("\n").map(function(s){ return s.trim(); }).filter(Boolean);

  const body = ""+
    "<div class=\"annexure-heading\"><h2 style=\"margin:0 0 4px\">PURCHASE ORDER</h2></div>"+
    (po.projectLabel ? "<div class=\"doc-page-date\">Project Name: "+esc(po.projectLabel)+"</div>" : "")+
    "<div class=\"doc-address-grid\">"+
      "<div class=\"doc-address-box\">"+
        "<div class=\"doc-address-label\">Issued By / Invoice To</div>"+
        poKVRow("Issued By:", c.name)+
        poKVRow("Company Address:", (c.addressLines||[]).join(", "))+
        poKVRow("GSTIN:", c.gstin)+
        poKVRow("Company Email ID:", c.email)+
        poKVRow("Company Phone Number:", c.phone)+
      "</div>"+
      "<div class=\"doc-address-box\">"+
        "<div class=\"doc-address-label\">PO Details</div>"+
        poKVRow("PO No:", po.poNo || "(assigned on submission)")+
        poKVRow("Issued On:", fmtDate((po.submittedAt || po.createdAt || todayISO()).slice(0,10)))+
      "</div>"+
    "</div>"+
    "<div class=\"doc-address-grid\">"+
      "<div class=\"doc-address-box\">"+
        "<div class=\"doc-address-label\">Supplier Name &amp; Address</div>"+
        poKVRow("Vendor Name:", po.vendorName)+
        poKVRow("Vendor Address:", po.vendorAddress)+
        poKVRow("GSTIN:", po.vendorGstin)+
        poKVRow("Email:", po.vendorEmail)+
        (po.vendorContactPerson ? poKVRow("Contact Person:", po.vendorContactPerson) : "")+
        poKVRow("Phone No.:", po.vendorPhone)+
      "</div>"+
      "<div class=\"doc-address-box\">"+
        "<div class=\"doc-address-label\">Delivery Details</div>"+
        poKVRow("Delivery Address:", po.deliveryAddress)+
        poKVRow("Delivery Date:", po.deliveryDate ? fmtDate(po.deliveryDate) : "—")+
      "</div>"+
    "</div>"+
    "<table class=\"doc-table\"><tbody>"+
      "<tr><th style=\"width:26px\">S No</th><th>Description of Goods</th><th style=\"width:64px\">HSN</th><th class=\"num\" style=\"width:50px\">Qty</th><th class=\"num\" style=\"width:82px\">Price</th><th style=\"width:50px\">Unit</th><th class=\"num\" style=\"width:92px\">Amount</th><th class=\"num\" style=\"width:50px\">GST %</th><th class=\"num\" style=\"width:82px\">GST</th><th class=\"num\" style=\"width:92px\">Total Amount</th></tr>"+
      rows+
    "</tbody></table>"+
    "<div class=\"doc-address-grid\" style=\"margin-top:10px;align-items:stretch\">"+
      "<div class=\"doc-address-box\">"+
        "<div class=\"doc-address-label\">Amount in Words</div>"+
        "<div style=\"font-size:13px;margin-top:4px\">"+esc(amountInWordsINR(grandRounded))+"</div>"+
      "</div>"+
      "<table class=\"doc-table\" style=\"margin:0\"><tbody>"+
        "<tr class=\"sub\"><td>Net Total</td><td class=\"num\">"+fmtINR(netTotal)+"</td></tr>"+
        "<tr class=\"sub\"><td>GST</td><td class=\"num\">"+fmtINR(gstTotal)+"</td></tr>"+
        "<tr class=\"sub\"><td>Round Off</td><td class=\"num\">"+fmtINR(roundOff)+"</td></tr>"+
        "<tr class=\"grand\"><td>Grand Total</td><td class=\"num\">"+fmtINR(grandRounded)+"</td></tr>"+
      "</tbody></table>"+
    "</div>"+
    (terms.length ? "<p class=\"doc-para\" style=\"margin-top:18px\"><b>Terms &amp; Condition</b></p>"+
      "<ol class=\"doc-bullets\" style=\"margin-top:0\">"+terms.map(function(x){ return "<li>"+esc(x)+"</li>"; }).join("")+"</ol>" : "");
  return docPage(c,1,1,body);
}

  view.printPurchaseOrderId = poId;
  view.tab = "print-po";
  renderApp();

  }

  return "<tr class=\"sub\"><td colspan=\"5\" style=\"text-align:right\">CGST @ "+fmtNum(halfPct,1)+"% Extra</td><td class=\"num\">"+fmtINR(half)+"</td></tr>"+
    "<tr class=\"sub\"><td colspan=\"5\" style=\"text-align:right\">SGST @ "+fmtNum(halfPct,1)+"% Extra</td><td class=\"num\">"+fmtINR(half)+"</td></tr>";

/* ============================== event wiring ============================== */

function setField(obj, path, value){
  const parts = path.split(".");
  let cur = obj;
  for(let i=0;i<parts.length-1;i++){ cur = cur[parts[i]]; }
  cur[parts[parts.length-1]] = value;
}
function getField(obj, path){
  const parts = path.split(".");
  let cur = obj;
  for(let i=0;i<parts.length;i++){ if(cur==null) return undefined; cur = cur[parts[i]]; }
  return cur;
}
// Belt-and-braces sync: every [data-field] element's live on-screen value is
// re-applied to the draft right before it's saved. Normally onAppInput keeps
// the draft in lockstep with the DOM on every keystroke, but this catches
// the odd case where a value changed without an "input" event actually
// reaching us (browser autofill, some mobile keyboards, a date picker
// commit) — so what's on screen when you hit Save is always what gets
// saved, regardless of cause.
function syncEditorFieldsFromDom(q){
  if(!q) return;
  document.querySelectorAll("#app [data-field]").forEach(function(el){
    let val = el.value;
    if(el.dataset.field==="gstPercent") val = num(val);
    setField(q, el.dataset.field, val);
  });
}

function attachGlobalHandlers(){
  const app = byId("app");

  app.addEventListener("click", onAppClick);
  app.addEventListener("change", onAppChange);
  app.addEventListener("input", onAppInput);
  app.addEventListener("focusin", onAppFocusIn);
  app.addEventListener("keydown", onAppKeydown);
  document.addEventListener("click", onDocumentClickCloseCatalog);

  updatePersistIndicator();
}

function onAppFocusIn(e){
  const t = e.target;
  if(t.dataset && t.dataset.catalogInput){
    openCatalogDropdown(t.dataset.catalogInput, t.value);
  }
  if(t.dataset && t.dataset.siteInput){
    openSiteDropdown(view.draft ? view.draft.customerId : null, t.value);
  }
}

function onAppKeydown(e){
  const t = e.target;
  if(t.dataset && t.dataset.siteInput){
    if(e.key==="Escape") closeSiteDropdown();
    return;
  }
  if(!(t.dataset && t.dataset.catalogInput)) return;
  const part = t.dataset.catalogInput;
  if(e.key==="Enter"){
    e.preventDefault();
    const dd = document.querySelector("[data-catalog-dropdown='"+part+"']");
    const first = dd && !dd.hidden && dd.querySelector(".catalog-dropdown-item[data-id]");
    if(first) addCatalogItemToDraft(part, first.dataset.id);
  }else if(e.key==="Escape"){
    closeCatalogDropdown(part);
  }
}

function onDocumentClickCloseCatalog(e){
  document.querySelectorAll("[data-catalog-dropdown]:not([hidden])").forEach(function(dd){
    const picker = dd.closest("[data-catalog-picker]");
    if(picker && !picker.contains(e.target)) dd.hidden = true;
  });
  const sitedd = document.querySelector("[data-site-dropdown]:not([hidden])");
  if(sitedd){
    const picker = sitedd.closest("[data-site-picker]");
    if(picker && !picker.contains(e.target)) sitedd.hidden = true;
  }
}

function onAppInput(e){
  scheduleDraftPersist();
  const t = e.target;
  if(t.id==="pms-search"){
    view.pmsSearch = t.value;
    renderPmsList();
    return;
  }
  if(t.id==="cr-search"){ view.crSearch = t.value; renderComplaintRegisterList(); return; }
  if(t.id==="cr-date-from"){ view.crDateFrom = t.value; renderComplaintRegisterList(); return; }
  if(t.id==="cr-date-to"){ view.crDateTo = t.value; renderComplaintRegisterList(); return; }
  if(t.id==="ob-search"){ view.obSearch = t.value; renderServiceOrderBookList(); return; }
  if(t.id==="closed-fsr-search"){ view.closedFsrSearch = t.value; renderClosedFsrList(); return; }
  const fsrForm = t.closest("[data-fsr-form]");
  if(fsrForm && t.dataset.ffield){
    ensureFsrDraft(fsrForm.dataset.visitId);
    setField(view.fsrDraft, t.dataset.ffield, t.value);
    return;
  }
  if(fsrForm){
    const spareRow = t.closest("tr[data-frow-id]");
    if(spareRow){
      ensureFsrDraft(fsrForm.dataset.visitId);
      const sp = (view.fsrDraft.spares||[]).find(function(s){ return s.id===spareRow.dataset.frowId; });
      if(sp){
        if(t.classList.contains("fsr-sp-code")) sp.partCode = t.value;
        else if(t.classList.contains("fsr-sp-desc")) sp.description = t.value;
        else if(t.classList.contains("fsr-sp-qty")) sp.qty = t.value;
        else if(t.classList.contains("fsr-sp-rs")) sp.priceRs = t.value;
        else if(t.classList.contains("fsr-sp-ps")) sp.pricePs = t.value;
      }
      return;
    }
  }
  if(view.tab==="editor" && view.draft){
    if(t.dataset.catalogInput){
      openCatalogDropdown(t.dataset.catalogInput, t.value);
      return;
    }
    if(t.dataset.siteInput){
      openSiteDropdown(view.draft.customerId, t.value);
      setField(view.draft, "client.siteAddressLines", t.value);
      return;
    }
    if(t.dataset.field){
      let val = t.value;
      if(t.dataset.field==="gstPercent") val = num(val);
      setField(view.draft, t.dataset.field, val);
      if(t.dataset.field==="gstPercent") recomputeEditorTotals();
      return;
    }
    const hlRoomEl = t.closest("[data-hlroom-id]");
    if(hlRoomEl && t.dataset.hlPath){
      const room = (view.draft.heatLoadRooms||[]).find(function(x){ return x.id===hlRoomEl.dataset.hlroomId; });
      if(room){
        const path = t.dataset.hlPath;
        const val = path==="name" ? t.value : num(t.value);
        setHeatLoadField(room, path, val);
        if(path==="outsideDB" || path==="insideDB"){
          const cEl = hlRoomEl.querySelector("[data-hl-c-for=\""+path+"\"]");
          if(cEl) cEl.textContent = "≈ "+fmtNum(fToC(val),1)+" °C";
        }
        const resBlock = hlRoomEl.querySelector("[data-hl-resultsblock]");
        if(resBlock) resBlock.outerHTML = heatLoadResultsBlockHTML(room);
      }
      return;
    }
    const amcRow = t.closest("[data-amc-items-body] tr[data-row-id]");
    if(amcRow){
      const item = (view.draft.amcItems||[]).find(function(i){ return i.id===amcRow.dataset.rowId; });
      if(item){
        if(t.classList.contains("amc-item-name")) item.name = t.value;
        else if(t.classList.contains("amc-item-hsn")) item.hsn = t.value;
        else if(t.classList.contains("amc-item-qty")) item.qty = num(t.value);
        else if(t.classList.contains("amc-item-rate")) item.rate = num(t.value);
        if(t.classList.contains("amc-item-qty")||t.classList.contains("amc-item-rate")){
          const amt = num(item.qty)*num(item.rate);
          const cell = amcRow.querySelector("[data-amc-amount-for='"+item.id+"']");
          if(cell) cell.textContent = fmtINR(amt);
          if(t.classList.contains("amc-item-qty")) updateAmcMachineCount();
          recomputeEditorTotals();
        }
      }
      return;
    }
    const repairRow = t.closest("[data-repair-items-body] tr[data-row-id]");
    if(repairRow){
      const item = (view.draft.repairItems||[]).find(function(i){ return i.id===repairRow.dataset.rowId; });
      if(item){
        if(t.classList.contains("repair-item-name")) item.name = t.value;
        else if(t.classList.contains("repair-item-unit")) item.unit = t.value;
        else if(t.classList.contains("repair-item-qty")) item.qty = num(t.value);
        else if(t.classList.contains("repair-item-rate")) item.rate = num(t.value);
        if(t.classList.contains("repair-item-qty")||t.classList.contains("repair-item-rate")){
          const amt = num(item.qty)*num(item.rate);
          const cell = repairRow.querySelector("[data-repair-amount-for='"+item.id+"']");
          if(cell) cell.textContent = fmtINR(amt);
          recomputeEditorTotals();
        }
      }
      return;
    }
    const row = t.closest("tr[data-row-id]");
    if(row){
      const part = row.dataset.part;
      const item = view.draft[part==="A"?"partA":"partB"].find(function(i){ return i.id===row.dataset.rowId; });
      if(item){
        if(t.classList.contains("item-name")) item.name = t.value;
        else if(t.classList.contains("item-hsn")) item.hsn = t.value;
        else if(t.classList.contains("item-unit")) item.unit = t.value;
        else if(t.classList.contains("item-qty")) item.qty = num(t.value);
        else if(t.classList.contains("item-rate")) item.rate = num(t.value);
        else if(t.classList.contains("item-discount")) item.discount = Math.min(100, Math.max(0, num(t.value)));
        if(t.classList.contains("item-qty")||t.classList.contains("item-rate")||t.classList.contains("item-discount")){
          const amt = itemAmount(item);
          const cell = row.querySelector("[data-amount-for='"+item.id+"']");
          if(cell) cell.textContent = fmtINR(amt);
          recomputeEditorTotals();
        }
      }
      return;
    }
    const drow = t.closest("tr[data-drow-id]");
    if(drow){
      const r = view.draft.distribution.find(function(x){ return x.id===drow.dataset.drowId; });
      if(r){
        if(t.classList.contains("d-area")) r.area = t.value;
        else if(t.classList.contains("d-unittype")) r.unitType = t.value;
        else if(t.classList.contains("d-capacity")) r.capacity = num(t.value);
        else if(t.classList.contains("d-selected-capacity")) r.selectedCapacity = t.value==="" ? "" : num(t.value);
        else if(t.classList.contains("d-qty")) r.qty = num(t.value);
        // Total TR is Selected Capacity × Qty — Heat load Capacity is
        // reference info only and doesn't feed the total (see
        // distRowSelectedCapacity's fallback for rows with no Selected
        // Capacity set yet).
        if(t.classList.contains("d-selected-capacity")||t.classList.contains("d-qty")){
          const cell = drow.querySelector("[data-dtotal-for='"+r.id+"']");
          if(cell) cell.textContent = fmtNum(distRowSelectedCapacity(r)*num(r.qty),2)+" TR";
          const totalsRow = document.querySelector("[data-dist-totals]");
          if(totalsRow){
            const qtyCell = totalsRow.querySelector(".dist-total-qty");
            const trCell = totalsRow.querySelector(".dist-total-tr");
            if(qtyCell) qtyCell.textContent = fmtNum(distributionTotalQty(view.draft.distribution),0);
            if(trCell) trCell.textContent = fmtNum(distributionTotalTR(view.draft.distribution),2)+" TR";
          }
        }
      }
      return;
    }
    const termRow = t.closest(".term-row[data-term-idx]");
    if(termRow && termRow.closest("[data-terms-list]")){
      const idx = Number(termRow.dataset.termIdx);
      const term = view.draft.terms[idx];
      if(term){
        if(t.classList.contains("term-label")) term.label = t.value;
        else if(t.classList.contains("term-value")) term.value = t.value;
      }
      return;
    }
  }
  if(view.tab==="customer-editor" && view.customerDraft){
    if(t.dataset.cfield){
      setField(view.customerDraft, t.dataset.cfield, t.value);
      return;
    }
    const siteCard = t.closest(".site-card[data-site-idx]");
    if(siteCard){
      const site = view.customerDraft.sites[Number(siteCard.dataset.siteIdx)];
      if(site){
        if(t.classList.contains("site-label")) site.label = t.value;
        else if(t.classList.contains("site-address")) site.addressLines = t.value;
        else if(t.classList.contains("site-pincode")) site.pincode = t.value;
      }
      return;
    }
  }
  if(view.tab==="service-customer-editor" && view.serviceCustomerDraft){
    if(t.dataset.cfield){
      setField(view.serviceCustomerDraft, t.dataset.cfield, t.value);
      return;
    }
    const siteCard = t.closest(".site-card[data-site-idx]");
    if(siteCard){
      const site = view.serviceCustomerDraft.sites[Number(siteCard.dataset.siteIdx)];
      if(site){
        const eqRow = t.closest(".equip-row[data-eq-idx]");
        if(eqRow){
          const eq = (site.equipment||[])[Number(eqRow.dataset.eqIdx)];
          if(eq){
            if(t.classList.contains("eq-type")) eq.acType = t.value;
            else if(t.classList.contains("eq-capacity")) eq.capacity = t.value;
            else if(t.classList.contains("eq-qty")) eq.qty = t.value;
            else if(t.classList.contains("eq-make")) eq.make = t.value;
            else if(t.classList.contains("eq-model")) eq.model = t.value;
          }
          return;
        }
        if(t.classList.contains("site-label")) site.label = t.value;
        else if(t.classList.contains("site-address")) site.addressLines = t.value;
        else if(t.classList.contains("site-pincode")) site.pincode = t.value;
      }
      return;
    }
  }
  if(view.tab==="register-complaint" && view.complaintDraft && t.dataset.cfield){
    setField(view.complaintDraft, t.dataset.cfield, t.value);
    return;
  }
  if(view.tab==="purchase-vendor-editor" && view.vendorDraft && t.dataset.cfield){
    setField(view.vendorDraft, t.dataset.cfield, t.value);
    return;
  }
  if(view.tab==="purchase-item-editor" && view.purchaseItemDraft && t.dataset.cfield){
    let val = t.value;
    if(t.dataset.cfield==="gstPercent") val = num(val);
    setField(view.purchaseItemDraft, t.dataset.cfield, val);
    return;
  }
  if(view.tab==="execution-boq-editor" && view.executionBoqDraft){
    const b = view.executionBoqDraft;
    if(t.dataset.bfield){
      setField(b, t.dataset.bfield, t.value);
      return;
    }
    if(t.dataset.qifield && view.boqQtyRequestDraft){
      const d = view.boqQtyRequestDraft;
      let val = t.value;
      if(t.dataset.qifield==="requestedQty") val = num(val);
      setField(d, t.dataset.qifield, val);
      return;
    }
    if(view.boqGroupPickDraft && (t.dataset.role==="boq-group-pick-existing"||t.dataset.role==="boq-group-pick-new")){
      view.boqGroupPickDraft.groupName = t.value;
      if(t.dataset.role==="boq-group-pick-existing") renderApp();
      return;
    }
    const boqRow = t.closest("[data-boq-items-body] tr[data-row-id]");
    if(boqRow){
      const item = (b.items||[]).find(function(i){ return i.id===boqRow.dataset.rowId; });
      if(item){
        if(t.classList.contains("boq-item-purchase-pick")){
          // Picking a size for a split row (see add-boq-size-split) — name/
          // HSN come from the chosen Purchase Item Database entry (so Store's
          // stock lookup, which matches by name, finds it); unit/rate stay
          // whatever the split inherited from the quoted item, since neither
          // the customer's billed unit nor rate change by site size.
          const pi = t.value ? findPurchaseItem(t.value) : null;
          item.purchaseItemId = t.value || null;
          item.name = pi ? pi.name : "";
          item.hsn = pi ? pi.hsnCode : "";
          renderApp();
          return;
        }
        if(t.classList.contains("boq-item-name")) item.name = t.value;
        else if(t.classList.contains("boq-item-hsn")) item.hsn = t.value;
        else if(t.classList.contains("boq-item-unit")) item.unit = t.value;
        else if(t.classList.contains("boq-item-qty")) item.qty = num(t.value);
        else if(t.classList.contains("boq-item-rate")) item.rate = num(t.value);
        if(t.classList.contains("boq-item-qty")||t.classList.contains("boq-item-rate")){
          const cell = boqRow.querySelector("[data-boqamount-for='"+item.id+"']");
          if(cell) cell.textContent = fmtINR(num(item.qty)*num(item.rate));
        }
      }
      return;
    }
  }
  if(view.tab==="material-request-editor" && view.materialRequestDraft && view.materialRequestDraft.requestKind!=="stock" && isClientId(view.materialRequestDraft.id)){
    const m = view.materialRequestDraft;
    const mrRow = t.closest("[data-mr-items-body] tr[data-row-id]");
    if(mrRow && t.classList.contains("mr-item-qty")){
      const item = (m.requestedItems||[]).find(function(i){ return i.id===mrRow.dataset.rowId; });
      if(item){
        item.qty = num(t.value);
        const cell = mrRow.querySelector("[data-mramount-for='"+item.id+"']");
        if(cell) cell.textContent = fmtINR(num(item.qty)*num(item.rate));
      }
      return;
    }
  }
  if(view.tab==="material-request-editor" && view.materialRequestDraft && view.materialRequestDraft.requestKind==="stock"){
    const m = view.materialRequestDraft;
    if(isClientId(m.id)){
      const srRow = t.closest("[data-stockreq-items-body] tr[data-row-id]");
      if(srRow && t.classList.contains("stockreq-item-qty")){
        const item = (m.requestedItems||[]).find(function(i){ return i.id===srRow.dataset.rowId; });
        if(item) item.qty = num(t.value);
        return;
      }
    }
    if(view.poDraft && t.dataset.pofield){
      setField(view.poDraft, t.dataset.pofield, t.value);
      return;
    }
    if(view.poDraft){
      const poRow = t.closest("[data-po-items-body] tr[data-row-id]");
      if(poRow){
        const item = (view.poDraft.items||[]).find(function(i){ return i.id===poRow.dataset.rowId; });
        if(item){
          if(t.classList.contains("po-item-qty")) item.qty = num(t.value);
          else if(t.classList.contains("po-item-rate")) item.rate = num(t.value);
          const cell = poRow.querySelector("[data-po-amount-for='"+item.id+"']");
          if(cell) cell.textContent = fmtINR(num(item.qty)*num(item.rate));
        }
        return;
      }
    }
    if(view.grnDraft && t.dataset.grnfield){
      setField(view.grnDraft, t.dataset.grnfield, t.value);
      return;
    }
    if(view.grnDraft){
      const grnRow = t.closest("[data-grn-items-body] tr[data-row-id]");
      if(grnRow){
        const item = (view.grnDraft.items||[]).find(function(i){ return i.id===grnRow.dataset.rowId; });
        if(item && t.classList.contains("grn-item-qty")){
          let v = num(t.value);
          if(v > num(item.outstanding)) v = num(item.outstanding);
          item.qtyReceived = v;
        }
        return;
      }
    }
  }
  if(view.tab==="request-invoice" || view.tab==="invoice-requests"){
    const d = currentInvoiceDraft();
    if(d){
      if(t.dataset.cfield){
        let val = t.value;
        setField(d, t.dataset.cfield, val);
        // Changing the linked quote changes whether/what the "add an item
        // from this quote" picker above the items table shows — needs a
        // full re-render, unlike the other plain text/textarea cfields here.
        if(t.dataset.cfield==="linkedQuoteId") return renderApp();
        return;
      }
      const invRow = t.closest("[data-inv-items-body] tr[data-row-id]");
      if(invRow){
        const item = (d.items||[]).find(function(i){ return i.id===invRow.dataset.rowId; });
        if(item){
          if(t.classList.contains("inv-item-desc")) item.description = t.value;
          else if(t.classList.contains("inv-item-hsn")) item.hsn = t.value;
          else if(t.classList.contains("inv-item-unit")) item.unit = t.value;
          else if(t.classList.contains("inv-item-qty")) item.qty = num(t.value);
          else if(t.classList.contains("inv-item-rate")) item.rate = num(t.value);
          if(t.classList.contains("inv-item-qty")||t.classList.contains("inv-item-rate")){
            const cell = invRow.querySelector("[data-invamount-for='"+item.id+"']");
            if(cell) cell.textContent = fmtINR(invoiceItemAmount(item));
            recomputeInvoiceTotalsStrip();
          }
        }
        return;
      }
    }
  }
  if(view.purchaseEntryDraft && t.dataset.pfield){
    const d = view.purchaseEntryDraft;
    let val = t.value;
    if(["taxableValue","cgstAmount","sgstAmount","igstAmount","amountPaid"].indexOf(t.dataset.pfield)!==-1) val = num(val);
    setField(d, t.dataset.pfield, val);
    if(["taxableValue","cgstAmount","sgstAmount","igstAmount"].indexOf(t.dataset.pfield)!==-1){
      const totalEl = document.querySelector("[data-purchase-total]");
      if(totalEl) totalEl.textContent = fmtINR(purchaseEntryTotal(d));
    }
    return;
  }
  if(view.storeInventoryDraft && t.dataset.ifield){
    const sd = view.storeInventoryDraft;
    let val = t.value;
    if(t.dataset.ifield==="qty") val = num(val);
    setField(sd, t.dataset.ifield, val);
    return;
  }
  if(t.dataset.role==="invoice-payment-input"){
    view.invoicePaymentDraftAmount = num(t.value);
    return;
  }
  if(t.dataset.role==="purchase-payment-input"){
    view.purchasePaymentDraftAmount = num(t.value);
    return;
  }
}

function onAppChange(e){
  const t = e.target;
  const fsrForm = t.closest("[data-fsr-form]");
  if(fsrForm){
    if(t.dataset.ffield && t.type==="checkbox"){
      ensureFsrDraft(fsrForm.dataset.visitId);
      setField(view.fsrDraft, t.dataset.ffield, t.checked);
      return renderApp();
    }
    if(t.dataset.role==="fsr-equip-pick"){
      const visitId = fsrForm.dataset.visitId;
      const v = findServiceJobById(visitId);
      const equip = v ? jobCustomerSite(v).equip : [];
      const eq = equip.find(function(x){ return x.id===t.value; });
      if(eq){
        ensureFsrDraft(visitId);
        view.fsrDraft.equipmentId = eq.id;
        view.fsrDraft.capacity = eq.capacity||"";
        view.fsrDraft.equipment = equipmentBaseName(eq);
        view.fsrDraft.model = eq.model||"";
      }
      return renderApp();
    }
  }
  if(t.dataset.role==="fsr-photos-input" && t.type==="file"){
    const visitId = t.dataset.visitId;
    if(visitId && t.files && t.files.length){
      view.fsrPendingPhotos = view.fsrPendingPhotos || {};
      const existing = view.fsrPendingPhotos[visitId] || [];
      view.fsrPendingPhotos[visitId] = existing.concat(Array.from(t.files));
      t.value = ""; // clear the picker so the same file can be re-chosen after a drop
      return renderApp();
    }
  }
  if(view.tab==="editor" && view.draft){
    if(t.dataset.role==="customer-select"){
      applyCustomerToDraft(view.draft, t.value||null, null);
      return renderApp();
    }
    if(t.dataset.role==="site-select"){
      applyCustomerToDraft(view.draft, view.draft.customerId, t.value||null);
      return renderApp();
    }
    if(t.classList.contains("hl-city-select")){
      const hlRoomEl = t.closest("[data-hlroom-id]");
      const room = hlRoomEl && (view.draft.heatLoadRooms||[]).find(function(x){ return x.id===hlRoomEl.dataset.hlroomId; });
      if(room){
        const city = state.cityConditions.find(function(c){ return c.id===t.value; });
        room.cityId = t.value||"";
        if(city){ room.outsideDB = city.outsideDB; room.outsideWB = city.outsideWB; room.outsideGR = city.outsideGR; }
        hlRoomEl.outerHTML = heatLoadRoomCardHTML(room);
      }
      return;
    }
  }
  if(view.tab==="register-complaint" && view.complaintDraft){
    if(t.dataset.role==="complaint-customer-select"){
      applyCustomerToComplaintDraft(t.value||null, null);
      return renderApp();
    }
    if(t.dataset.role==="complaint-site-select"){
      applyCustomerToComplaintDraft(view.complaintDraft.customerId, t.value||null);
      return renderApp();
    }
    if(t.dataset.role==="complaint-equip-pick"){
      const equip = complaintDraftEquip();
      const eq = equip.find(function(x){ return x.id===t.value; });
      if(eq){
        view.complaintDraft.equipmentId = eq.id;
        view.complaintDraft.capacity = eq.capacity||"";
        view.complaintDraft.equipment = equipmentBaseName(eq);
        view.complaintDraft.model = eq.model||"";
      }
      return renderApp();
    }
  }
  if(view.tab==="request-invoice" || view.tab==="invoice-requests"){
    const d = currentInvoiceDraft();
    if(d){
      if(t.dataset.role==="invreq-customer-select"){
        applyCustomerToInvoiceRequestDraft(t.value||null, null);
        return renderApp();
      }
      if(t.dataset.role==="invreq-site-select"){
        applyCustomerToInvoiceRequestDraft(d.customerId||null, t.value||null);
        return renderApp();
      }
      if(t.dataset.role==="invreq-same-as-consignee"){
        d.sameAsConsignee = t.checked;
        if(d.sameAsConsignee){
          d.deliveryName = d.consigneeName; d.deliveryAddress = d.consigneeAddress;
          d.deliveryPincode = d.consigneePincode; d.deliveryGstin = d.consigneeGstin;
        }
        return renderApp();
      }
      if(t.dataset.role==="invreq-add-quote-item"){
        if(t.value===""){ return; }
        const q = d.linkedQuoteId ? state.quotes.find(function(x){ return x.id===d.linkedQuoteId; }) : null;
        const items = q ? quoteItemsFlat(q) : [];
        const picked = items[Number(t.value)];
        if(picked){
          d.items = d.items||[];
          d.items.push({ id: rowIdCounter(), description:picked.name, hsn:picked.hsn||"", unit:picked.unit||"Nos", qty:picked.qty||1, rate:picked.rate||0, gstPercent:18 });
        }
        return renderApp();
      }
    }
  }
  if(view.tab==="execution-boq-editor" && view.executionBoqDraft && t.dataset.role==="boq-add-quote-item"){
    if(t.value==="") return;
    const b = view.executionBoqDraft;
    const q = state.quotes.find(function(x){ return x.id===b.quoteId; });
    const items = q ? quoteItemsFlat(q) : [];
    const picked = items[Number(t.value)];
    if(picked){
      const already = maxAllowedQtyForOfferItem(b.quoteId, picked.name, b.id);
      b.items = b.items||[];
      b.items.push({ id: rowIdCounter(), name:picked.name, hsn:picked.hsn||"", unit:picked.unit||"Nos", qty: Math.min(picked.qty||1, already||0) || 0, rate:picked.rate||0, source:"offer" });
    }
    return renderApp();
  }
  if(view.tab==="material-request-editor" && view.materialRequestDraft && isClientId(view.materialRequestDraft.id) && t.dataset.role==="mr-add-boq-item"){
    if(t.value==="") return;
    const m = view.materialRequestDraft;
    const b = findExecutionBoq(m.boqId);
    const boqItems = b ? (b.items||[]) : [];
    const picked = boqItems[Number(t.value)];
    if(picked){
      const already = maxAllowedQtyForBoqItem(m.boqId, picked.name, null);
      m.requestedItems = m.requestedItems||[];
      m.requestedItems.push({ id: rowIdCounter(), name:picked.name, hsn:picked.hsn||"", unit:picked.unit||"Nos", qty: Math.min(picked.qty?num(picked.qty):already, already||0) || 0, rate:num(picked.rate) });
    }
    return renderApp();
  }
  if(view.tab==="material-request-editor" && view.materialRequestDraft && view.materialRequestDraft.requestKind==="stock" && isClientId(view.materialRequestDraft.id) && t.dataset.role==="stockreq-add-item"){
    if(t.value==="") return;
    const m = view.materialRequestDraft;
    const pi = findPurchaseItem(t.value);
    if(pi){
      m.requestedItems = m.requestedItems||[];
      const already = m.requestedItems.find(function(it){ return it.purchaseItemId===pi.id; });
      if(already) already.qty = num(already.qty)+1;
      else m.requestedItems.push({ id: rowIdCounter(), purchaseItemId: pi.id, name: pi.name, hsn: pi.hsnCode||"", unit: pi.unit||"Nos", qty: 1 });
    }
    return renderApp();
  }
  if(view.poDraft && t.dataset.role==="po-vendor-select"){
    const d = view.poDraft;
    d.vendorId = t.value||"";
    const v = t.value ? findVendor(t.value) : null;
    if(v){
      d.vendorName = v.name; d.vendorGstin = v.gstin||"";
      d.vendorAddress = v.address||""; d.vendorEmail = v.email||""; d.vendorPhone = v.phone||"";
    }
    return renderApp();
  }
  if(view.purchaseEntryDraft && t.dataset.role==="purchase-vendor-select"){
    // Patches the two dependent fields directly rather than calling
    // renderApp() — a full re-render here would recreate the scanned-invoice
    // <input type="file"> below and silently drop whatever the user already
    // picked (file inputs can't be repopulated from view state).
    const d = view.purchaseEntryDraft;
    d.vendorId = t.value||"";
    const v = t.value ? findVendor(t.value) : null;
    if(v){ d.vendorName = v.name; d.vendorGstin = v.gstin||""; }
    const nameEl = document.querySelector('[data-pfield="vendorName"]');
    const gstinEl = document.querySelector('[data-pfield="vendorGstin"]');
    if(nameEl){ nameEl.value = d.vendorName||""; nameEl.disabled = !!d.vendorId; }
    if(gstinEl){ gstinEl.value = d.vendorGstin||""; gstinEl.disabled = !!d.vendorId; }
    return;
  }
  if(view.purchaseEntryDraft && t.dataset.role==="purchase-item-select"){
    // Same reasoning as purchase-vendor-select above — patch in place,
    // never renderApp(), so the scanned-invoice file input survives.
    const d = view.purchaseEntryDraft;
    d.itemId = t.value||"";
    const it = t.value ? findPurchaseItem(t.value) : null;
    if(it){ d.description = it.name; d.hsnCode = it.hsnCode||""; d.itemGstPercent = it.gstPercent||0; }
    else { d.itemGstPercent = 0; }
    const descEl = document.querySelector('[data-pfield="description"]');
    const hsnEl = document.querySelector('[data-pfield="hsnCode"]');
    const gstHintEl = document.querySelector('[data-purchase-item-gst-hint]');
    if(descEl){ descEl.value = d.description||""; descEl.disabled = !!d.itemId; }
    if(hsnEl){ hsnEl.value = d.hsnCode||""; hsnEl.disabled = !!d.itemId; }
    if(gstHintEl) gstHintEl.textContent = d.itemId ? ("GST: "+fmtNum(d.itemGstPercent,1)+"%") : "";
    return;
  }
  if(view.storeInventoryDraft && t.dataset.role==="inv-item-select"){
    view.storeInventoryDraft.purchaseItemId = t.value||"";
    view.storeInventoryMsg = null;
    return renderApp();
  }
  if(view.storeInventoryDraft && t.dataset.role==="inv-movetype-select"){
    view.storeInventoryDraft.moveType = t.value==="out" ? "out" : "in";
    view.storeInventoryMsg = null;
    return renderApp();
  }
  if(view.tab==="print" && t.dataset.action==="toggle-include-heatload"){
    view.printIncludeHeatLoad = t.checked;
    return renderApp();
  }
  if(view.tab==="employees"){
    const row = t.closest("tr[data-emp-id]");
    if(row){
      const id = row.dataset.empId;
      if(t.classList.contains("emp-name")) return updateEmployee(id, { full_name:t.value.trim()||null });
      if(t.classList.contains("emp-role")) return updateEmployee(id, { role:t.value });
      if(t.classList.contains("emp-position")) return updateEmployee(id, { job_title:t.value.trim()||null });
      if(t.classList.contains("emp-department")) return updateEmployee(id, { department:t.value||null });
      if(t.classList.contains("emp-seniority")) return updateEmployee(id, { seniority:t.value||null });
      if(t.classList.contains("emp-active")) return updateEmployee(id, { is_active:t.checked });
      if(t.classList.contains("emp-joined")) return updateEmployee(id, { date_of_joining:t.value||null });
    }
    if(t.classList.contains("dept-perm-check")){
      const permRow = t.closest("tr[data-perm-dept]");
      if(permRow) return setDepartmentPermission(permRow.dataset.permDept, t.dataset.seniority, permRow.dataset.permKey, t.checked);
    }
  }
  if(view.tab==="dept-employees"){
    const drow = t.closest("tr[data-demp-id]");
    if(drow){
      const id = drow.dataset.dempId;
      if(t.classList.contains("demp-position")) return updateDeptEmployee(id, { job_title:t.value.trim()||null });
      if(t.classList.contains("demp-seniority")) return updateDeptEmployee(id, { seniority:t.value });
      if(t.classList.contains("demp-active")) return updateDeptEmployee(id, { is_active:t.checked });
    }
  }
}

function onAppClick(e){
  const navBtn = e.target.closest("[data-nav]");
  if(navBtn){
    view.tab = navBtn.dataset.nav;
    if(view.tab!=="editor") view.draft = null;
    if(view.tab!=="customer-editor") view.customerDraft = null;
    if(view.tab!=="service-customer-editor") view.serviceCustomerDraft = null;
    if(view.tab!=="register-complaint"){ view.complaintDraft = null; view.complaintMsg = null; }
    if(view.tab!=="purchase-vendor-editor") view.vendorDraft = null;
    if(view.tab!=="request-invoice"){ view.invoiceRequestDraft = null; view.invoiceReqMsg = null; }
    if(view.tab!=="invoice-requests"){ view.invoiceReqExpandedId = null; view.invoiceReviewDraft = null; }
    if(view.tab!=="purchase-register"){ view.purchaseEntryDraft = null; view.purchaseEntryMsg = null; }
    if(view.tab!=="material-request-editor") view.mrReturnTab = null;
    if(view.tab!=="quotes") view.customerFilter = null;
    if(view.tab!=="employees") view.employeesDeptFilter = null;
    view.editingProductId = null; view.confirmDeleteId = null; view.justSaved = false; view.saveError = null;
    view.inviteOpen = false; view.inviteMsg = null;
    view.deptInviteOpen = false; view.deptEmpMsg = null;
    return renderApp();
  }
  const btn = e.target.closest("[data-action]");
  if(!btn) return;
  const action = btn.dataset.action;

  if(action==="new-quote"){
    view.draft = newDraftQuote(btn.dataset.type);
    view.editorReturnTab = null;

/* Matches the px width baked into the .pdf-export-mode CSS above (718px ==
   190mm, the A4 content width after 10mm side margins). html2canvas clones
   the page into an offscreen frame to rasterize it, and — unless told
   otherwise — sizes that clone's viewport to the real browser window's
   width, not the target element's own width. On a wide desktop window that
   makes the clone reflow wider than 718px, so the capture (and everything
   placed in it, including the letterhead and the quote-number line) runs
   past the printable area and gets cropped at the PDF page edge. Pinning
   both `width` and `windowWidth` to PDF_CAPTURE_PX forces the clone to use
   the same 718px viewport the CSS was written for, regardless of how wide
   the browser window actually is. */
const PDF_CAPTURE_PX = 718;

// True as long as SOME path to a working PDF export is available: either
// the dedicated html2canvas + jsPDF builds (the good, page-by-page capture
// path — see renderHolderPagesToPdf) or, failing that, the html2pdf bundle
// on its own (the older combined-capture fallback). Only false if every CDN
// script failed to load (e.g. no internet, or the CDN itself is blocked) —
// in that case export bails out with a clear message instead of silently
// producing a blank file.
function pdfLibsReady(){
  const hasSplitLibs = typeof window.html2canvas === "function" && !!(window.jspdf && typeof window.jspdf.jsPDF === "function");
  return hasSplitLibs || typeof html2pdf !== "undefined";
}

/* Builds an isolated, fixed-width offscreen copy of the print document
   (rather than capturing the live, in-flow .print-page directly) so the
   capture can never inherit width/scroll quirks from the surrounding app
   shell — same defensive purpose as the windowWidth pin above, belt and
   suspenders. Positioned off the visible canvas so nothing flashes on
   screen while the PDF is generated. */
function buildPdfExportHolder(source){
  const holder = document.createElement("div");
  /* position:absolute (not fixed) — html2canvas's DOM-cloning capture step
     has long-standing bugs with position:fixed elements (the clone can lose
     the fixed positioning and land somewhere else in the cloned document,
     so html2canvas crops the region where the ORIGINAL element was, which
     is now empty → a blank page). absolute is reliably preserved through
     the clone. Placed inside a fixed-size, overflow-hidden wrapper (added
     at call sites below) so it never affects page scroll height while
     off-screen. */
  holder.style.position = "absolute";
  holder.style.left = "0";
  holder.style.top = "0";
  holder.style.width = PDF_CAPTURE_PX + "px";
  holder.className = "print-page pdf-export-mode";
  holder.innerHTML = source.innerHTML;
  document.body.appendChild(holder);
  return holder;
}

/* Each .doc-page / .m-page is AUTHORED to fit one A4 page (that's what the
   min-height + absolutely-positioned footer in the pdf-export-mode CSS is
   for), and almost always does. But a page whose actual content runs long —
   a BOQ Part with a dozen+ line items, a long terms list — renders taller
   than that in the live DOM (min-height is a minimum, not a cap), and
   because the whole element is captured as ONE canvas and dropped onto ONE
   physical PDF page by renderHolderPagesToPdf below, any of that overflow
   used to simply fall below the bottom edge of the page and vanish — not
   corrupted, just never placed anywhere: the "third page not fully
   exporting" symptom. This returns candidate Y offsets (in CSS px, measured
   from pageEl's own top, at the same PDF_CAPTURE_PX layout width
   html2canvas will render) where it's SAFE to cut such a page into an extra
   page — the bottom edge of every table row / terms row / list item, plus
   every direct child section of the page — so that if a split is needed it
   lands between rows/sections instead of slicing through the middle of one. */
function pdfSafeBreakOffsetsPx(pageEl){
  const top = pageEl.getBoundingClientRect().top;
  const offsets = [];
  Array.prototype.forEach.call(pageEl.querySelectorAll("tr, .t-row, li"), function(el){
    offsets.push(el.getBoundingClientRect().bottom - top);
  });
  Array.prototype.forEach.call(pageEl.children, function(el){
    offsets.push(el.getBoundingClientRect().bottom - top);
  });
  offsets.sort(function(a,b){ return a-b; });
  return offsets;
}

/* Renders each .doc-page / .m-page inside the export holder to the PDF as
   its OWN html2canvas capture + own jsPDF page, instead of handing the
   whole (possibly multi-page) holder to html2pdf.js's combined
   capture-then-slice pipeline. That combined approach renders every page of
   a document into ONE giant canvas (a 3-page A4 quote at scale:2 is roughly
   1436×6100px) and then relies on the "pagebreak" plugin to cut it apart
   afterwards — on many phones (limited canvas memory/tile size) that single
   oversized canvas silently comes back blank or truncated, which is what
   "most of them are coming blank" looks like in practice: the FSR (always
   one page, so one small canvas) tends to work, while the 3-page quote/AMC
   documents don't. Capturing one page at a time keeps each canvas small
   regardless of how many pages the document has, and sidesteps the
   pagebreak-slicing step entirely. Falls back to the old single-shot
   html2pdf().from(holder) path if html2canvas/jsPDF aren't exposed as
   globals by whatever build of the bundle actually loaded, so this is
   strictly additive rather than a hard cutover.

   If a given page's captured canvas turns out taller than one physical A4
   page can hold (see pdfSafeBreakOffsetsPx above), it's sliced across as
   many extra pages as needed — at a safe row/section boundary where
   possible — instead of being placed whole and having the overflow run off
   the bottom of the page and disappear from the exported file. */
function renderHolderPagesToPdf(holder, filename){
  const pageEls = Array.prototype.slice.call(holder.querySelectorAll(".doc-page, .m-page"));
  const H2C = window.html2canvas;
  const JsPDFCtor = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
  if(!pageEls.length || typeof H2C !== "function" || typeof JsPDFCtor !== "function"){
    const opt = {
      margin: [12,10,12,10],
      filename: filename,
      image: { type:"jpeg", quality:0.98 },
      html2canvas: { scale:2, useCORS:true, backgroundColor:"#ffffff", width:PDF_CAPTURE_PX, windowWidth:PDF_CAPTURE_PX, scrollX:0, scrollY:0 },
      jsPDF: { unit:"mm", format:"a4", orientation:"portrait" },
      pagebreak: { mode:["css","legacy"], before:".doc-page + .doc-page, .m-page + .m-page, .m-page + .doc-page, .doc-page + .m-page" }
    };
    return html2pdf().set(opt).from(holder).save();
  }
  const marginXmm = 10, marginTopMm = 12, marginBottomMm = 12, pageWidthMm = 210 - marginXmm*2; // A4 width minus left+right margin
  const pageContentHeightMm = 297 - marginTopMm - marginBottomMm; // usable height on one physical A4 page
  const pdf = new JsPDFCtor({ unit:"mm", format:"a4", orientation:"portrait" });
  let chain = Promise.resolve();
  let pdfPageCount = 0;
  pageEls.forEach(function(pageEl){
    // Measured against the live (off-screen) pageEl before capture, at the
    // same PDF_CAPTURE_PX width html2canvas is about to render — so these
    // offsets line up with the canvas this page produces.
    const safeBreaksPx = pdfSafeBreakOffsetsPx(pageEl);
    chain = chain.then(function(){
      return H2C(pageEl, { scale:2, useCORS:true, backgroundColor:"#ffffff", width:PDF_CAPTURE_PX, windowWidth:PDF_CAPTURE_PX, scrollX:0, scrollY:0 });
    }).then(function(canvas){
      const pxPerMm = canvas.width / pageWidthMm; // canvas px <-> mm, both axes (html2canvas scales uniformly)
      const domToCanvasPx = canvas.width / PDF_CAPTURE_PX; // CSS px (at capture width) -> canvas px
      const pageContentHeightPx = pageContentHeightMm * pxPerMm;
      const safeBreaksCanvasPx = safeBreaksPx.map(function(px){ return px * domToCanvasPx; });
      let sourceY = 0;
      while(sourceY < canvas.height - 0.5){
        let breakY = Math.min(canvas.height, sourceY + pageContentHeightPx);
        if(breakY < canvas.height - 0.5){
          let best = null;
          for(let k=0;k<safeBreaksCanvasPx.length;k++){
            const b = safeBreaksCanvasPx[k];
            if(b <= breakY && b > sourceY + 1) best = b;
            if(b > breakY) break;
          }
          if(best!==null) breakY = best;
        }
        const sourceH = Math.max(1, Math.round(breakY - sourceY));
        const wholePage = (sourceY===0 && sourceH >= canvas.height - 0.5);
        let sliceCanvas = canvas;
        if(!wholePage){
          sliceCanvas = document.createElement("canvas");
          sliceCanvas.width = canvas.width;
          sliceCanvas.height = sourceH;
          const ctx = sliceCanvas.getContext("2d");
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0,0,sliceCanvas.width,sliceCanvas.height);
          ctx.drawImage(canvas, 0, sourceY, canvas.width, sourceH, 0, 0, canvas.width, sourceH);
        }
        const sliceImgHeightMm = sourceH / pxPerMm;
        if(pdfPageCount>0) pdf.addPage("a4","portrait");
        pdfPageCount++;
        const imgData = sliceCanvas.toDataURL("image/jpeg", 0.98);
        pdf.addImage(imgData, "JPEG", marginXmm, marginTopMm, pageWidthMm, sliceImgHeightMm);
        sourceY += sourceH;
      }
    });
  });
  // Hand the finished PDF to savePdfBlob (below) instead of calling
  // pdf.save() directly, so the browser's save-location dialog (where
  // supported) can offer a folder to choose rather than silently landing
  // in the default Downloads folder.
  return chain.then(function(){ return savePdfBlob(pdf.output("blob"), filename); });
}

/* Lets the user pick where the exported PDF is saved via the File System
   Access API's native save dialog (folder + filename), instead of it
   silently landing in the browser's default downloads folder — supported on
   Chromium-based desktop and Android browsers. Everywhere else (Safari,
   Firefox, older Chrome) window.showSaveFilePicker doesn't exist, so this
   transparently falls back to the normal browser download. */
async function savePdfBlob(blob, filename){
  if(typeof window.showSaveFilePicker === "function"){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description:"PDF document", accept:{ "application/pdf":[".pdf"] } }]
      });
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      return;
    }catch(err){
      // AbortError == the user cancelled the picker on purpose — respect
      // that instead of silently falling back to a default-folder download.
      if(err && err.name==="AbortError") throw err;
      // Any other failure (e.g. the API exists but is blocked in this
      // context) — fall through to the normal download below.
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

/* Renders the print document straight to a downloaded PDF file — no OS
   print dialog involved. Each .doc-page / .m-page becomes its own PDF
   page (see renderHolderPagesToPdf above). */
function exportQuotePDF(q){
  if(!pdfLibsReady()){
    setPrintMsg("warn","PDF export library didn't load — check your internet connection and try again, or use Ctrl/Cmd+P instead.");
    return;
  }
  const source = document.querySelector(".print-page");
  if(!source){ setPrintMsg("warn","Nothing to export yet."); return; }
  setPrintMsg("info","Generating PDF…");
  /* Wrapper clips the (visually offscreen, but now normal-flow via
     position:absolute) holder so it can never appear on screen or add
     page scroll while html2canvas is capturing it. */
  const clip = document.createElement("div");
  /* absolute, not fixed — same reason as the holder itself: html2canvas's
     clone step is unreliable with position:fixed anywhere in the captured
     element's ancestor chain, not just on the element itself. */
  clip.style.position = "absolute";
  clip.style.left = "0";
  clip.style.top = "0";
  clip.style.width = "1px";
  clip.style.height = "1px";
  clip.style.overflow = "hidden";
  clip.style.opacity = "0.01"; // effectively invisible, but never display:none/visibility:hidden — those make some browsers skip painting content entirely, which is another common cause of a blank html2canvas capture
  clip.style.pointerEvents = "none";
  clip.style.zIndex = "-1";
  document.body.appendChild(clip);
  const holder = buildPdfExportHolder(source);
  clip.appendChild(holder);
  const filename = safeFileName(q.quoteNo)+".pdf";
  function cleanup(){
    if(clip.parentNode) document.body.removeChild(clip);
  }
  /* Give the freshly-inserted holder a couple of paint frames to finish
     laying out (fonts, the injected <style> block, images) before handing
     it to html2canvas — capturing on the same tick it's inserted is a
     common cause of an empty/partial capture. */
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      renderHolderPagesToPdf(holder, filename).then(function(){
        cleanup();
        setPrintMsg("ok","Saved "+filename+" — check your browser's downloads (or the folder you chose).");
      }).catch(function(err){
        cleanup();
        if(err && err.name==="AbortError"){ setPrintMsg("info","Export cancelled."); return; }
        setPrintMsg("warn","Couldn't generate the PDF ("+((err&&err.message)||"unknown error")+") — try Ctrl/Cmd+P instead, or Download quote (HTML) below.");
      });
    });
  });
}

/* Standalone, fully self-contained copy of the printed quote — same markup
   and styles as the on-screen print view, wrapped as its own document so it
   can be opened in an ordinary (unsandboxed) browser tab and printed / saved
   as PDF from there, which is the reliable path when this view's own
   print dialog is blocked. */
function buildStandaloneQuoteHTML(q){
  const t = quoteTotals(q);

  return "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n"+

/* Real website, no sandbox — a plain Blob + anchor click is all downloads
   need here (the old claudeDownloads capability dance was only for the
   Artifact's sandboxed context). */
async function offerDownload(filename, data){
  try{
    const mime = /\.html$/.test(filename) ? "text/html" : "text/plain";
    const blob = new Blob([data], { type: mime+";charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    setPrintMsg("ok","Saved "+filename+" — check your browser's downloads.");
  }catch(err){
    setPrintMsg("warn","Couldn't save "+filename+" — try again, or use the Ctrl/Cmd+P tip above.");
  }
}

function renderLoginScreen(errorMsg, busy){
  return "<div class=\"login-wrap\"><div class=\"login-card\">"+
    "<div class=\"login-brand\">"+brandMarkSVG()+"<span class=\"brand-name\">P - DASH</span></div>"+
    "<p class=\"login-hint\">Sign in with the account your director set up for you.</p>"+
    (errorMsg ? "<div class=\"status-banner warn\">"+esc(errorMsg)+"</div>" : "")+
    "<form id=\"login-form\">"+
      "<div class=\"field\"><label for=\"li-email\">Email</label><input id=\"li-email\" type=\"email\" autocomplete=\"username\" required></div>"+
      "<div class=\"field\"><label for=\"li-password\">Password</label><input id=\"li-password\" type=\"password\" autocomplete=\"current-password\" required></div>"+
      "<button class=\"btn btn-primary\" type=\"submit\" style=\"width:100%\""+(busy?" disabled":"")+">"+(busy?"Signing in…":"Sign in")+"</button>"+
    "</form>"+
    "<div class=\"login-foot\"><a href=\"#\" id=\"forgot-link\">Forgot your password?</a></div>"+
  "</div></div>";
}

function showLogin(errorMsg, busy){
  document.body.classList.remove("read-only");
  byId("app").innerHTML = renderLoginScreen(errorMsg, busy);
  const form = byId("login-form");
  if(form){
    form.addEventListener("submit", async function(e){
      e.preventDefault();
      const email = byId("li-email").value.trim();
      const password = byId("li-password").value;
      showLogin(null, true);
      const {error} = await sb.auth.signInWithPassword({ email:email, password:password });
      if(error){ showLogin(error.message || "Sign-in failed.", false); }
      // on success, onAuthStateChange below fires and calls enterApp()
    });
  }
  const forgot = byId("forgot-link");
  if(forgot){
    forgot.addEventListener("click", async function(e){
      e.preventDefault();
      const email = byId("li-email").value.trim();
      if(!email){ showLogin("Enter your email above first, then click \"Forgot your password?\" again.", false); return; }
      const {error} = await sb.auth.resetPasswordForEmail(email);
      showLogin(error ? (error.message||"Couldn't send reset email.") : "Password reset email sent — check your inbox.", false);
    });
  }
}

function showBlockedScreen(message){
  document.body.classList.remove("read-only");
  byId("app").innerHTML = "<div class=\"login-wrap\"><div class=\"login-card\">"+
    "<div class=\"login-brand\">"+brandMarkSVG()+"<span class=\"brand-name\">P - DASH</span></div>"+
    "<p class=\"login-hint\">"+esc(message)+"</p>"+
    "<button class=\"btn\" id=\"logout-blocked\">Log out</button>"+
  "</div></div>";
  const btn = byId("logout-blocked");
  if(btn) btn.addEventListener("click", function(){ sb.auth.signOut(); });
}

async function enterApp(){
  const {data} = await sb.auth.getUser();
  const user = data && data.user;
  if(!user){ showLogin(); return; }
  const {data:profile, error} = await sb.from("profiles").select("*").eq("id", user.id).single();
  if(error || !profile){
    showBlockedScreen("Your account isn't set up yet. Ask your director to add you, then sign in again.");
    return;
  }
  if(!profile.is_active){
    showBlockedScreen("Your account has been deactivated. Contact your director.");
    return;
  }
  myProfile = profile;
  // A plain employee with no department assigned has no reason to be in the
  // app at all — but once a director gives them a department, they get in to
  // use the Departments module even though the quote tool stays off-limits.
  if(profile.role==="employee" && !profile.department){
    showBlockedScreen("Nothing's been set up for your account yet. Contact your director if you think this is wrong.");
    return;
  }
  canEdit = (profile.role==="director" || profile.department==="sales");
  // Departments is the app's home screen for everyone now — Sales' and
  // Service's own tools are launched from inside their department tile.
  view.tab = "departments";
  byId("app").innerHTML = "<div class=\"login-wrap\"><div class=\"login-card\"><p class=\"login-hint\">Loading your data…</p></div></div>";
  try{
    await loadAllData();
  }catch(err){
    byId("app").innerHTML = "<div class=\"login-wrap\"><div class=\"login-card\"><p class=\"login-hint\">Couldn't load data: "+esc((err&&err.message)||"unknown error")+"</p><button class=\"btn\" id=\"retry-load\">Retry</button></div></div>";
    const retry = byId("retry-load");
    if(retry) retry.addEventListener("click", enterApp);
    return;
  }
  const restoredDraft = loadStoredDraft(profile.id);
  if(restoredDraft){
    const cfg = DRAFT_EDITOR_TABS[restoredDraft.tab];
    if(cfg){
      view[cfg.field] = restoredDraft.draft;
      view.tab = restoredDraft.tab;
      view.editorReturnTab = restoredDraft.editorReturnTab || "departments";
      view.draftRestoreNotice = { kind:cfg.kind };
    }
  }
  renderApp();
}

function boot(){
  const styleEl = document.createElement("style");
  styleEl.textContent = APP_CSS;
  document.head.appendChild(styleEl);
  const linkEl = document.createElement("link");
  linkEl.rel = "stylesheet"; linkEl.href = FONTS_HREF;
  document.head.appendChild(linkEl);

  sb.auth.onAuthStateChange(function(event, newSession){
    session = newSession;
    if(event==="SIGNED_OUT" || !newSession){
      myProfile = null; canEdit = false; state = emptyState();
      showLogin();
      return;
    }
    if(event==="TOKEN_REFRESHED" && myProfile){ return; } // already in the app, nothing to reload
    enterApp();
  });

  // Flush any pending autosave the instant the app is minimised/backgrounded/
  // tab-switched, rather than waiting on the normal debounce — this is the
  // moment mobile browsers are most likely to later reclaim the page's
  // memory and reload it fresh, so whatever was just typed needs to already
  // be in localStorage by the time that happens.
  document.addEventListener("visibilitychange", function(){
    if(document.hidden) persistDraftNow();
  });
}

if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}

})();
