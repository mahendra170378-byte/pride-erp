const FONTS_HREF = "https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap";

const APP_CSS = [
":root{",
"--bg:#F3F5F7;--surface:#FFFFFF;--surface-2:#E9ECF0;--surface-3:#DBE1E8;--border:#D3D9E0;",
"--text:#1B2027;--text-muted:#5B6472;--text-faint:#8993A3;",
"--accent:#143A5C;--accent-strong:#0C273F;--accent-soft:#DEE6ED;--on-accent:#F6F9FC;",
"--warn:#C1671E;--warn-soft:#F7E5D0;--danger:#A8460F;--danger-soft:#F3DBC4;--good:#1D6FA5;--good-soft:#DCEAF3;",
"--shadow:0 1px 2px rgba(18,26,36,.07),0 6px 18px rgba(18,26,36,.06);--radius:10px;",
"--paper-bg:#FFFFFF;--paper-surface-2:#E9ECF0;--paper-border:#D3D9E0;--paper-text:#1B2027;--paper-muted:#5B6472;",
"--paper-accent:#143A5C;--paper-accent-strong:#0C273F;--paper-accent-soft:#DEE6ED;",
"}",
"@media (prefers-color-scheme: dark){:root:not([data-theme='light']){",
"--bg:#12161C;--surface:#1A2128;--surface-2:#222A33;--surface-3:#2B3540;--border:#37424E;",
"--text:#E7ECF2;--text-muted:#9CA8B5;--text-faint:#707C8C;",
"--accent:#5B9BD5;--accent-strong:#8FC1EA;--accent-soft:#1B2C3E;--on-accent:#07131F;",
"--warn:#E29A4E;--warn-soft:#3E2C15;--danger:#D97D3E;--danger-soft:#3A2312;--good:#5CA8D9;--good-soft:#15293A;",
"--shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.4);",
"}}",
":root[data-theme='dark']{",
"--bg:#12161C;--surface:#1A2128;--surface-2:#222A33;--surface-3:#2B3540;--border:#37424E;",
"--text:#E7ECF2;--text-muted:#9CA8B5;--text-faint:#707C8C;",
"--accent:#5B9BD5;--accent-strong:#8FC1EA;--accent-soft:#1B2C3E;--on-accent:#07131F;",
"--warn:#E29A4E;--warn-soft:#3E2C15;--danger:#D97D3E;--danger-soft:#3A2312;--good:#5CA8D9;--good-soft:#15293A;",
"--shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.4);",
"}",
"*,*::before,*::after{box-sizing:border-box}",
"html,body{margin:0;padding:0}",
"body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}",
"h1,h2,h3{font-family:'Barlow Semi Condensed',system-ui,sans-serif;font-weight:700;margin:0;text-wrap:balance}",
"button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}",
"table{border-collapse:collapse;width:100%}",
".tabular{font-variant-numeric:tabular-nums;font-family:'IBM Plex Mono',ui-monospace,monospace}",
"a{color:var(--accent)}",
".sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}",

/* topbar */
".topbar{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}",
".topbar-inner{max-width:1180px;margin:0 auto;padding:14px 24px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}",
".brand{display:flex;align-items:center;gap:10px;margin-right:auto}",
".brand-mark{flex:none}",
".brand-name{font-family:'Barlow Semi Condensed';font-weight:700;font-size:19px;letter-spacing:.2px}",
".brand-sub{display:block;font-family:'IBM Plex Mono';font-size:10.5px;color:var(--text-faint);letter-spacing:.08em;text-transform:uppercase;margin-top:1px}",
".nav{display:flex;gap:2px;margin-left:24px}",
".nav-tab{appearance:none;border:none;background:none;padding:10px 14px 12px;font-family:'Barlow Semi Condensed';font-weight:600;font-size:14.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);cursor:pointer;border-bottom:2.5px solid transparent}",
".nav-tab:hover{color:var(--text)}",
".nav-tab.active{color:var(--accent-strong);border-bottom-color:var(--accent)}",

/* layout */
".main{max-width:1180px;margin:0 auto;padding:28px 24px 80px}",
".panel-header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}",
".panel-title{font-size:26px}",
".panel-hint{color:var(--text-muted);font-size:13.5px;margin-top:4px}",
".toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}",
".card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}",
".card-pad{padding:20px 22px}",
".section-gap{margin-top:28px}",
".grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}",
".grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px 18px}",
"@media (max-width:780px){.grid-2,.grid-3{grid-template-columns:1fr}}",

/* buttons */
".btn{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:8px 14px;font-weight:500;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1.3}",
".btn:hover{border-color:var(--text-faint)}",
".btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}",
".btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}",
".btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}",
".btn-ghost{background:transparent;border-color:transparent;color:var(--text-muted)}",
".btn-ghost:hover{color:var(--text);background:var(--surface-2)}",
".btn-danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}",
".btn-danger:hover{border-color:var(--danger)}",
".btn-sm{padding:5px 10px;font-size:12.5px;border-radius:6px}",
".btn[disabled]{opacity:.5;cursor:not-allowed}",
".icon-btn{padding:5px 8px;line-height:1}",

/* fields */
".field{display:flex;flex-direction:column;gap:5px}",
".field.wide{grid-column:1/-1}",
".field label{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)}",
".field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:8px 10px;color:var(--text)}",
".field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}",
".field textarea{resize:vertical;min-height:64px;font-family:inherit}",
".hl-c-display{font-size:11.5px;color:var(--text-faint);font-family:'IBM Plex Mono';margin-top:4px}",
".hint{font-size:12px;color:var(--text-faint)}",
".callout{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--radius);padding:14px 16px;font-size:13.5px;line-height:1.6;color:var(--text)}",
".kbd{display:inline-block;padding:1px 7px;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;background:var(--surface);font-family:'IBM Plex Mono';font-size:12px}",
".status-banner{padding:11px 15px;border-radius:8px;font-size:13.5px;font-weight:500}",
".status-banner.ok{background:var(--good-soft);color:var(--good)}",
".status-banner.warn{background:var(--warn-soft);color:var(--warn)}",
".status-banner.info{background:var(--surface-2);color:var(--text-muted)}",

/* badges & pills */
".badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}",
".badge-draft{background:var(--warn-soft);color:var(--warn)}",
".badge-final{background:var(--good-soft);color:var(--good)}",
".badge-rejected{background:var(--danger-soft);color:var(--danger)}",
".badge-dot{width:6px;height:6px;border-radius:99px;background:currentColor}",

/* tables (app UI) */
".table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}",
"table.list-table{min-width:640px}",
"table.list-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--border);background:var(--surface-2)}",
"table.list-table td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}",
"table.list-table tr:last-child td{border-bottom:none}",

/* item tables in editor */
// The item/description column is the only one of these tables' columns with
// no explicit width of its own (every other column — HSN, Unit, Qty, Rate,
// Discount %, Amount — is pinned to a fixed px width in itemRowHTML etc.).
// Those fixed columns alone already add up to more than the table's old
// 640px min-width (Part A with its Discount % column: 104+80+90+120+90+130+
// 36 = 650px), so at that minimum the browser had nothing left to give the
// description column and squeezed it down to a sliver — "Ref", "Cor", "12"
// instead of the actual item names, even though HSN/Unit/Qty all rendered
// at their full intended width right next to it. Giving the description
// column its own floor (matched by raising the table's own min-width so
// that floor is never squeezed back out) fixes this on every item-table —
// BOQ items, PO/invoice/GRN/vendor items, distribution rows — not just the
// one in the screenshot.
"table.item-table{min-width:820px}",
"table.item-table td:first-child{min-width:170px}",
"table.item-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border)}",
"table.item-table td{padding:6px 10px;border-bottom:1px solid var(--border)}",
"table.item-table td.num,table.item-table th.num{text-align:right}",
"table.item-table input{width:100%;background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 7px}",
"table.item-table input:hover{border-color:var(--border)}",
"table.item-table input:focus{background:var(--surface);border-color:var(--accent);outline:none}",
"table.item-table input.num-in{text-align:right}",
".amount-cell{text-align:right;font-weight:500;white-space:nowrap}",
".totals-block{margin-top:2px;padding:12px 14px;border-top:1px solid var(--border);background:var(--surface-2);border-radius:0 0 9px 9px}",
".totals-line{display:flex;justify-content:space-between;padding:3px 0;font-size:13.5px}",
".totals-line.muted{color:var(--text-muted)}",
".totals-line.grand{font-weight:700;font-size:16px;padding-top:8px;margin-top:5px;border-top:1px solid var(--border);color:var(--accent-strong)}",

/* summary stats */

/* confirm inline */

/* category divider row */
"tr.cat-row td{background:var(--surface-2);font-family:'Barlow Semi Condensed';font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:12px;color:var(--text-muted);padding:8px 14px}",

/* editor layout */
".editor-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}",

".add-row-toolbar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--border);background:var(--surface)}",

".catalog-picker{position:relative;flex:1;max-width:360px}",

/* Mobile entry: on a narrow screen .add-row-toolbar (search-to-add-item +
   its button, reused for quote/AMC/invoice/purchase/GRN item tables and the
   city-conditions table) squeezed the catalog search box down to almost
   nothing trying to fit beside its button on one row — this was the "items
   to be selected" box the user meant. Letting it wrap puts the search box
   on its own full-width row, and 16px input font stops iOS Safari's
   auto-zoom-on-focus (which itself makes a field feel tiny/awkward to type
   into). table.item-table keeps its own horizontal scroll (same pattern
   already used for [data-fsr-form]'s mobile fix) rather than trying to
   reflow a data-entry table into single-column cards, but each cell gets
   bigger touch targets so scrolling to a field and typing in it is easier. */
"@media (max-width:700px){",
".add-row-toolbar{flex-wrap:wrap}",
".add-row-toolbar .catalog-picker,.add-row-toolbar select{flex:1 1 100%;max-width:none}",
".catalog-search{font-size:16px;padding:9px 10px}",
".catalog-dropdown-item{padding:10px 12px;font-size:14px}",
"table.item-table th,table.item-table td{padding:7px 8px;font-size:12.5px}",

"}",

".doc-address-text{font-size:13px;color:var(--paper-text);margin-top:2px}",
".annexure-list{margin:16px 0;padding-left:0;list-style:none}",

/* Same layout used for @media print, applied via a toggled class so the
   "Export as PDF" button (html2pdf.js) can capture a clean A4-letterhead
   render on-screen, without needing the browser's print dialog. */
/* Pixel widths, not mm: html2canvas clones the document into an offscreen
   frame to rasterize it, and that clone's layout can reflow relative to the
   browser window's own width unless every size here is a plain px value
   AND html2canvas is told the exact capture width to use (see PDF_CAPTURE_PX
   below) — that combination is what actually keeps content from spilling
   past the right edge in the exported PDF. 718px == 190mm, 1021px == 270mm,
   98px == 26mm, all at 96 CSS px/inch. */
".pdf-export-mode{background:#fff;max-width:none;width:718px;margin:0}",
".pdf-export-mode .no-print{display:none!important}",
".pdf-export-mode .doc-page{box-shadow:none;border:none;border-radius:0;max-width:none;width:718px;padding:0;margin-bottom:0;min-height:1021px;position:relative;padding-bottom:98px}",
".pdf-export-mode .doc-page>*:last-child{position:absolute;left:0;right:0;bottom:0}",
".pdf-export-mode .m-page{box-shadow:none;border:none;border-radius:0;max-width:none;width:718px;min-height:1021px;position:relative;padding-bottom:98px;margin-bottom:0}",
".pdf-export-mode .m-page>*:last-child{position:absolute;left:0;right:0;bottom:0}",

/* ============================== local draft autosave ==============================
   Protects in-progress Quote / Customer / Service Customer edits from being
   lost if the browser reloads the page while the app is minimised or
   backgrounded — common on mobile, where the OS reclaims a background tab's
   memory and silently reloads the URL when you switch back. Since our
   Supabase session itself persists across that reload, enterApp() runs again
   and used to always land on Departments with everything you'd typed gone.
   This keeps exactly one autosaved draft per signed-in user in localStorage
   (best-effort only — never a substitute for actually clicking Save), and
   restores it the next time that user's session comes back to life. */
const DRAFT_EDITOR_TABS = {
  "editor": { field:"draft", kind:"quote" },
  "customer-editor": { field:"customerDraft", kind:"customer" },
  "service-customer-editor": { field:"serviceCustomerDraft", kind:"serviceCustomer" }
};
function draftStorageKey(){ return myProfile ? ("pdash_draft_v1_"+myProfile.id) : null; }
let draftPersistTimer = null;
function scheduleDraftPersist(){
  if(draftPersistTimer) clearTimeout(draftPersistTimer);
  draftPersistTimer = setTimeout(persistDraftNow, 500);
}
function persistDraftNow(){
  if(draftPersistTimer){ clearTimeout(draftPersistTimer); draftPersistTimer = null; }
  const key = draftStorageKey();
  if(!key) return;
  try{
    const cfg = DRAFT_EDITOR_TABS[view.tab];
    const draft = cfg ? view[cfg.field] : null;
    if(cfg && draft){
      localStorage.setItem(key, JSON.stringify({ kind:cfg.kind, tab:view.tab, editorReturnTab:view.editorReturnTab||null, draft:draft, savedAt:Date.now() }));
    } else {
      localStorage.removeItem(key);
      view.draftRestoreNotice = null;
    }
  }catch(e){ /* best-effort — private browsing, storage disabled, quota, etc. */ }
}
function loadStoredDraft(userId){
  try{
    const raw = localStorage.getItem("pdash_draft_v1_"+userId);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || !parsed.draft || !DRAFT_EDITOR_TABS[parsed.tab]){ localStorage.removeItem("pdash_draft_v1_"+userId); return null; }
    if(!parsed.savedAt || (Date.now()-parsed.savedAt) > 7*24*60*60*1000){ localStorage.removeItem("pdash_draft_v1_"+userId); return null; } // stale — older than a week
    return parsed;
  }catch(e){ return null; }
}

}

/* ============================== computations ============================== */

function itemEffectiveRate(item){ const d = Math.min(100, Math.max(0, num(item.discount))); return num(item.rate) * (1 - d/100); }
function itemAmount(item){ return num(item.qty) * itemEffectiveRate(item); }
function partSubtotal(items){ return (items||[]).reduce((s,i)=> s + itemAmount(i), 0); }
// The AC Distribution sheet tracks two capacities per area: "Heat load
// Capacity" (r.capacity — what the calculation says is needed) and
// "Selected Capacity" (r.selectedCapacity — the nearest standard unit size
// actually being quoted/installed, which is what Total TR is built from).
// Older saved quotes only ever had r.capacity, so this falls back to it
// whenever r.selectedCapacity hasn't been set — existing quotes keep
// showing the same Total TR they always did instead of dropping to 0.
function distRowSelectedCapacity(r){
  return (r.selectedCapacity!==undefined && r.selectedCapacity!==null && r.selectedCapacity!=="") ? num(r.selectedCapacity) : num(r.capacity);
}
function distributionTotalTR(rows){ return (rows||[]).reduce((s,r)=> s + distRowSelectedCapacity(r)*num(r.qty), 0); }
function distributionTotalQty(rows){ return (rows||[]).reduce((s,r)=> s + num(r.qty), 0); }
function amcSubtotal(items){ return (items||[]).reduce((s,i)=> s + num(i.qty)*num(i.rate), 0); }
function amcTotalMachines(items){ return (items||[]).reduce((s,i)=> s + num(i.qty), 0); }
function quoteTotals(q){
  const gst = num(q.gstPercent);
  if(q.quoteType==="service"){
    const sub = amcSubtotal(q.serviceKind==="repair" ? q.repairItems : q.amcItems);
    const gstAmt = sub*gst/100, total = sub+gstAmt;
    return { aSub:sub, bSub:0, aGst:gstAmt, bGst:0, aTotal:total, bTotal:0, grandExcl:sub, grandIncl:total };
  }
  const aSub = partSubtotal(q.partA), bSub = partSubtotal(q.partB);
  const aGst = aSub*gst/100, bGst = bSub*gst/100;
  const aTotal = aSub+aGst, bTotal = bSub+bGst;
  return { aSub, bSub, aGst, bGst, aTotal, bTotal, grandExcl: aSub+bSub, grandIncl: aTotal+bTotal };
}

/* ============================== persistence (Supabase) ==============================
   Every save writes straight to Supabase (RLS-enforced per the signed-in
   user's role) and then reloads just the affected slice of `state` from the
   server response, so the in-memory model always reflects what the DB
   actually has (including server-assigned ids and quote numbers) rather
   than trusting the client's optimistic guess. No page reload is needed —
   unlike the old Artifact-publish flow, a Supabase write doesn't blow away
   the current view, so callers just get a plain nextView patch back. */

let saving = false;

async function runSave(task, nextView){
  saving = true; view.saveError = null; updatePersistIndicator(); renderApp();
  try{
    const patch = await task();
    saving = false;
    Object.assign(view, nextView, patch || {});
    renderApp();
    return { ok:true };
  }catch(err){
    saving = false;
    view.saveError = "Couldn't save (" + ((err && err.message) || "please try again") + ").";
    renderApp();
    return { ok:false, error:err };
  }
}

function isClientId(id){ return typeof id === "string" && id.indexOf("_") >= 0; }

async function reloadCustomers(){
  const [{data:custs,error:cErr}, {data:sites,error:sErr}] = await Promise.all([
    sb.from("customers").select("*").order("name"),
    sb.from("customer_sites").select("*")
  ]);
  if(cErr) throw cErr;
  if(sErr) throw sErr;
  state.customers = (custs||[]).map(function(c){
    return {
      id:c.id, name:c.name, phone:c.phone||"", email:c.email||"", gstin:c.gstin||"", pincode:c.pincode||"",
      billingAddressLines:c.address||"",
      sites:(sites||[]).filter(function(s){ return s.customer_id===c.id; }).map(function(s){
        return { id:s.id, label:s.label||"", addressLines:s.address||"", pincode:s.pincode||"" };
      }),
      createdAt:c.created_at, updatedAt:c.updated_at
    };
  });

async function saveCustomer(cd, nextView){
  return runSave(async function(){
    const row = { name:cd.name.trim(), phone:cd.phone||null, email:cd.email||null, gstin:cd.gstin||null, pincode:cd.pincode||null, address:cd.billingAddressLines||null };
    let customerId = cd.id;
    if(isClientId(cd.id)){
      const {data,error} = await sb.from("customers").insert(Object.assign({}, row, { created_by:session.user.id })).select().single();
      if(error) throw error;
      customerId = data.id;
    } else {
      const {error} = await sb.from("customers").update(row).eq("id", cd.id);
      if(error) throw error;
    }
    const {data:existingSites, error:sErr} = await sb.from("customer_sites").select("*").eq("customer_id", customerId);
    if(sErr) throw sErr;
    const existingIds = new Set((existingSites||[]).map(function(s){ return s.id; }));
    const keepIds = new Set();
    for(const s of (cd.sites||[])){
      const siteRow = { label:s.label||"", address:s.addressLines||null, pincode:s.pincode||null };
      if(existingIds.has(s.id)){
        keepIds.add(s.id);
        const {error} = await sb.from("customer_sites").update(siteRow).eq("id", s.id);
        if(error) throw error;
      } else {
        const {error} = await sb.from("customer_sites").insert(Object.assign({ customer_id:customerId }, siteRow));
        if(error) throw error;
      }
    }
    for(const old of (existingSites||[])){
      if(!keepIds.has(old.id)) await sb.from("customer_sites").delete().eq("id", old.id);
    }
    await reloadCustomers();
    return {};
  }, nextView);
}
async function deleteCustomer(id, nextView){
  return runSave(async function(){
    const {error} = await sb.from("customers").delete().eq("id", id);
    if(error) throw error;
    await reloadCustomers();
    state.quotes.forEach(function(q){ if(q.customerId===id && q.quoteType!=="service"){ q.customerId=null; q.siteId=null; } });
    return {};
  }, nextView);
}

function rowToQuote(row){
  const isService = row.data && row.data.quoteType==="service";
  return Object.assign({}, row.data||{}, {
    id:row.id, quoteNo:row.quote_no, status:row.status,
    customerId: isService ? row.service_customer_id : row.customer_id,
    siteId: isService ? row.service_site_id : row.site_id,
    createdBy:row.created_by,
    createdAt:row.created_at, updatedAt:row.updated_at
  });
}
async function reloadQuotes(){
  const {data,error} = await sb.from("quotes").select("*").order("updated_at",{ascending:false});
  if(error) throw error;
  state.quotes = (data||[]).map(rowToQuote);

async function saveQuote(q, nextView, alsoPrint, forcedQuoteNo){
  return runSave(async function(){
    let savedRow;
    if(isClientId(q.id)){
      const isService = q.quoteType==="service";
      // A revision (see revisionedQuoteNo) already knows its own quote_no —
      // the root offer's number plus a #-0N suffix — so it skips the normal
      // sequence RPC entirely rather than being assigned the next fresh
      // number in line.
      let quoteNo = forcedQuoteNo;
      if(!quoteNo){
        const {data:seqData, error:seqErr} = await sb.rpc(isService ? "next_service_quote_seq" : "next_quote_seq");
        if(seqErr) throw seqErr;
        quoteNo = isService ? "PAS/Service/"+String(seqData).padStart(3,"0") : "PAS-"+String(seqData).padStart(4,"0");
      }
      const toStore = Object.assign({}, q, { quoteNo:quoteNo });
      const {data,error} = await sb.from("quotes").insert({
        quote_no:quoteNo,
        customer_id: isService ? null : (q.customerId||null),
        site_id: isService ? null : (q.siteId||null),
        service_customer_id: isService ? (q.customerId||null) : null,
        service_site_id: isService ? (q.siteId||null) : null,
        status:q.status||"draft", data:toStore, created_by:session.user.id
      }).select().single();
      if(error) throw error;
      savedRow = data;
    } else {
      const isServiceUpd = q.quoteType==="service";
      const {data,error} = await sb.from("quotes").update({
        quote_no:q.quoteNo,
        customer_id: isServiceUpd ? null : (q.customerId||null),
        site_id: isServiceUpd ? null : (q.siteId||null),
        service_customer_id: isServiceUpd ? (q.customerId||null) : null,
        service_site_id: isServiceUpd ? (q.siteId||null) : null,
        status:q.status||"draft", data:q
      }).eq("id", q.id).select().single();
      if(error) throw error;
      savedRow = data;
    }
    await reloadQuotes();
    const saved = rowToQuote(savedRow);
    // Note: finalizing alone does NOT notify Management or join the
    // Approval for Execution queue — Sales still has to upload the PO copy
    // first (see quotePoUploadHTML/uploadQuotePO below), which is what
    // actually notifies Management and unlocks that queue entry.
    return alsoPrint ? { printQuoteId:saved.id, draft:saved } : {};
  }, nextView);
}
async function deleteQuote(id, nextView){
  return runSave(async function(){
    const {error} = await sb.from("quotes").delete().eq("id", id);
    if(error){
      // 23503 = foreign key violation — the database itself refuses to
      // delete a quote that an AMC contract (and its service-visit history)
      // is still linked to, rather than silently orphaning or cascading
      // that away. Surface that as a plain sentence instead of the raw
      // Postgres constraint error.
      if(error.code==="23503") throw new Error("This quote can't be deleted — it's linked to an AMC contract and its service visit history. Remove the contract first if you really need to delete it.");
      throw error;
    }
    await reloadQuotes();
    return {};
  }, nextView);
}

// Sales' order-proof upload, gating Management's Approval for Execution
// queue (see quotesAwaitingExecutionApproval) — reuses the existing
// Documents feature rather than touching the quotes table at all, so it's
// entirely outside the finalize-lock. Two doc types satisfy the gate:
// "po" (a real Purchase Order copy) or "oaf" (a signed Order Acceptance
// Form — the alternative for individual/other customers who can't issue a
// PO; see oafPrintHTML/generateOafTemplate for the printable template Sales
// gets signed before scanning it back in here). A third type, "drawing",
// is an optional attachment (a customer's AutoCAD/CAD drawing that came
// along with the PO) — it never gates approval on its own, but once
// Management approves the offer for execution it becomes visible to
// Planning for detailed working (see the "planning can view drawings after
// execution approval" RLS policy on documents, and quoteDrawingDocument).
// Any file format is accepted for all three (PDF, JPG, PNG, DWG, DXF, or
// anything else) — neither the file picker nor the storage bucket restrict
// by type. Pre-approved on creation (an attachment doesn't need its own
// accept/reject step); re-uploading updates the same document's file
// rather than creating a duplicate.
const ORDER_DOC_META = {
  po: { fn: function(){ return quotePoDocument; }, label:"PO copy", gates:true },
  oaf: { fn: function(){ return quoteOafDocument; }, label:"Order Acceptance Form", gates:true },
  drawing: { fn: function(){ return quoteDrawingDocument; }, label:"Drawing", gates:false }
};
async function uploadQuoteOrderDoc(quoteId, docType, file, nextView){
  const meta = ORDER_DOC_META[docType] || ORDER_DOC_META.po;
  const existingFn = meta.fn();
  const label = meta.label;
  return runSave(async function(){
    const existing = existingFn(quoteId);
    const q = state.quotes.find(function(x){ return x.id===quoteId; });
    // Sales' AC Project quotes file under "sales"; Service's AMC/Repair
    // offers file under "service" instead — both the documents row's own
    // department column (its RLS INSERT check is get_my_department() =
    // department) and the storage path's first folder segment (its RLS
    // INSERT check is (storage.foldername(name))[1] = get_my_department())
    // have to agree, or a Service user's own upload would be rejected.
    const dept = (q && q.quoteType==="service") ? "service" : "sales";
    let docId = existing ? existing.id : null;
    if(!docId){
      const {data,error} = await sb.from("documents").insert({
        doc_type:docType, department:dept, title:label+" — "+(q?q.quoteNo:""), status:"approved",
        linked_quote_id: quoteId, created_by: session.user.id
      }).select("id").single();
      if(error) throw error;
      docId = data.id;
    }
    const path = dept+"/"+docType+"/"+docId+"-"+Date.now()+"-"+safeFileName(file.name||docType);
    const {error:upErr} = await sb.storage.from("department-docs").upload(path, file, { contentType:file.type||"application/octet-stream", upsert:false });
    if(upErr) throw upErr;
    const {error:updErr} = await sb.from("documents").update({ file_path:path, file_name:file.name||label }).eq("id", docId);
    if(updErr) throw updErr;
    await reloadDocuments();
    // Only fire the "ready for approval" notification the first time EITHER
    // gating proof document shows up on this quote — not on every
    // subsequent re-upload/replace, not twice if both end up uploaded, and
    // not at all for the non-gating drawing attachment.
    if(meta.gates){
      const otherFn = docType==="oaf" ? quotePoDocument : quoteOafDocument;
      if(!existing && !otherFn(quoteId)){
        await createNotification("management", "Quote "+(q?q.quoteNo:"")+" finalized with "+label+" uploaded — approval for execution needed.", "po_uploaded");
      }
    }
    return {};
  }, nextView);
}

/* ---- Part I: Management's "approve for execution" ----
   Reuses saveQuote as-is (it already writes back the full quote object under
   quotes.data jsonb) so executionApproved/By/At need no schema change at
   all — they just ride along inside the same jsonb blob every other quote
   field already lives in.
   Part K addendum: Management must name the project before approving, and a
   unique, automatic Project Code (Project-001, Project-002, …) is minted at
   that moment via the director-only next_project_seq() RPC (mirrors
   next_invoice_seq()'s pattern). Both projectCode/projectName ride along in
   the same quotes.data jsonb write — safe because only the director can
   reach this action, and the director's RLS UPDATE policy has no
   status-based restriction. */
async function approveQuoteExecution(quoteId, projectName, nextView){
  const q = state.quotes.find(function(x){ return x.id===quoteId; });
  if(!q || q.executionApproved) return;
  const name = (projectName||"").trim();
  if(!name){ view.saveError = "Enter a Project Name before approving for execution."; renderApp(); return; }
  let projectCode;
  try{
    const {data:seqData, error:seqErr} = await sb.rpc("next_project_seq");
    if(seqErr) throw seqErr;
    projectCode = "Project-"+String(seqData).padStart(3,"0");
  }catch(e){
    view.saveError = "Couldn't generate a project code (" + ((e && e.message) || "please try again") + ").";
    renderApp();
    return;
  }
  const updated = Object.assign({}, q, {
    executionApproved:true, executionApprovedBy: session.user.id, executionApprovedAt: new Date().toISOString(),
    projectCode: projectCode, projectName: name
  });
  return saveQuote(updated, nextView, false, null).then(function(res){
    createNotification("planning", "Offer "+q.quoteNo+" approved for execution as "+projectCode+" — "+name+" — new order for Design and Planning.", "execution_approved");
    return res;
  });
}
// Management Dashboard's Service-sub-tab approval action — simpler than
// approveQuoteExecution above (no Project Name/Code needed for an AMC/Repair
// offer). Just re-triggers the existing markAmcClientApproved, which is
// what actually opens the AMC contract (auto-generating the 4 PM visits via
// the amc_contracts insert trigger) or, for a repair job, just marks it
// approved into the Order Book.
async function approveServiceOrderExecution(quoteId, nextView){
  const q = state.quotes.find(function(x){ return x.id===quoteId; });
  if(!q || q.clientApproved) return;
  return markAmcClientApproved(q, nextView).then(function(res){
    createNotification("service", (q.serviceKind==="repair"?"Repair":"AMC")+" offer "+q.quoteNo+" approved by management"+
      (q.serviceKind==="repair" ? " — now in the Order Book." : " — AMC contract opened, 4 PM visits scheduled."), "execution_approved");
    return res;
  });
}

// Part K addendum: unread-count for a specific set of notification kinds,

function unreadNotificationCountForKinds(kinds){
  return notificationsForMe().filter(function(n){

  }).length;

// act on) rather than every department's traffic, which they already have
// full cross-department oversight of via the Management Dashboard — a
// department member simply sees their own department's alerts.
function notificationsForMe(){
  return isDeptDirector()
    ? state.notifications.filter(function(n){ return n.department==="management"; })
    : state.notifications.filter(function(n){ return n.department===myDepartment(); });

    requestedItems: [], department: myDepartment()||"project"

// Qty already requested against a given BOQ item name across every OTHER
// Material Request raised for the same BOQ (used to cap this draft's own
// qty at what the BOQ still has left for that item).
function mrQtyCommittedForItem(boqId, itemName, excludeMrId){
  let total = 0;
  materialRequestsForBoq(boqId).forEach(function(m){
    if(m.id===excludeMrId) return;
    (m.requestedItems||[]).forEach(function(it){
      if((it.name||"").trim().toLowerCase()===(itemName||"").trim().toLowerCase()) total += num(it.qty);
    });
  });
  return total;
}
function maxAllowedQtyForBoqItem(boqId, itemName, excludeMrId){
  const b = findExecutionBoq(boqId);
  const boqItem = b ? (b.items||[]).find(function(it){ return (it.name||"").trim().toLowerCase()===(itemName||"").trim().toLowerCase(); }) : null;
  const boqQty = boqItem ? num(boqItem.qty) : 0;
  const committedElsewhere = mrQtyCommittedForItem(boqId, itemName, excludeMrId);
  return Math.max(0, boqQty - committedElsewhere);
}

      billing_address: mr.billingAddress||null, site_address: mr.siteAddress||null,
      requested_items: mr.requestedItems||[], status:"pending_store",
      department: mr.department||"project", created_by: session.user.id
    });
    if(error) throw error;
    await reloadMaterialRequests();

// Saves (inserts, or updates if already saved) the PO as a draft — no PO

// Sends the PO for Director approval — mints the PO number now (only if one
// hasn't already been assigned), whether raising it fresh or submitting a
// previously-saved draft, then flips the Material Request to
// po_pending_approval and notifies the Director, same as before drafts existed.
async function submitPurchaseOrderForApproval(po, nextView){
  return runSave(async function(){
    if(!po.vendorName || !po.vendorName.trim()) throw new Error("Pick or type a vendor before raising the PO.");
    if(!(po.items||[]).some(function(it){ return num(it.qty)>0 && num(it.rate)>0; })) throw new Error("Enter a qty and rate for at least one item.");
    const row = poRowFields(po);
    row.status = "pending_approval";
    row.submitted_at = new Date().toISOString();
    let poNo = null;
    if(isClientId(po.id)){
      const {data:seqData, error:seqErr} = await sb.rpc("next_po_seq");
      if(seqErr) throw seqErr;
      poNo = "PO-"+String(seqData).padStart(3,"0");
      row.po_no = poNo;
      row.department = "purchase"; row.created_by = session.user.id;
      const {error} = await sb.from("purchase_orders").insert(row);
      if(error) throw error;
    } else {
      const existing = findPurchaseOrder(po.id);
      if(existing && existing.poNo){
        poNo = existing.poNo;
      } else {
        const {data:seqData, error:seqErr} = await sb.rpc("next_po_seq");
        if(seqErr) throw seqErr;
        poNo = "PO-"+String(seqData).padStart(3,"0");
        row.po_no = poNo;
      }
      const {error} = await sb.from("purchase_orders").update(row).eq("id", po.id);
      if(error) throw error;
    }
    if(po.materialRequestId){
      const {error:mrErr} = await sb.from("material_requests").update({ status:"po_pending_approval" }).eq("id", po.materialRequestId);
      if(mrErr) throw mrErr;
    }
    await Promise.all([reloadPurchaseOrders(), reloadMaterialRequests()]);
    const m = po.materialRequestId ? findMaterialRequest(po.materialRequestId) : null;
    createNotification("management", "Purchase Order "+poNo+" raised to "+po.vendorName.trim()+(m?" against "+(m.requestNo||"a Stock Request"):"")+" — awaiting your approval.", "po_pending_approval");
    return {};
  }, nextView);
}

/* ---- Goods Receipt Notes — Store receives against an approved PO, possibly
   across several partial GRNs (see poItemOutstandingQty). Filing one is
   three linked writes done here in the app layer: the GRN row itself, a
   stock-IN move per item on the existing Store Inventory ledger, and an
   auto-created vendor-bill row on the existing Purchase Register (Accounts'
   due-to-vendor bookkeeping) — no separate invoicing/inventory path. ---- */
async function reloadGoodsReceiptNotes(){
  const {data,error} = await sb.from("goods_receipt_notes").select("*").order("created_at",{ascending:false});
  if(error) throw error;
  state.goodsReceiptNotes = (data||[]).map(function(g){
    return {
      id:g.id, grnNo:g.grn_no||"", purchaseOrderId:g.purchase_order_id,
      receivedDate:g.received_date, items:g.items||[],
      vendorInvoiceNo:g.vendor_invoice_no||"", vendorInvoiceDate:g.vendor_invoice_date||"",
      notes:g.notes||"", purchaseRegisterId:g.purchase_register_id||null,
      department:g.department||"store", createdBy:g.created_by, createdAt:g.created_at
    };
  });
}
function grnsForPurchaseOrder(poId){
  return state.goodsReceiptNotes.filter(function(g){ return g.purchaseOrderId===poId; })
    .sort(function(a,b){ return (a.createdAt||"").localeCompare(b.createdAt||""); });
}
// Sum of everything already received against one PO line item across every
// GRN filed so far — always derived from the GRN ledger, never a separately
// maintained running total (same approach as currentBalanceForPurchaseItem).
function poItemReceivedQty(poId, purchaseItemId){
  let total = 0;
  grnsForPurchaseOrder(poId).forEach(function(g){
    (g.items||[]).forEach(function(it){
      if(it.purchaseItemId===purchaseItemId) total += num(it.qtyReceived);
    });
  });
  return total;
}
function poItemOutstandingQty(po, item){
  return Math.max(0, num(item.qty) - poItemReceivedQty(po.id, item.purchaseItemId));
}
function poFullyReceived(po){
  return (po.items||[]).every(function(it){ return poItemOutstandingQty(po, it) <= 1e-9; });
}
function poTotalAmount(po){
  return (po.items||[]).reduce(function(s,it){ return s+num(it.qty)*num(it.rate); }, 0);
}
// Which tab of the Purchase Order Register (see renderPoRegisterView) a PO
// falls under. Only four literal po.status values exist ("draft",
// "pending_approval", "approved", "rejected" — see reloadPurchaseOrders) but
// the register groups them into what a Purchase person actually thinks of
// as 4 buckets: anything not yet decided by the Director is still "Draft"
// work in progress; an approved PO stays in "Approved" until Store has
// received everything against it (poFullyReceived), at which point it moves
// itself into "Closed" with no separate status field to keep in sync;
// "Rejected" gets its own bucket rather than being buried under Draft so a
// PO that needs revising doesn't get lost among ones still being drafted.
function poRegisterBucket(po){
  if(po.status==="rejected") return "rejected";
  if(po.status==="approved") return poFullyReceived(po) ? "closed" : "approved";
  return "draft"; // "draft" or "pending_approval" — not yet decided either way
}
function newDraftGrn(poId){
  const po = findPurchaseOrder(poId);
  const items = po ? po.items.filter(function(it){ return poItemOutstandingQty(po, it) > 1e-9; }).map(function(it){
    const outstanding = poItemOutstandingQty(po, it);
    return { id: rowIdCounter(), purchaseItemId: it.purchaseItemId, name: it.name, unit: it.unit||"",
      rate: num(it.rate), gstPercent: num(it.gstPercent)||0, outstanding: outstanding, qtyReceived: outstanding };
  }) : [];
  return { id: uid("grn"), purchaseOrderId: poId, receivedDate: todayISO(), items: items, vendorInvoiceNo:"", vendorInvoiceDate:"", notes:"" };
}
async function saveGrn(grn, nextView){
  return runSave(async function(){
    const po = findPurchaseOrder(grn.purchaseOrderId);
    if(!po) throw new Error("Purchase Order not found.");
    const received = (grn.items||[]).filter(function(it){ return num(it.qtyReceived)>0; });
    if(!received.length) throw new Error("Enter a received qty for at least one item.");
    const over = received.find(function(it){
      const src = po.items.find(function(x){ return x.purchaseItemId===it.purchaseItemId; });
      return src && num(it.qtyReceived) > poItemOutstandingQty(po, src) + 1e-9;
    });
    if(over) throw new Error("\""+over.name+"\" — received qty can't exceed what's still outstanding on this PO.");

    const {data:seqData, error:seqErr} = await sb.rpc("next_grn_seq");
    if(seqErr) throw seqErr;
    const grnNo = "GRN-"+String(seqData).padStart(3,"0");

    // 1) Auto-create the vendor bill / due-payment entry on the existing
    //    Purchase Register — Accounts sees this as money owed with no
    //    re-typing.
    let taxable = 0, gstTotal = 0;
    received.forEach(function(it){
      const amt = num(it.qtyReceived)*num(it.rate);
      taxable += amt;
      gstTotal += amt * (num(it.gstPercent)||0)/100;
    });
    const totalAmount = taxable + gstTotal;
    const {data:prRow, error:prErr} = await sb.from("purchase_register").insert({
      entry_date: grn.receivedDate||todayISO(), vendor_id: po.vendorId||null, vendor_name: po.vendorName,
      vendor_gstin: po.vendorGstin||null, invoice_no: grn.vendorInvoiceNo||null, invoice_date: grn.vendorInvoiceDate||null,
      description: "GRN "+grnNo+" against PO "+(po.poNo||"")+" — "+received.map(function(it){ return it.name; }).join(", "),
      hsn_code: null,
      taxable_value: taxable, cgst_amount: gstTotal/2, sgst_amount: gstTotal/2, igst_amount: 0,
      total_amount: totalAmount, amount_paid: 0, payment_status:"unpaid",
      notes:"Auto-created on goods receipt (GRN "+grnNo+").", department:"store", created_by: session.user.id
    }).select("id").single();
    if(prErr) throw prErr;

    // 2) Update the Store Inventory ledger — one stock-IN move per item.
    const moveInserts = received.map(function(it){
      return { purchase_item_id: it.purchaseItemId, move_type:"in", qty: num(it.qtyReceived),
        move_date: grn.receivedDate||todayISO(), reference: grnNo,
        notes:"GRN against PO "+(po.poNo||""), created_by: session.user.id };
    });
    const {error:moveErr} = await sb.from("store_inventory_moves").insert(moveInserts);
    if(moveErr) throw moveErr;

    // 3) File the GRN itself, linked to the Purchase Register row it created.
    const {error:grnErr} = await sb.from("goods_receipt_notes").insert({
      grn_no:grnNo, purchase_order_id: po.id, received_date: grn.receivedDate||todayISO(),
      items: received.map(function(it){ return { id:it.id, purchaseItemId:it.purchaseItemId, name:it.name, unit:it.unit, qtyReceived:num(it.qtyReceived), rate:num(it.rate), gstPercent:num(it.gstPercent)||0 }; }),
      vendor_invoice_no: grn.vendorInvoiceNo||null, vendor_invoice_date: grn.vendorInvoiceDate||null,
      notes: grn.notes||null, purchase_register_id: prRow.id, department:"store", created_by: session.user.id
    });
    if(grnErr) throw grnErr;

    await Promise.all([reloadGoodsReceiptNotes(), reloadStoreInventoryMoves(), reloadPurchaseRegister()]);

    // 4) Auto-close the parent Stock Request once every PO line item is
    //    fully received (Store can also close it early/short manually).
    if(po.materialRequestId && poFullyReceived(po)){
      const {error:mrErr} = await sb.from("material_requests").update({
        status:"closed", closed_by: session.user.id, closed_at: new Date().toISOString()
      }).eq("id", po.materialRequestId);
      if(mrErr) throw mrErr;
      await reloadMaterialRequests();
    }
    createNotification("accounts", "Vendor bill logged from GRN "+grnNo+" against PO "+(po.poNo||"")+" — "+fmtINR(totalAmount)+" now due to "+(po.vendorName||"vendor")+".", "vendor_bill_from_grn");
    return {};
  }, nextView);
}

// Store's single combined action: pick what's actually being sent (capped at

async function storeSubmitDispatchAndRequestInvoice(mr, dispatchItems, nextView){

// Store's alternative to the Invoice path above — mints its own Delivery
// Challan number (next_dc_seq(), store dept/director only, mirrors
// next_invoice_seq()'s pattern) and goes straight from pending_store to
// dispatched, with no Invoice Request raised at all. This is the "dispatch
// on DC in case of absence of Invoice from Accounts" path — Store isn't
// blocked waiting on Accounts; an Invoice can still be requested separately
// at any time if one's needed later. A dc_no on the row (rather than a
// dedicated status value) is what marks a request as having gone this way,
// which uploadMaterialRequestProof's UI uses to skip demanding a signed
// invoice copy at the delivery-proof step (see renderMaterialRequestEditorView).
async function storeGenerateDcAndDispatch(mr, dispatchItems, nextView){
  return runSave(async function(){
    const {data:seqData, error:seqErr} = await sb.rpc("next_dc_seq");

    }).eq("id", mr.id);

    return {};
  }, nextView);
}
async function markMaterialRequestDispatched(id, nextView){

// Signed Challan + signed Invoice copy, uploaded together once material is
// delivered at site — mirrors savePurchaseEntry's scanned-invoice pattern,
// but against an already-existing row (both files are required together,
// matching the user's own phrasing "signed copy of Challan and Invoice").
async function uploadMaterialRequestProof(id, challanFile, invoiceFile, nextView){

    const upd = { status:"delivered", delivered_by: session.user.id, delivered_at: new Date().toISOString() };
    if(challanFile){
      const path = "material-requests/"+id+"/challan-"+Date.now()+"-"+safeFileName(challanFile.name||"challan");
      const {error:upErr} = await sb.storage.from("material-request-docs").upload(path, challanFile, { contentType:challanFile.type||"application/octet-stream", upsert:false });
      if(upErr) throw upErr;

/* ---- Invoice requests (Sales/Service -> Accounts) + generated Proforma Invoices ----
   A department (Sales, or Service via its Manager) requests an invoice
   against a customer from its own customer database; Accounts reviews the
   request — able to tweak any field first — then "Generate Invoice" issues
   a friendly sequential number (next_invoice_seq(), Accounts dept_head/
   director only) and writes the immutable invoices row that feeds the Sales
   Register. Rejecting a request leaves it on file with a note instead of
   deleting it. */
function findAnyCustomer(source, id){
  if(!id) return null;
  return source==="service" ? findServiceCustomer(id) : findCustomer(id);
}
function findAnySite(source, customer, siteId){
  if(!customer || !siteId) return null;
  return (customer.sites||[]).find(function(s){ return s.id===siteId; }) || null;
}
function invoiceItemAmount(item){ return num(item.qty) * num(item.rate); }
function invoiceItemsSubtotal(items){ return (items||[]).reduce(function(s,i){ return s+invoiceItemAmount(i); }, 0); }
function invoiceItemTax(item){ return invoiceItemAmount(item) * num(item.gstPercent) / 100; }
function invoiceTotals(items, taxType){
  const taxable = invoiceItemsSubtotal(items);
  const taxTotal = (items||[]).reduce(function(s,i){ return s+invoiceItemTax(i); }, 0);
  let cgst=0, sgst=0, igst=0;
  if(taxType==="inter") igst = taxTotal; else { cgst = taxTotal/2; sgst = taxTotal/2; }
  const rawTotal = taxable + cgst + sgst + igst;
  const total = Math.round(rawTotal);
  const roundedOff = total - rawTotal;
  return { taxable:taxable, cgst:cgst, sgst:sgst, igst:igst, total:total, roundedOff:roundedOff };
}
// Indian financial year label for the invoice number (e.g. "2026-27" for any
// date from 1 Apr 2026 to 31 Mar 2027). The underlying sequence itself runs
// continuously rather than resetting each year (same convention this app
// already uses for quote/FSR numbering) — the label just reflects when the
// invoice was actually issued.
function financialYearLabel(d){
  const y = d.getFullYear(), m = d.getMonth();
  const startY = m>=3 ? y : y-1;
  return startY+"-"+String(startY+1).slice(-2);
}

// Accounts' "Generate Invoice" step. editedFields carries whatever Accounts
// tweaked in the review form (consignee/delivery/items/tax type etc.) before
// generating — persisted back onto the request too, so the request and the
// resulting invoice never disagree about what was actually billed.
async function generateInvoiceFromRequest(requestId, editedFields, nextView){
  return runSave(async function(){
    const req = state.invoiceRequests.find(function(x){ return x.id===requestId; });
    if(!req) throw new Error("Request not found");
    const merged = Object.assign({}, req, editedFields||{});
    const totals = invoiceTotals(merged.items, merged.taxType);
    const {data:seqData, error:seqErr} = await sb.rpc("next_invoice_seq");
    if(seqErr) throw seqErr;
    const invoiceNo = String(seqData).padStart(3,"0")+"/"+financialYearLabel(new Date());
    const {data:inserted, error} = await sb.from("invoices").insert({
      invoice_no: invoiceNo, invoice_date: todayISO(), request_id: req.id, department: req.department,
      customer_source: req.customerSource, customer_id: req.customerId, site_id: req.siteId,
      consignee_name: merged.consigneeName, consignee_address: merged.consigneeAddress||null, consignee_pincode: merged.consigneePincode||null, consignee_gstin: merged.consigneeGstin||null,
      delivery_name: merged.deliveryName||null, delivery_address: merged.deliveryAddress||null, delivery_pincode: merged.deliveryPincode||null, delivery_gstin: merged.deliveryGstin||null,
      po_no: merged.poNo||null, po_date: merged.poDate||null,
      items: merged.items||[], tax_type: merged.taxType||"intra",
      taxable_value: totals.taxable, cgst_amount: totals.cgst, sgst_amount: totals.sgst, igst_amount: totals.igst,
      rounded_off: totals.roundedOff, total_amount: totals.total,
      linked_quote_id: req.linkedQuoteId||null,
      linked_visit_id: req.linkedVisitId||null, linked_complaint_id: req.linkedComplaintId||null,
      generated_by: session.user.id, closed: false
    }).select().single();
    if(error) throw error;
    const {error:updErr} = await sb.from("invoice_requests").update({
      status:"generated", reviewed_by:session.user.id, reviewed_at:new Date().toISOString(), invoice_id: inserted.id,
      consignee_name: merged.consigneeName, consignee_address: merged.consigneeAddress||null, consignee_pincode: merged.consigneePincode||null, consignee_gstin: merged.consigneeGstin||null,
      delivery_name: merged.deliveryName||null, delivery_address: merged.deliveryAddress||null, delivery_pincode: merged.deliveryPincode||null, delivery_gstin: merged.deliveryGstin||null,
      po_no: merged.poNo||null, po_date: merged.poDate||null, items: merged.items||[], tax_type: merged.taxType||"intra"
    }).eq("id", req.id);
    if(updErr) throw updErr;
    // Part J: if this invoice request was raised by Store against a Material
    // Request, the generated invoice also carries that request forward to
    // its next step (Store can now dispatch).
    if(req.linkedMaterialRequestId){
      const {error:mrErr} = await sb.from("material_requests").update({
        status:"invoice_generated", invoice_id: inserted.id
      }).eq("id", req.linkedMaterialRequestId);
      if(mrErr) throw mrErr;
    }
    await Promise.all([reloadInvoiceRequests(), reloadInvoices(), reloadMaterialRequests()]);
    if(req.linkedMaterialRequestId){
      const m = findMaterialRequest(req.linkedMaterialRequestId);
      createNotification("store", "Invoice "+invoiceNo+" generated"+(m?" for Material Request "+(m.requestNo||""):"")+" — ready to dispatch.", "invoice_generated_for_mr");
    }
    // Goes straight back to whichever department demanded it — that's the
    // department this request was raised under (req.department) — so it
    // shows up immediately on their own "Invoices Pending Payment" tab.
    createNotification(req.department, "Invoice "+invoiceNo+" generated for "+(merged.consigneeName||"a customer")+" — now on your Invoices Pending Payment tab.", "invoice_generated");
    return { invoiceId: inserted.id };
  }, nextView);
}
function isQuoteFinalized(q){ return q.quoteType==="service" ? !!q.clientApproved : q.status==="final"; }
// Quotes flagged as finalized but not yet covered by any non-rejected
// invoice request — the Sales Register's follow-up reminder list.
function uninvoicedFinalQuotes(){
  const covered = new Set();
  state.invoices.forEach(function(i){ if(i.linkedQuoteId) covered.add(i.linkedQuoteId); });
  state.invoiceRequests.forEach(function(r){ if(r.linkedQuoteId && r.status!=="rejected") covered.add(r.linkedQuoteId); });
  return state.quotes.filter(function(q){ return isQuoteFinalized(q) && !covered.has(q.id); });
}

/* ---- Part I: Sales finalize -> Management approval -> Planning Execution BOQ ----
   An AC Project quote's own status:"final" already means "PO received, no
   further alterations" (see the lock in renderEditorView). On top of that,
   Management additionally has to approve it "for execution" (a separate
   executionApproved/By/At flag stored right on the quote's own jsonb data —
   no schema change needed) before Planning ever sees it, so a finalized
   offer doesn't silently start being executed without a management sign-off. */
function projectFinalQuotes(){
  return state.quotes.filter(function(q){ return q.quoteType!=="service" && q.status==="final"; });
}
// Finalized offers Management hasn't yet approved for execution — the
// Management Dashboard's "Approval Pending from Sales department" sub-tab.
// Gated on EITHER the PO copy or a signed Order Acceptance Form being on
// file (see quotePoDocument/quoteOafDocument/uploadQuoteOrderDoc) — Sales
// uploads one of the two after finalizing and before this ever reaches
// Management, so Management always has the offer plus that proof to
// review together before approving execution.
function quotesAwaitingExecutionApproval(){
  return projectFinalQuotes().filter(function(q){ return !q.executionApproved && (!!quotePoDocument(q.id) || !!quoteOafDocument(q.id)); })
    .sort(function(a,b){ return (a.updatedAt||"").localeCompare(b.updatedAt||""); });
}
// Service's analog of quotesAwaitingExecutionApproval — finalized AMC/Repair
// offers with a PO or Order Acceptance Form on file (see
// serviceOrderProofSectionHTML), not yet approved by Management. Approving
// one (approve-service-execution) fires markAmcClientApproved, the same
// function the old in-editor "Mark Client Approved" button used to call —
// which is what actually opens the AMC contract and auto-generates the 4 PM
// visits, or for a repair job just moves it into the Order Book.
function serviceQuotesAwaitingApproval(){
  return amcQuotesForService().filter(function(q){ return q.status==="final" && !q.clientApproved && (!!quotePoDocument(q.id) || !!quoteOafDocument(q.id)); })
    .sort(function(a,b){ return (a.updatedAt||"").localeCompare(b.updatedAt||""); });
}
function boqsForQuote(quoteId){
  return state.executionBoqs.filter(function(b){ return b.quoteId===quoteId; });
}
// Management-approved offers Planning hasn't started an Execution BOQ for
// yet — Planning's "New order for Design and Planning" queue.
function planningNewOrders(){
  return projectFinalQuotes().filter(function(q){ return q.executionApproved && boqsForQuote(q.id).length===0; })
    .sort(function(a,b){ return (a.executionApprovedAt||"").localeCompare(b.executionApprovedAt||""); });
}
// A job Planning has started (at least one Execution BOQ exists) but hasn't
// marked complete yet -- kept visible in its own queue (instead of just
// disappearing once the first BOQ is created) so Planning can keep opening
// more Execution BOQs against the same job for as many pipe/duct/etc. sizes
// or work packages as the project actually needs.
function planningInProgressOrders(){
  return projectFinalQuotes().filter(function(q){ return q.executionApproved && !q.executionComplete && boqsForQuote(q.id).length>0; })
    .sort(function(a,b){ return (a.executionApprovedAt||"").localeCompare(b.executionApprovedAt||""); });
}
// Jobs Planning has explicitly marked complete -- listed separately (not
// just hidden) so a job closed by mistake, or one that turns out to need
// one more BOQ after all, can be reopened.
function planningCompletedOrders(){
  return projectFinalQuotes().filter(function(q){ return q.executionApproved && q.executionComplete; })
    .sort(function(a,b){ return (b.executionCompletedAt||"").localeCompare(a.executionCompletedAt||""); });
}
function markExecutionComplete(quoteId, nextView){
  const q = state.quotes.find(function(x){ return x.id===quoteId; });
  if(!q || q.executionComplete) return;
  const updated = Object.assign({}, q, {
    executionComplete: true, executionCompletedBy: session.user.id, executionCompletedAt: new Date().toISOString()
  });
  return saveQuote(updated, nextView, false, null);
}
function reopenExecution(quoteId, nextView){
  const q = state.quotes.find(function(x){ return x.id===quoteId; });
  if(!q || !q.executionComplete) return;
  const updated = Object.assign({}, q, {
    executionComplete: false, executionCompletedBy: null, executionCompletedAt: null
  });
  return saveQuote(updated, nextView, false, null);
}
// Part J: a saved Execution BOQ (at least one item) that Management hasn't
// yet approved — surfaces on the Management Dashboard under whichever
// department actually prepared it (see pendingApprovalRowsForDept).
function boqsAwaitingApproval(){
  return state.executionBoqs.filter(function(b){ return !b.approved && (b.items||[]).length>0; })
    .sort(function(a,b){ return (a.createdAt||"").localeCompare(b.createdAt||""); });
}
// Management-approved BOQs — Project's execution queue. Project can keep
// raising Material Requests against the same BOQ (e.g. staged deliveries)
// until every item is fully requested, so this simply lists every approved
// BOQ rather than only "not yet requested" ones.
function approvedExecutionBoqs(){
  return state.executionBoqs.filter(function(b){ return b.approved; })
    .sort(function(a,b){ return (b.approvedAt||"").localeCompare(a.approvedAt||""); });
}
// Qty already committed against a given item name across every OTHER
// Execution BOQ for the same quote (used to cap a new/edited BOQ line at
// the final offer's own quantity for that item — see execution-boq editor).
function boqQtyCommittedForItem(quoteId, itemName, excludeBoqId){
  let total = 0;
  boqsForQuote(quoteId).forEach(function(b){
    if(b.id===excludeBoqId) return;
    (b.items||[]).forEach(function(it){
      // Only count rows actually sourced from the offer — a custom/manual
      // line that happens to share the same name shouldn't eat into the
      // offer-quantity cap for the real offer item. A "size split" row (see
      // add-boq-size-split) carries the real quoted item's name in
      // capItemName instead of its own — e.g. several different pipe-OD
      // rows all counting against one quoted "Refrigerant Copper Pipes" —
      // so match on that when present, falling back to the row's own name
      // for a plain (non-split) offer row.
      if(it.source==="offer" && ((it.capItemName||it.name)||"").trim().toLowerCase()===(itemName||"").trim().toLowerCase()) total += num(it.qty);
    });
  });
  return total;
}
// qty_increase_requests.requestedQty is the TOTAL qty needed at site for
// that item (matches the "Qty needed at site" label on the request form) —
// not an incremental extra on top of the offer. So once Management approves
// one, it doesn't ADD to the offer qty, it RAISES the effective cap to
// whichever is bigger: the offer's own qty, or the largest approved
// requested total for that item.
function effectiveOfferQtyForItem(quoteId, itemName){
  const q = state.quotes.find(function(x){ return x.id===quoteId; });
  const flat = q ? quoteItemsFlat(q) : [];
  const offerItem = flat.find(function(it){ return (it.name||"").trim().toLowerCase()===(itemName||"").trim().toLowerCase(); });
  let base = offerItem ? num(offerItem.qty) : 0;
  state.qtyIncreaseRequests.forEach(function(r){
    if(r.quoteId===quoteId && r.status==="approved" && (r.itemName||"").trim().toLowerCase()===(itemName||"").trim().toLowerCase()){
      base = Math.max(base, num(r.requestedQty));
    }
  });
  return base;
}
// How much of a given offer item THIS BOQ (or a new one, if excludeBoqId is
// null) may still use: the item's effective qty (offer qty, or a bigger
// Management-approved total if one exists) minus what's already committed
// in every OTHER Execution BOQ for this same quote.
function maxAllowedQtyForOfferItem(quoteId, itemName, excludeBoqId){
  const effectiveQty = effectiveOfferQtyForItem(quoteId, itemName);
  const committedElsewhere = boqQtyCommittedForItem(quoteId, itemName, excludeBoqId);
  return Math.max(0, effectiveQty - committedElsewhere);
}

/* ---- Payment tracking (Accounts records what's actually been received /
   paid) — a single amount vs. the row's total, so the status shown is
   always derived rather than a separately-maintained flag that could
   drift out of sync. ---- */
function invoicePaymentStatus(inv){

/* ---- Amount in words (Indian numbering — Lakh/Crore) for the Proforma Invoice ---- */
const NUM_WORDS_ONES = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
const NUM_WORDS_TENS = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
function twoDigitWords(n){
  n = Math.floor(n);
  if(n<20) return NUM_WORDS_ONES[n];
  return NUM_WORDS_TENS[Math.floor(n/10)] + (n%10 ? " "+NUM_WORDS_ONES[n%10] : "");
}
function threeDigitWords(n){
  n = Math.floor(n);
  const h = Math.floor(n/100), r = n%100;
  let out = "";
  if(h) out += NUM_WORDS_ONES[h]+" Hundred";
  if(r) out += (out?" ":"")+twoDigitWords(r);
  return out;
}
function numberToWordsIndian(n){
  n = Math.round(Math.abs(num(n)));
  if(n===0) return "Zero";
  const crore = Math.floor(n/10000000); n%=10000000;
  const lakh = Math.floor(n/100000); n%=100000;
  const thousand = Math.floor(n/1000); n%=1000;
  const rest = n;
  const parts = [];
  if(crore) parts.push(threeDigitWords(crore)+" Crore");
  if(lakh) parts.push(threeDigitWords(lakh)+" Lakh");
  if(thousand) parts.push(threeDigitWords(thousand)+" Thousand");
  if(rest) parts.push(threeDigitWords(rest));
  return parts.join(" ");
}
function amountInWordsINR(n){ return "Rupees "+numberToWordsIndian(n)+" Only"; }

async function createDocument(payload, file, nextView){
  return runSave(async function(){
    const row = {
      doc_type: payload.docType, department: payload.department, title: payload.title||"",
      notes: payload.notes||null, linked_quote_id: payload.linkedQuoteId||null, linked_site_id: payload.linkedSiteId||null,
      created_by: session.user.id
    };
    const {data,error} = await sb.from("documents").insert(row).select("id").single();
    if(error) throw error;
    if(file){
      // Trust the browser-reported file.type (like the AMC photo/signed-copy
      // uploads) instead of hardcoding "application/pdf" — that hardcoding
      // silently failed the bucket's old MIME allow-list for any attachment
      // that wasn't literally a PDF. The bucket no longer restricts by MIME
      // type at all and the file picker has no accept filter, so any file
      // type goes through; fall back to a generic type only when the
      // browser doesn't report one, never assume PDF.
      const path = payload.department+"/"+payload.docType+"/"+data.id+"-"+Date.now()+"-"+safeFileName(file.name||"upload");
      const {error:upErr} = await sb.storage.from("department-docs").upload(path, file, { contentType:file.type||"application/octet-stream", upsert:false });
      if(upErr) throw upErr;
      const {error:updErr} = await sb.from("documents").update({ file_path:path, file_name:file.name||"upload.pdf" }).eq("id", data.id);
      if(updErr) throw updErr;
    }
    await reloadDocuments();
    return {};
  }, nextView||{});

// The department_permissions tick-table (see DEPT_PERMISSIONS_CATALOG,
// hasDeptPermission). Loaded for EVERY signed-in user, not just the
// director/HOD — an Executive/Technician needs their own ticks to render
// their UI correctly, and RLS on department_permissions already lets any
// authenticated user read the whole table (only writes are director-only).
// Reshaped from flat rows into { [department]: { [seniority]: { [key]:true } } },
// keeping only rows that are actually allowed=true so a lookup is a plain
// truthy check.
async function reloadDepartmentPermissions(){
  const {data,error} = await sb.from("department_permissions").select("*");
  if(error){ state.departmentPermissions = {}; return; }
  const out = {};
  (data||[]).forEach(function(r){
    if(!r.allowed) return;
    out[r.department] = out[r.department] || {};
    out[r.department][r.seniority] = out[r.department][r.seniority] || {};
    out[r.department][r.seniority][r.permission_key] = true;
  });
  state.departmentPermissions = out;

/* ---- Offer revisions ----
   A "revision" is a full, independent quote row (its own id, its own
   quote_no, its own editable content) that's linked back to the original
   ("root") offer via revisionRootId, and numbered via revisionNo (0 = the
   original, 1/2/3.. = each later revision). The saved quote_no for a
   revision is the root's own quote_no with "-R1", "-R2" etc appended, so
   e.g. revising PAS-0004 twice gives PAS-0004-R1 and PAS-0004-R2 while
   the original PAS-0004 stays exactly as first issued — nothing renumbers
   or overwrites it. Old quotes saved before this feature existed have no
   revisionRootId/revisionNo at all, which every helper below treats the
   same as "the original" (root = itself, revision 0). */
function revisionRootId(q){ return (q && q.revisionRootId) || (q && q.id); }
function revisionFamily(q){
  const rootId = revisionRootId(q);
  return state.quotes.filter(function(x){ return revisionRootId(x)===rootId; })
    .sort(function(a,b){ return (a.revisionNo||0)-(b.revisionNo||0); });
}
function revisionedQuoteNo(baseNo, revisionNo){
  if(!revisionNo) return baseNo;
  return baseNo + "-R" + String(revisionNo);
}
/* ---- Part K: the unique Project Code/Name Management assigns at
   execution-approval time (see approveQuoteExecution). Once a quote carries
   one, this becomes its primary label everywhere downstream — Planning,
   Project, Store — since that is the identity those departments actually
   work against; the original offer number stays visible alongside it for
   traceability back to the quote/PO. Falls back to the quote number alone
   for anything not yet approved for execution. */
function quoteProjectLabel(q){
  if(!q) return "—";
  if(q.projectCode) return esc(q.projectCode)+(q.projectName?" — "+esc(q.projectName):"")+" <span class=\"hint\">("+esc(q.quoteNo)+")</span>";
  return esc(q.quoteNo);
}
// Plain-text (no markup) variant for <input> values and other non-HTML spots.
function quoteProjectLabelPlain(q){
  if(!q) return "—";
  if(q.projectCode) return q.projectCode+(q.projectName?" — "+q.projectName:"")+" ("+q.quoteNo+")";
  return q.quoteNo;
}
function quoteNoCellHTML(q){
  const n = q.revisionNo||0;
  if(!n) return "<b>"+esc(q.quoteNo)+"</b>";
  return "<span style=\"padding-left:14px;color:var(--text-muted)\">↳ "+esc(q.quoteNo)+"</span><br>"+
    "<span class=\"hint\" style=\"padding-left:14px\">Revision "+n+"</span>";
}
// Groups a quote list so every revision of the same offer sits together
// (original first, then Revision 1, 2, ...), with the most recently active
// family shown first — this is what makes "track this offer's revisions"
// actually work in a plain flat table instead of scattering them by date.
function sortQuotesWithRevisionGrouping(list){
  const groups = {}, order = [];
  list.forEach(function(q){
    const rid = revisionRootId(q);
    if(!groups[rid]){ groups[rid] = []; order.push(rid); }
    groups[rid].push(q);
  });
  order.forEach(function(rid){ groups[rid].sort(function(a,b){ return (a.revisionNo||0)-(b.revisionNo||0); }); });
  order.sort(function(a,b){
    const la = groups[a].reduce(function(m,x){ return (x.updatedAt||"")>m ? (x.updatedAt||"") : m; }, "");
    const lb = groups[b].reduce(function(m,x){ return (x.updatedAt||"")>m ? (x.updatedAt||"") : m; }, "");
    return lb.localeCompare(la);
  });
  let out = [];
  order.forEach(function(rid){ out = out.concat(groups[rid]); });
  return out;
}
function newRevisionRowActionsHTML(q){
  return "<button class=\"btn btn-sm btn-ghost\" data-action=\"new-revision\" data-id=\""+q.id+"\" title=\"Start a new revision of this offer — keeps the same offer number with a -R1, -R2... suffix\">+ Revision</button>";
}
// The customer's PO copy, uploaded by Sales once a project quote is
// finalized — reuses the existing generic Documents feature (docType "po")
// rather than a new table, so it's completely outside the quote's own
// finalize-lock (that RLS/trigger only ever touches the quotes table).
// Pre-approved on creation (no separate accept/reject step makes sense for
// an attachment); Management reviews the actual file alongside the offer
// before approving execution — see quotesAwaitingExecutionApproval.
function quotePoDocument(quoteId){
  return state.documents.find(function(d){ return d.docType==="po" && d.linkedQuoteId===quoteId; }) || null;
}
// The alternative to a PO for customers who can't issue one (individuals,
// etc.) — a signed Order Acceptance Form. Either this or quotePoDocument
// satisfies quotesAwaitingExecutionApproval's gate.
function quoteOafDocument(quoteId){
  return state.documents.find(function(d){ return d.docType==="oaf" && d.linkedQuoteId===quoteId; }) || null;
}
// Optional attachment for a customer's AutoCAD/CAD drawing that came in
// alongside the PO (or separately) — never gates approval on its own (see
// ORDER_DOC_META).
function quoteDrawingDocument(quoteId){
  return state.documents.find(function(d){ return d.docType==="drawing" && d.linkedQuoteId===quoteId; }) || null;
}
// Every document Sales has on file for a quote (PO, Order Acceptance Form,
// drawing, and any future client-input type) — these are all treated as
// "inputs from the client at the sales stage", and once Management
// approves the offer for execution they become visible to Planning AND
// Project for detailed working / site execution, via the "planning/project
// can view sales client documents after execution approval" RLS policy on
// documents (any doc_type, gated only on the linked quote's
// executionApproved flag). Surfaced downstream in
// renderPlanningOrdersView, renderExecutionBoqEditorView and
// renderMaterialRequestEditorView via quoteClientDocumentsBlockHTML.
function quoteSalesInputDocuments(quoteId){
  return state.documents.filter(function(d){ return d.department==="sales" && d.linkedQuoteId===quoteId; })
    .sort(function(a,b){ return (a.createdAt||"").localeCompare(b.createdAt||""); });
}

// otherwise a labeled card suitable for Planning/Project's own screens.

// Shown inside the locked/final quote editor for Sales — gates the quote
// from ever reaching Management's "Approval for Execution" queue until
// EITHER a PO copy or a signed Order Acceptance Form is on file (see
// quotesAwaitingExecutionApproval), per "upload PO after setting final,

function quoteOrderProofUploadHTML(q, docType){

        "<div class=\"hint\" style=\"margin-bottom:8px\">Replace it with a different file if needed. "+formatHint+"</div>"
      : (isDrawing
          ? "<div class=\"hint\" style=\"margin-bottom:8px\">Optional — if the customer's PO came with a CAD drawing, attach it here so Planning can pull it up for detailed working once this offer is approved for execution. "+formatHint+"</div>"
          : (isOaf

      "<div class=\"field\"><button class=\"btn btn-primary\" data-action=\""+uploadAction+"\" data-id=\""+q.id+"\">"+(doc?"Replace":"Upload")+"</button></div>"+

  "</div>";
}

// Shown right above the Quote No. field in the editor — "in front of" the
// offer number, so it's the first thing you see whether you're looking at
// a revision (which one, and of what) or the original (and whether it's
// since picked up any revisions of its own).
function revisionContextHTML(q){
  const n = q.revisionNo||0;
  const rootId = revisionRootId(q);
  if(n>0){
    const root = state.quotes.find(function(x){ return x.id===rootId; });
    return "<div class=\"hint\" style=\"margin-bottom:10px\">This is <b>Revision "+n+"</b> of offer "+esc((root&&root.quoteNo)||"—")+".</div>";
  }
  const laterRevisions = state.quotes.filter(function(x){ return x.id!==q.id && revisionRootId(x)===rootId; });
  if(laterRevisions.length){
    return "<div class=\"hint\" style=\"margin-bottom:10px\">"+laterRevisions.length+" revision"+(laterRevisions.length===1?"":"s")+" of this offer "+(laterRevisions.length===1?"exists":"exist")+" — see the list.</div>";
  }
  return "";
