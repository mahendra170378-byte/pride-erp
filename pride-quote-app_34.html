/* ============================== Heat Load Calculator ==============================
   Reproduces (to full float precision — the reference workbook truncates at a
   few intermediate steps, we don't) the ETD-style cooling-load method used in
   the user's own reference spreadsheet (Heat_Load_Ranka_CG.xlsx — "AMTREX" /
   Pride Air Systems templates). Formula chain and every fixed constant below
   were reverse-engineered from that workbook's cell formulas and verified to
   match its two worked examples to within rounding. This is an internal
   editor-only tool (never printed on the quotation) that feeds a computed
   tonnage into Annexure I — AC Distribution via "Add to AC Distribution". */

/* Orientation tables for solar/transmission gain — temp-diff and factor are
   fixed constants of this method (confirmed identical across both real
   example sheets, at two different Indian sites), NOT per-job inputs. Only
   the area per orientation is entered by the user. */
const GLASS_ORIENT = [
  { key:"N",  label:"North", tempDiff:23  },
  { key:"E",  label:"East",  tempDiff:12  },
  { key:"W",  label:"West",  tempDiff:163 },
  { key:"S",  label:"South", tempDiff:12  },
  { key:"NE", label:"N-E",   tempDiff:12  },
  { key:"NW", label:"N-W",   tempDiff:138 },
  { key:"SE", label:"S-E",   tempDiff:12  },
  { key:"SW", label:"S-W",   tempDiff:85  }
];
const GLASS_SOLAR_FACTOR = 0.56;
const WALL_ORIENT = [
  { key:"N",  label:"North", tempDiff:24 },
  { key:"E",  label:"East",  tempDiff:38 },
  { key:"W",  label:"West",  tempDiff:32 },
  { key:"S",  label:"South", tempDiff:36 },
  { key:"NE", label:"N-E",   tempDiff:30 },
  { key:"NW", label:"N-W",   tempDiff:26 },
  { key:"SE", label:"S-E",   tempDiff:38 },
  { key:"SW", label:"S-W",   tempDiff:34 }
];
const WALL_TRANS_FACTOR = 0.34;
const ROOF_TEMP_DIFF = 55;

function trunc2(x){ return Math.trunc(x*100 + (x<0?-1e-9:1e-9))/100; }

function newHeatLoadRoom(){
  return {
    id: uid("hl"),
    name: "",
    cityId: "",
    outsideDB: 99, outsideWB: 75, outsideGR: 90,
    insideDB: 73.4, insideRH: 55, insideGR: 70,
    area: 0, height: 10, airChanges: 1,
    numPeople: 0, cfmPerPerson: 10,
    lightingWattsPerSft: 2, applianceWatts: 0,
    glass: { N:0,E:0,W:0,S:0,NE:0,NW:0,SE:0,SW:0 },
    wall:  { N:0,E:0,W:0,S:0,NE:0,NW:0,SE:0,SW:0 },
    roofArea: 0, roofFactor: 0.14,
    aglsArea: 0, partitionsArea: 0, ceilingArea: 0, floorArea: 0,
    selectedADP: 55
  };
}

/* Pure calculation — safe to call on every keystroke, no DOM/state access. */
function calcHeatLoad(r){
  const area = num(r.area), height = num(r.height), airChanges = num(r.airChanges);
  const cfmPerPerson = num(r.cfmPerPerson), numPeople = num(r.numPeople);
  const outsideDB = num(r.outsideDB), outsideGR = num(r.outsideGR);
  const insideDB = num(r.insideDB), insideGR = num(r.insideGR);
  const dbDiff = outsideDB - insideDB;
  const grDiff = outsideGR - insideGR;

  const cfmVol = area*height*airChanges/60;
  const cfmOcc = cfmPerPerson*numPeople;
  const cfmCal = Math.max(cfmVol, cfmOcc);

  const glassRows = GLASS_ORIENT.map(function(o){
    const a = num((r.glass||{})[o.key]);
    return { key:o.key, label:o.label, area:a, tempDiff:o.tempDiff, factor:GLASS_SOLAR_FACTOR, gain:a*o.tempDiff*GLASS_SOLAR_FACTOR };
  });
  const glassTotal = glassRows.reduce(function(s,x){ return s+x.gain; },0);
  const glassAreaTotal = glassRows.reduce(function(s,x){ return s+x.area; },0);

  const wallRows = WALL_ORIENT.map(function(o){
    const a = num((r.wall||{})[o.key]);
    return { key:o.key, label:o.label, area:a, tempDiff:o.tempDiff, factor:WALL_TRANS_FACTOR, gain:a*o.tempDiff*WALL_TRANS_FACTOR };
  });
  const wallTotal = wallRows.reduce(function(s,x){ return s+x.gain; },0);

  const roofArea = num(r.roofArea), roofFactor = num(r.roofFactor);
  const roofGain = roofArea*ROOF_TEMP_DIFF*roofFactor;

  // AGLS = plain glass conduction (orientation-independent), factor 1.13.
  // Area is a direct manual entry — matches the reference workbook exactly,
  // where this is its own typed-in cell (not auto-derived from the glass
  // orientation areas; the two aren't always the same number on a real job).
  const aglsArea = num(r.aglsArea);
  const aglsGain = aglsArea*dbDiff*1.13;
  const partitionsArea = num(r.partitionsArea);
  const partitionsGain = partitionsArea*(dbDiff-5)*0.34;
  const ceilingArea = num(r.ceilingArea);
  const ceilingGain = ceilingArea*(dbDiff-5)*0.42;
  const floorArea = num(r.floorArea);
  const floorGain = floorArea*(dbDiff-5)*0.52;

  const bypassSensible = cfmCal*dbDiff*0.15*1.08;
  const bypassLatent = cfmCal*grDiff*0.15*0.68;

  const peopleSensible = numPeople*245;
  const peopleLatent = numPeople*205;
  const applianceWatts = num(r.applianceWatts);
  const applianceGain = applianceWatts*3.4;
  const lightingWattsPerSft = num(r.lightingWattsPerSft);
  const lightGain = (lightingWattsPerSft*area)*3.4*1.25;

  const subTotalSensible = glassTotal+wallTotal+roofGain+aglsGain+partitionsGain+ceilingGain+floorGain+bypassSensible+peopleSensible+applianceGain+lightGain;
  const safetySensible = subTotalSensible*0.125;
  const roomSensibleHeat = subTotalSensible+safetySensible;

  const subTotalLatent = bypassLatent+peopleLatent;
  const safetyLatent = trunc2(subTotalLatent*0.05);
  const roomLatentHeat = subTotalLatent+safetyLatent;

  const roomTotalHeat = roomSensibleHeat+roomLatentHeat;

  const oaSensible = cfmCal*dbDiff*0.85*1.08;
  const oaLatent = cfmCal*grDiff*0.85*0.68;
  const oaSubTotal = oaSensible+oaLatent;

  const total = roomTotalHeat+oaSubTotal;
  const heatGainSafety = total*0.03;
  const grandTotalHeat = total+heatGainSafety;
  const grandTotalTons = grandTotalHeat/12000;

  const shf = roomTotalHeat>0 ? trunc2(roomSensibleHeat/roomTotalHeat) : 0;
  const selectedADP = num(r.selectedADP);
  const dehumRise = 0.85*(insideDB-selectedADP);
  const dehumCfm = dehumRise>0 ? trunc2(roomSensibleHeat/1.08/dehumRise) : 0;
  const tonsAsPerCfm = dehumCfm/400;

  const tonnageRequired = Math.max(grandTotalTons, tonsAsPerCfm);

  return {
    cfmVol:cfmVol, cfmOcc:cfmOcc, cfmCal:cfmCal, dbDiff:dbDiff, grDiff:grDiff,
    glassRows:glassRows, glassTotal:glassTotal, glassAreaTotal:glassAreaTotal,
    wallRows:wallRows, wallTotal:wallTotal,
    roofGain:roofGain, aglsArea:aglsArea, aglsGain:aglsGain, partitionsGain:partitionsGain, ceilingGain:ceilingGain, floorGain:floorGain,
    bypassSensible:bypassSensible, bypassLatent:bypassLatent,
    peopleSensible:peopleSensible, peopleLatent:peopleLatent, applianceGain:applianceGain, lightGain:lightGain,
    subTotalSensible:subTotalSensible, safetySensible:safetySensible, roomSensibleHeat:roomSensibleHeat,
    subTotalLatent:subTotalLatent, safetyLatent:safetyLatent, roomLatentHeat:roomLatentHeat,
    roomTotalHeat:roomTotalHeat,
    oaSensible:oaSensible, oaLatent:oaLatent, oaSubTotal:oaSubTotal,
    total:total, heatGainSafety:heatGainSafety, grandTotalHeat:grandTotalHeat, grandTotalTons:grandTotalTons,
    shf:shf, dehumRise:dehumRise, dehumCfm:dehumCfm, tonsAsPerCfm:tonsAsPerCfm, tonnageRequired:tonnageRequired,
    btuPerSftGrand: area>0 ? trunc2(grandTotalHeat/area) : 0,
    btuPerSftSensible: area>0 ? trunc2(roomSensibleHeat/area) : 0,
    sftPerPerson: numPeople>0 ? area/numPeople : 0,
    cfmPerSft: area>0 ? dehumCfm/area : 0,
    tonsPerSft: area>0 ? tonsAsPerCfm/area : 0,
    tonsPerPerson: numPeople>0 ? tonsAsPerCfm/numPeople : 0,
    dehumCfmPerTon: tonsAsPerCfm>0 ? dehumCfm/tonsAsPerCfm : 0,
    areaPerTon: tonsAsPerCfm>0 ? area/tonsAsPerCfm : 0
  };
}

function heatLoadResultsBlockHTML(room){

/* ============================== Heat Load Calculation report ==============================
   A separate, plain-paper document (distinct look from the Daikin+Pride
   letterhead quotation) modelled on the user's own reference "bypass factor
   method" report: a dark stat-tile banner up top, gray section bars, plain
   tabular data. Can be printed on its own, or appended after the quotation
   pages so both come out of one PDF/print job ("with the offer"). Reuses the
   .doc-page sizing/pagination rules (already proven correct for html2pdf)
   with its own header/footer/content markup instead of the letterhead. */
function heatLoadJobLabel(q){
  return (q.heatLoadJobName||"").trim() || (q.client&&q.client.subject) || (q.client&&q.client.name) || "Heat Load Calculation";
}
function hldFmtDateSlash(iso){
  if(!iso) return "—";
  const d = new Date(iso+"T00:00:00");
  if(isNaN(d)) return iso;
  return d.getDate()+"/"+(d.getMonth()+1)+"/"+d.getFullYear();
}
function hldHeaderHTML(c){
  return "<div class=\"hld-header\"><span>"+esc((c.name||"").toUpperCase())+"</span><span>HEAT LOAD CALCULATION</span></div>";
}
function hldFooterHTML(jobLabel, pageNum, totalPages, dateStr){
  return "<div class=\"hld-footer\"><span>"+esc(jobLabel)+" — Page "+pageNum+"</span><span>"+esc(dateStr)+"</span></div>";
}
function hldPage(c, pageNum, totalPages, jobLabel, dateStr, innerHTML){
  return "<div class=\"doc-page\">"+hldHeaderHTML(c)+"<div class=\"hld-body\">"+innerHTML+"</div>"+hldFooterHTML(jobLabel,pageNum,totalPages,dateStr)+"</div>";
}
function hldBannerHTML(tiles){
  return "<div class=\"hld-banner\">"+tiles.map(function(t){
    return "<div class=\"hld-tile\"><div class=\"tile-label\">"+esc(t.label)+"</div><div class=\"tile-value\">"+t.value+"</div></div>";
  }).join("")+"</div>";
}
function hldSectionBarHTML(label){
  return "<div class=\"hld-section-bar\">"+esc(label)+"</div>";
}
function hldKvRowsHTML(rows){
  return "<table class=\"hld-kv\"><tbody>"+rows.map(function(r){
    return "<tr"+(r.highlight?" class=\"hl\"":"")+"><td>"+esc(r.label)+"</td><td>"+r.value+"</td></tr>";
  }).join("")+"</tbody></table>";
}
function hldKvColsHTML(leftRows, rightRows){
  return "<div class=\"hld-kv-cols\">"+hldKvRowsHTML(leftRows)+hldKvRowsHTML(rightRows)+"</div>";
}
function hldOrientTableHTML(heading, orientRows, unitLabel){
  const rows = orientRows.filter(function(r){ return num(r.area)>0; });
  const total = rows.reduce(function(s,r){ return s+r.gain; },0);
  return hldSectionBarHTML(heading)+
    "<table class=\"hld-table\"><thead><tr><th>"+esc(unitLabel)+"</th><th class=\"num\">Area</th><th class=\"num\">ETD</th><th class=\"num\">U</th><th class=\"num\">Gain (BTU/hr)</th></tr></thead><tbody>"+
    (rows.length ? rows.map(function(r){
      return "<tr><td>"+esc(r.label)+"</td><td class=\"num\">"+fmtNum(r.area,0)+"</td><td class=\"num\">"+fmtNum(r.tempDiff,0)+"</td><td class=\"num\">"+fmtNum(r.factor,2)+"</td><td class=\"num\">"+fmtNum(r.gain,0)+"</td></tr>";
    }).join("") : "<tr><td colspan=\"5\" style=\"color:var(--paper-muted);text-align:center;padding:10px\">No area entered</td></tr>")+
    "<tr class=\"sub\"><td colspan=\"4\">SUB TOTAL</td><td class=\"num\">"+fmtNum(total,0)+"</td></tr>"+
    "</tbody></table>";
}
function heatLoadTotals(q){
  const rooms = (q.heatLoadRooms||[]).map(function(room){ return { room:room, res:calcHeatLoad(room) }; });
  return {
    rooms: rooms,
    totalArea: rooms.reduce(function(s,x){ return s+num(x.room.area); },0),
    totalTonnage: rooms.reduce(function(s,x){ return s+x.res.tonnageRequired; },0),
    totalDehumCfm: rooms.reduce(function(s,x){ return s+x.res.dehumCfm; },0)
  };
}
/* The compact title+meta block shared by the standalone cover page and,
   for a single-room job, prepended straight onto the room's own first page
   instead — a separate cover page would just repeat the same one room's
   totals a second time. */
function heatLoadDocHeaderBlockHTML(q, c, jobLabel){
  return ""+
    "<h1 class=\"hld-title\">"+esc(c.name||"")+"</h1>"+
    "<div class=\"hld-title-sub\">Heat Load Calculation — Bypass Factor Method</div>"+
    "<div class=\"hld-meta-grid\">"+
      "<div class=\"hld-meta-row\"><span class=\"k\">Job / Project</span><span>"+esc(jobLabel)+"</span></div>"+
      "<div class=\"hld-meta-row\"><span class=\"k\">Date</span><span>"+esc(fmtDate(q.date))+"</span></div>"+
      "<div class=\"hld-meta-row\"><span class=\"k\">Client</span><span>"+esc(q.client&&q.client.name||"—")+"</span></div>"+

    "</div>";
}
function heatLoadCoverPageHTML(q, c, pageNum, totalPages){
  const jobLabel = heatLoadJobLabel(q);

    "<table class=\"hld-table\"><thead><tr><th>Room</th><th class=\"num\">Area (sft)</th><th class=\"num\">Grand Total (TR)</th><th class=\"num\">Dehum. Cfm</th><th class=\"num\">Tonnage Req. (TR)</th></tr></thead><tbody>"+
      totals.rooms.map(function(x){
        return "<tr><td>"+esc(x.room.name||"(unnamed room)")+"</td><td class=\"num\">"+fmtNum(x.room.area,0)+"</td><td class=\"num\">"+fmtNum(x.res.grandTotalTons,2)+"</td><td class=\"num\">"+fmtNum(x.res.dehumCfm,0)+"</td><td class=\"num\">"+fmtNum(x.res.tonnageRequired,2)+"</td></tr>";
      }).join("")+
      "<tr class=\"sub\"><td>TOTAL</td><td class=\"num\">"+fmtNum(totals.totalArea,0)+"</td><td class=\"num\"></td><td class=\"num\">"+fmtNum(totals.totalDehumCfm,0)+"</td><td class=\"num\">"+fmtNum(totals.totalTonnage,2)+"</td></tr>"+
    "</tbody></table>";
  return hldPage(c, pageNum, totalPages, jobLabel, dateStr, body);
}

        { label:"People", value:fmtNum(room.numPeople,0) },

        { label:"Outside D.B. / W.B.", value:fmtNum(room.outsideDB,1)+" / "+fmtNum(room.outsideWB,1)+" °F" },

        { label:"Grain Diff.", value:fmtNum(r.grDiff,1)+" gr/lb" },

  const bodyB = ""+

    hldOrientTableHTML("Solar & Transmission Gain", r.wallRows, "Surface");

  const bodyC = ""+
    hldSectionBarHTML("Room Sensible Heat")+
    hldKvRowsHTML([
      { label:"Solar Gain — Glass", value:fmtNum(r.glassTotal,0) },
      { label:"Solar & Transmission Gain", value:fmtNum(r.wallTotal,0) },
      { label:"Other Transmission Gain (AGLS/Partitions/Ceiling/Floor/Roof)", value:fmtNum(otherTransGain,0) },
      { label:"Bypass O.A. Sensible Load", value:fmtNum(r.bypassSensible,0) },
      { label:"Internal Sensible Load (People/Appliances/Lights)", value:fmtNum(internalSensible,0) },
      { label:"Sub Total", value:fmtNum(r.subTotalSensible,0) },
      { label:"Leak Loss + Safety (12.5%)", value:fmtNum(r.safetySensible,0) },
      { label:"Room Sensible Heat (BTU/hr)", value:fmtNum(r.roomSensibleHeat,0) }
    ])+
    hldSectionBarHTML("Room Latent Heat & Outside Air")+
    hldKvColsHTML(
      [
        { label:"Bypass O.A. Latent Load", value:fmtNum(r.bypassLatent,0) },
        { label:"Internal Latent Load (People)", value:fmtNum(r.peopleLatent,0) },
        { label:"Sub Total", value:fmtNum(r.subTotalLatent,0) },
        { label:"Safety Factor (5.0%)", value:fmtNum(r.safetyLatent,0) },

function heatLoadDocumentHTML(q, c){
  const jobLabel = heatLoadJobLabel(q);
  const dateStr = hldFmtDateSlash(q.date);
  const rooms = q.heatLoadRooms||[];
  /* A single-room job doesn't need its own cover page — the cover's
     banner and totals would just be the one room's own numbers a second
     time. Fold the title/meta block straight onto the room's first page
     instead, saving a full page on the common case. Multi-room jobs keep
     the standalone cover, since the "Rooms in this Job" summary table
     there is genuinely doing something a single room page can't. */
  if(rooms.length === 1){
    const totalPages = 3;
    const headerBlock = heatLoadDocHeaderBlockHTML(q, c, jobLabel);
    return heatLoadRoomPagesHTML(rooms[0], c, jobLabel, dateStr, 1, totalPages, headerBlock).join("");
  }
  const totalPages = 1 + rooms.length*3;
  let pageNum = 1;
  let html = heatLoadCoverPageHTML(q, c, pageNum, totalPages);
  rooms.forEach(function(room){
    pageNum += 1;
    const pages = heatLoadRoomPagesHTML(room, c, jobLabel, dateStr, pageNum, totalPages);
    html += pages.join("");
    pageNum += 3;
  });
  return html;
}

function findCustomer(id){ return state.customers.find(function(x){ return x.id===id; }); }
function customerQuoteCount(id){ return state.quotes.filter(function(q){ return q.customerId===id && q.quoteType!=="service"; }).length; }

/* Service's own customer database — see reloadServiceCustomers/saveServiceCustomer. */
function newDraftServiceCustomer(){
  return { id: uid("svccust"), name:"", phone:"", email:"", gstin:"", pincode:"", billingAddressLines:"", sites:[], createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };

function findServiceCustomer(id){ return state.serviceCustomers.find(function(x){ return x.id===id; }); }

// AMC (Service) quotes pick a customer from state.serviceCustomers; every
// other quote (Project) picks from Sales' own state.customers.
function customerOptionsHTML(selectedId, quoteType){
  const isService = quoteType==="service";
  const list = isService ? state.serviceCustomers : state.customers;
  if(list.length===0) return "<option value=\"\">No customers saved yet — add one "+(isService?"in Departments &gt; Service":"in the Customers tab")+"</option>";
  let html = "<option value=\"\">— No linked customer (enter details manually) —</option>";
  list.slice().sort(function(a,b){ return a.name.localeCompare(b.name); }).forEach(function(c){
    html += "<option value=\""+c.id+"\""+(selectedId===c.id?" selected":"")+">"+esc(c.name)+"</option>";
  });
  return html;
}
function siteOptionsHTML(customerId, selectedSiteId, quoteType){
  const c = customerId ? (quoteType==="service" ? findServiceCustomer(customerId) : findCustomer(customerId)) : null;
  const sites = c ? (c.sites||[]) : [];
  let html = "<option value=\"\">— No specific site (use billing address) —</option>";
  sites.forEach(function(s){
    html += "<option value=\""+s.id+"\""+(selectedSiteId===s.id?" selected":"")+">"+esc(s.label||"(untitled site)")+"</option>";
  });
  return html;
}

// customer's own saved sites, each of which carries an "installation base"
// equipment list (see Departments > Service > Customers). Picking a site
// here pulls its address into the quote (via applyCustomerToDraft) and
// unlocks the "add from installation base" machine picker below.

  const c = q.customerId ? findServiceCustomer(q.customerId) : null;
  const sites = c ? (c.sites||[]) : [];
  return "<div class=\"field wide\"><label for=\"f-svc-site\">Installation site <span style=\"text-transform:none;font-weight:400;color:var(--text-muted)\">(pick a saved site to pull its address and installation-base machines into this quote)</span></label>"+

function serviceSiteEquipment(q){
  if(!q || !q.siteId || !q.customerId) return [];
  const c = findServiceCustomer(q.customerId);

function equipmentBaseName(eq){
  const parts = [];
  if(eq.acType) parts.push(eq.acType);

  const mm = [eq.make, eq.model].filter(Boolean).join(" ");
  if(mm) label += " ("+mm+")";
  return label;

/* Copies a customer's (and optionally a site's) address into the quote
   draft's printable client snapshot — a one-time copy, not a live link, so
   a quote already sent to a client stays frozen even if the customer
   record is corrected later. Re-selecting a customer/site overwrites the
   snapshot again, which is the expected "pick and fill" behaviour. */
function applyCustomerToDraft(q, customerId, siteId){
  q.customerId = customerId || null;
  q.siteId = null;
  if(!customerId){ return; }
  const c = q.quoteType==="service" ? findServiceCustomer(customerId) : findCustomer(customerId);
  if(!c) return;
  q.client.name = c.name;
  q.client.addressLines = c.billingAddressLines || "";
  q.client.siteAddressLines = "";
  if(siteId){
    const site = (c.sites||[]).find(function(s){ return s.id===siteId; });
    if(site){ q.siteId = site.id; q.client.siteAddressLines = site.addressLines || ""; }
  }
}

function renderEditorView(){
  const q = view.draft;
  if(!q) return renderQuotesListView();
  const isService = q.quoteType==="service";
  // A finalized AC Project quote means PO received — no further alterations
  // to that offer are allowed. The only way to change anything after this
  // point is "+ Revision" (see revisionRootId/revisionFamily/revisionedQuoteNo
  // above), which spins up a brand-new, independently-editable draft quote
  // numbered e.g. PAS-0004-R1. AC Service/AMC quotes keep their own separate
  // clientApproved workflow (unaffected by this lock) since that's a
  // different, already-established approval path.
  const locked = !isService && q.status==="final";
  const fieldsetOpen = locked ? "<fieldset disabled style=\"border:0;padding:0;margin:0\">" : "";
  const fieldsetClose = locked ? "</fieldset>" : "";
  return "<div class=\"editor-head\">"+
    "<button class=\"back-link\" data-action=\"back-to-list\">← Back to "+(view.editorReturnTab==="departments"?"Departments":view.editorReturnTab==="management-dashboard"?"Management Dashboard":"quotes")+"</button>"+
    "<div class=\"toolbar\">"+
      "<span class=\"hint js-persist\"></span>"+
      (locked ? "" : "<button class=\"btn\" data-action=\"save-quote\">Save</button>")+
      "<button class=\"btn btn-primary\" data-action=\"save-and-print\">Save &amp; Print</button>"+
    "</div>"+
  "</div>"+

  ((view.draftRestoreNotice && view.draftRestoreNotice.kind==="quote") ? draftRestoreBannerHTML() : "")+
  (locked ? "<div class=\"status-banner warn section-gap\" style=\"margin-bottom:14px\"><b>This offer is locked — PO received.</b> A quote marked Final can no longer be edited or altered in any way. To change anything (price, items, scope, quantities...), start a revision — it keeps the same offer number with a -R"+((q.revisionNo||0)+1)+" suffix and opens as a fresh, fully editable draft. "+newRevisionRowActionsHTML(q)+"</div>" : "")+
  (locked ? quoteOrderProofSectionHTML(q) : "")+

  "<div class=\"card card-pad\">"+
    fieldsetOpen+
    "<div style=\"margin-bottom:14px\">"+(isService ? (q.serviceKind==="repair" ? "<span class=\"badge badge-final\"><span class=\"badge-dot\"></span>AC Repair &amp; Maintenance quote</span>" : "<span class=\"badge badge-final\"><span class=\"badge-dot\"></span>AC Service / AMC quote</span>") : "<span class=\"badge badge-draft\"><span class=\"badge-dot\"></span>AC Project quote</span>")+"</div>"+

// Used for the Departments module's optional "linked site" field on a

function allSitesFlat(){

  state.serviceCustomers.forEach(function(c){

  });
  return out;
}

// Resolves "what customer/site/equipment is this job for" for either an AMC
// PM visit (via its contract) or a standalone complaint (which carries its
// own customerId/siteId directly, picked at registration time from the same
// service customer database) — the one place fsrDefaultsFor, fsrFormHTML and
// the equipment-pick change handler all go to look this up, so a complaint's
// registration-time pick flows through to FSR auto-fill exactly like an AMC
// visit's contract does.
function jobCustomerSite(v){
  let customerId = v.customerId, siteId = v.siteId;
  if(!customerId && v.contractId){
    const contract = state.amcContracts.find(function(c){ return c.id===v.contractId; });
    if(contract){ customerId = contract.customerId; siteId = contract.siteId; }
  }
  const customer = customerId ? findServiceCustomer(customerId) : null;
  const site = siteId && customer ? (customer.sites||[]).find(function(s){ return s.id===siteId; }) : null;
  return { customer:customer, site:site, equip: site ? (site.equipment||[]) : [] };
}
/* ---- Field Service Report (FSR) — one per PM visit or registered
   complaint, auto-filled from the customer/site/contract/technician data
   already on file, saved as a single jsonb blob (mirrors quotes.data)
   independently of the job's completed/closed status so a technician can
   save progress mid-job. ---- */
function fsrDefaultsFor(v){
  const isComplaint = v.kind==="complaint";
  const contract = v.contractId ? state.amcContracts.find(function(c){ return c.id===v.contractId; }) : null;
  const cs = jobCustomerSite(v);
  const customer = cs.customer, site = cs.site, equip = cs.equip;
  const sourceQuote = contract ? state.quotes.find(function(q){ return q.id===contract.quoteId; }) : null;
  const assignedEmp = findEmployeeAny(v.assignedTo);
  const singleEq = equip.length===1 ? equip[0] : null;
  const today = todayISO();
  return {
    customerName:(customer&&customer.name)||"",
    customerAddress:(site&&site.addressLines)||(customer&&customer.billingAddressLines)||"",
    type: isComplaint ? { amc:false, warranty:false, postWarranty:false, commissioning:false } : { amc:true, warranty:false, postWarranty:false, commissioning:false },
    technicianName:(assignedEmp&&assignedEmp.fullName)||"",
    // For a registered complaint, "Complaint No." on the paper form is our
    // own auto-generated number rather than a customer reference — still a
    // plain editable field like the AMC case, just pre-filled differently.
    complaintNo: isComplaint ? ("C-"+String(v.complaintNo||"").padStart(4,"0")) : "",
    complaintDate: isComplaint ? (v.receivedDate||today) : today,
    complaintTime: isComplaint ? (v.receivedTime||"") : "",
    // "base" = picked from the site's installation-base equipment (capacity/
    // equipment/model auto-filled and locked to the picked entry); "custom" =
    // freely typed. Defaults to "base" only when the site actually has
    // equipment on file to pick from.
    equipmentMode: equip.length ? "base" : "custom",
    capacity:singleEq?(singleEq.capacity||""):"", equipment:singleEq?equipmentBaseName(singleEq):"", model:singleEq?(singleEq.model||""):"",
    equipmentId:singleEq?(singleEq.id||""):"",
    serviceReportNo:"", reportDate:today,
    purpose: isComplaint
      ? { prevMaintenance:false, breakDown:true, adjSetting:false, customerEducation:false, warrantyClaim:false, other:false, otherText:"" }
      : { prevMaintenance:true, breakDown:false, adjSetting:false, customerEducation:false, warrantyClaim:false, other:false, otherText:"" },
    personName:(sourceQuote&&sourceQuote.amc&&sourceQuote.amc.contactPerson)||"",
    srNoEquipment:"", natureOfComplaint:"", compressorNo:"",
    attendedDate:today, attendedTime:"", completionTime:"",
    observationWorkDone:"", supplyAmcWoNo:(sourceQuote&&sourceQuote.quoteNo)||"",
    spares:[], customerRemarks:"",
    technicianSignDate:"", customerSignDate:""
  };
}
// Auto-filled defaults, with whatever's already been saved on the visit
// layered on top (a saved empty value still wins — that's the technician
// deliberately clearing it, not a gap to re-fill) — EXCEPT technicianName,
// which always tracks whoever is currently assigned rather than freezing
// whatever name happened to be saved earlier, so re-assigning the job
// updates it automatically everywhere (form, print, PDF) with no extra step.
function fsrDataFor(v){
  const defaults = fsrDefaultsFor(v);
  const saved = v.fsr||{};
  const merged = Object.assign({}, defaults, saved);
  merged.type = Object.assign({}, defaults.type, saved.type||{});
  merged.purpose = Object.assign({}, defaults.purpose, saved.purpose||{});
  merged.spares = (saved.spares && saved.spares.length) ? saved.spares : defaults.spares;
  merged.technicianName = defaults.technicianName;
  return merged;
}
// Looks up a service job by id across both AMC PM visits and standalone
// complaints — both share the same FSR/photo/report shape and status
// machine (see the "kind" field set in reloadAmc/reloadServiceComplaints),
// so most of the FSR UI and actions can treat them interchangeably once
// they're found this way.
function findServiceJobById(id){
  return state.amcVisits.find(function(x){ return x.id===id; }) || state.serviceComplaints.find(function(x){ return x.id===id; });
}
// Just the bare customerId/siteId for a job (for pre-filling a new Request
// Invoice draft) — NOT the same as the existing jobCustomerSite(v) above,
// which resolves the full customer/site/equipment objects for the FSR form;
// this one is named distinctly so it can never shadow that one.
function jobCustomerIdsFor(v){
  if(!v) return { customerId:"", siteId:"" };
  if(v.kind==="complaint") return { customerId:v.customerId||"", siteId:v.siteId||"" };
  const contract = state.amcContracts.find(function(c){ return c.id===v.contractId; });
  return { customerId: contract?contract.customerId:"", siteId: contract?contract.siteId:"" };
}
function ensureFsrDraft(visitId){
  if(view.fsrDraftVisitId===visitId && view.fsrDraft) return;
  const v = findServiceJobById(visitId);
  if(!v) return;
  view.fsrDraft = deepClone(fsrDataFor(v));
  view.fsrDraftVisitId = visitId;
}

// Full detail for one PM visit — assignment control, the FSR form,
// attachments, and the submit/close controls. Used both inside an expanded
// PMS row (Service Manager's grouped view) and in a technician's own flat
// "My AMC service jobs" list (see amcVisitCardHTML below). Filling the FSR
// form, and submitting photos/reports, is the assigned technician's job
// (or the director's, who — as everywhere else in this app — keeps full
// override); the Service Manager / HOD's part is assigning the job and,
// once it's submitted with a signed copy on file, approving and closing it.
function amcVisitDetailHTML(v, opts){
  const managerView = opts && opts.managerView;
  const isComplaint = v.kind==="complaint";
  const assignedEmp = findEmployeeAny(v.assignedTo);
  const verifier = findEmployeeAny(v.verifiedBy);
  const isMine = myProfile && v.assignedTo===myProfile.id;
  const canEditFsr = (isMine || isDeptDirector()) && v.status!=="verified";
  const overdue = !isComplaint && (v.status==="pending"||v.status==="assigned") && new Date(v.scheduledDate+"T00:00:00") < new Date(new Date().toDateString());
  const headerTag = isComplaint
    ? "Complaint #"+String(v.complaintNo||"").padStart(4,"0")+" — "+(v.complaintType==="free"?"Free":"Chargeable")
    : "PM "+v.pmNumber+" of 4";
  const dateLineLabel = isComplaint ? "Received" : "Due";
  const dateLineValue = isComplaint ? (fmtDate(v.receivedDate)+(v.receivedTime?(" "+v.receivedTime):"")) : fmtDate(v.scheduledDate);
  let html = "<div data-visit-id=\""+v.id+"\">"+
    "<div class=\"doc-card-top\"><div><span class=\"doc-type-tag\">"+esc(headerTag)+"</span>"+(overdue?" <span class=\"hint\" style=\"color:var(--danger)\">Overdue</span>":"")+"</div>"+amcVisitStatusBadge(v)+"</div>"+
    "<div class=\"doc-card-meta\">"+dateLineLabel+": "+esc(dateLineValue)+"</div>"+
    (assignedEmp ? "<div class=\"doc-card-meta\">Assigned to: "+esc(assignedEmp.fullName)+"</div>" : "")+
    (v.hasChargeable ? "<div class=\"doc-card-meta\" style=\"color:var(--warn)\">⚠ Spares to be billed — "+esc(v.chargeableNote||"see FSR")+"</div>" : "")+
    (v.status==="verified" ? "<div class=\"doc-card-foot\"><span class=\"hint\">Approved &amp; closed by "+(verifier?esc(verifier.fullName):"—")+(v.verificationNote?" — "+esc(v.verificationNote):"")+"</span></div>" : "");
  if(managerView && (v.status==="pending"||v.status==="assigned") && hasDeptPermission("service","assign_jobs")){
    html += "<div class=\"doc-card-actions\"><select class=\"visit-assign-select\">"+amcTechnicianOptions(v.assignedTo)+"</select>"+
      "<button class=\"btn btn-sm btn-primary\" data-action=\"assign-visit\" data-id=\""+v.id+"\">"+(v.assignedTo?"Re-assign":"Assign")+"</button></div>";
  }
  html += fsrFormHTML(v, canEditFsr);
  html += fsrAttachmentsHTML(v, canEditFsr);
  if(canEditFsr){
    html += (view.visitReportOpenId===v.id ? visitCompleteFormHTML(v)
      : "<div class=\"doc-card-actions\"><button class=\"btn btn-sm btn-primary\" data-action=\"open-visit-report-form\" data-id=\""+v.id+"\">"+(v.status==="completed"?"Edit submission":"Submit as complete")+"</button></div>");
  }
  // A chargeable job needs its spares actually billed — and that bill paid
  // and confirmed by Accounts — before it can be closed (see invoiceForJob /
  // confirmInvoicePaymentClosed). Show whichever step is next.
  if(managerView && v.hasChargeable){
    const linkedInv = invoiceForJob(v);
    if(!linkedInv){
      html += "<div class=\"doc-card-actions\"><button class=\"btn btn-sm btn-ghost\" data-action=\"request-invoice-for-job\" data-id=\""+v.id+"\">Request invoice for chargeable spares</button></div>";
    } else if(!linkedInv.closed){
      html += "<div class=\"hint\" style=\"color:var(--warn)\">Invoice "+esc(linkedInv.invoiceNo)+" raised for the chargeable spares — waiting on payment collection &amp; Accounts' confirmation before this job can be closed.</div>";
    }
  }
  if(managerView && v.status==="completed" && hasDeptPermission("service","close_jobs")){
    const linkedInv = v.hasChargeable ? invoiceForJob(v) : null;
    const billingClear = !v.hasChargeable || (linkedInv && linkedInv.closed);
    const canClose = !!v.reportFilePath && billingClear;
    const blockReason = !v.reportFilePath ? "Upload the signed FSR copy first" : (!billingClear ? "The chargeable spares' invoice must be paid and closed first" : "");
    html += "<div class=\"doc-card-actions\"><input type=\"text\" class=\"visit-verify-note\" placeholder=\"Note (optional)\">"+
      "<button class=\"btn btn-sm btn-primary\" data-action=\"verify-visit\" data-id=\""+v.id+"\""+(canClose?"":" disabled title=\""+esc(blockReason)+"\"")+">Approve &amp; close</button></div>"+
      (canClose?"": !v.reportFilePath ? "<div class=\"hint\" style=\"color:var(--warn)\">Upload the signed FSR copy above before this visit can be closed.</div>"
        : "<div class=\"hint\" style=\"color:var(--warn)\">This chargeable job can't be closed until its invoice is paid and closed by Accounts.</div>");
  }
  html += "</div>";
  return html;
}
// Thin wrapper for the technician's own flat "My AMC service jobs" list —
// the PMS grouped view (pmsRowHTML) renders amcVisitDetailHTML directly
// inside its own tab-panel styling instead of double-boxing it.
function amcVisitCardHTML(v, opts){
  return "<div class=\"doc-card\">"+amcVisitDetailHTML(v, opts)+"</div>";
}
// PMS due window: a rolling 45 days from today, not the calendar month —
// a visit scheduled anywhere from today through 45 days out counts as
// "due"; anything with a scheduled date already in the past (and still
// open) falls into visitsOverdue() instead, so the two buckets never
// overlap regardless of where a month boundary falls.
function visitsDueWithin45Days(){
  const today = new Date(new Date().toDateString());
  const horizon = new Date(today); horizon.setDate(horizon.getDate()+45);
  return state.amcVisits.filter(function(v){
    if(v.status==="completed"||v.status==="verified") return false;
    const d = new Date(v.scheduledDate+"T00:00:00");
    return d>=today && d<=horizon;
  });
}
function visitsOverdue(){
  const today = new Date(new Date().toDateString());
  return state.amcVisits.filter(function(v){
    if(v.status==="completed"||v.status==="verified") return false;
    const d = new Date(v.scheduledDate+"T00:00:00");
    return d < today;
  });
}

  const visits = state.amcVisits.filter(function(v){ return v.hasChargeable && (v.status==="completed"||v.status==="verified"); });

  // "Awaiting billing" here means the whole chain isn't done yet — no
  // invoice requested at all, or one raised but not yet paid-and-closed —

function contractVisits(contract){
  return state.amcVisits.filter(function(v){ return v.contractId===contract.id; }).sort(function(a,b){ return a.pmNumber-b.pmNumber; });
}
// "date" sort: nearest not-yet-closed visit first (most urgent at the top);
// contracts whose all 4 visits are closed sink to the bottom, most-recently
// closed first among those. "name" sort: customer name A→Z.
function contractSortKey(contract, mode){
  if(mode==="name"){
    const customer = contract.customerId ? findServiceCustomer(contract.customerId) : null;
    return (customer&&customer.name)||"";
  }
  const visits = contractVisits(contract);
  const open = visits.filter(function(v){ return v.status!=="verified"; });
  if(open.length){
    return open.slice().sort(function(a,b){ return (a.scheduledDate||"").localeCompare(b.scheduledDate||""); })[0].scheduledDate||"";
  }
  const closed = visits.slice().sort(function(a,b){ return (b.scheduledDate||"").localeCompare(a.scheduledDate||""); });
  return "9999-"+((closed[0]&&closed[0].scheduledDate)||"");
}
// Dashboard scoping ("Show the PMS on Dashboard only for the next 45 days") —
// a contract is shown if it has at least one visit due within a rolling
// 45-day window from today, OR one that's overdue and still open.
// Overdue-but-unclosed work deliberately stays visible indefinitely rather
// than disappearing — hiding it just because 45 days passed would be a real
// operational regression. Typing in the search box (pmsFilteredSortedContracts)
// still searches every contract regardless of this window, so the search
// never looks like it's silently missing customers.
function contractDueWithin45DaysOrOverdue(contract){
  const today = new Date(new Date().toDateString());
  const horizon = new Date(today); horizon.setDate(horizon.getDate()+45);
  return contractVisits(contract).some(function(v){
    if(!v.scheduledDate) return false;
    const d = new Date(v.scheduledDate+"T00:00:00");
    if(v.status!=="verified" && d < today) return true;
    return d>=today && d<=horizon;
  });
}

  const overdue = (v.status==="pending"||v.status==="assigned") && new Date(v.scheduledDate+"T00:00:00") < new Date(new Date().toDateString());
  return "<span class=\"pms-chip "+cls+(overdue?" pms-chip-overdue":"")+"\">PM"+v.pmNumber+" · "+esc(overdue?"Overdue":info.label)+"</span>";
}

function pmsFilteredSortedContracts(){
  const q = (view.pmsSearch||"").trim().toLowerCase();
  let list = state.amcContracts.slice();
  if(q){
    list = list.filter(function(c){
      const customer = c.customerId ? findServiceCustomer(c.customerId) : null;

/* ---- Complaint Register — every complaint ever registered, open and
   closed, searchable by customer name, complaint number, or received-date
   range. Reuses complaintRowHTML's same expand-to-detail row. ---- */
function complaintRegisterFilteredSorted(){
  const q = (view.crSearch||"").trim().toLowerCase();
  const from = view.crDateFrom||"", to = view.crDateTo||"";
  let list = state.serviceComplaints.slice();
  if(q){
    list = list.filter(function(c){
      const customer = c.customerId ? findServiceCustomer(c.customerId) : null;
      const name = ((customer&&customer.name)||(c.fsr&&c.fsr.customerName)||"").toLowerCase();
      const no = String(c.complaintNo||"").padStart(4,"0");
      return name.indexOf(q)!==-1 || no.indexOf(q)!==-1 || q==="#"+no;
    });
  }
  if(from) list = list.filter(function(c){ return (c.receivedDate||"") >= from; });
  if(to) list = list.filter(function(c){ return (c.receivedDate||"") <= to; });
  list.sort(function(a,b){ return (b.receivedDate||"").localeCompare(a.receivedDate||""); });
  return list;
}
function complaintRegisterListHTML(){
  const list = complaintRegisterFilteredSorted();
  if(!list.length) return "<div class=\"card card-pad hint\">No complaints match your search.</div>";
  return list.map(complaintRowHTML).join("");
}

/* ---- Closed FSR — every closed (status "verified") AMC PM visit AND
   closed complaint in one place, off the Technician's own live dashboard
   (myAmcJobsSectionHTML) the moment each is closed. Complaint Register
   already covered closed-complaint search on its own; this tab is the new
   surface for closed AMC visits, which had no closed-inclusive view before,
   shown together with closed complaints since both are "FSRs" in practice.
   Reuses amcVisitCardHTML, same as myAmcJobsSectionHTML, since it already
   renders either kind via v.kind. ---- */
function closedFsrFilteredSorted(){
  const q = (view.closedFsrSearch||"").trim().toLowerCase();
  let visits = state.amcVisits.filter(function(v){ return v.status==="verified"; });
  let complaints = state.serviceComplaints.filter(function(c){ return c.status==="verified"; });
  if(q){
    visits = visits.filter(function(v){
      const customer = v.customerId ? findServiceCustomer(v.customerId) : null;
      return ((customer&&customer.name)||"").toLowerCase().indexOf(q)!==-1;
    });
    complaints = complaints.filter(function(c){
      const customer = c.customerId ? findServiceCustomer(c.customerId) : null;
      const name = ((customer&&customer.name)||(c.fsr&&c.fsr.customerName)||"").toLowerCase();
      const no = String(c.complaintNo||"").padStart(4,"0");
      return name.indexOf(q)!==-1 || no.indexOf(q)!==-1 || q==="#"+no;
    });
  }
  return visits.concat(complaints).sort(function(a,b){
    const aDate = a.verifiedAt || a.scheduledDate || a.receivedDate || "";
    const bDate = b.verifiedAt || b.scheduledDate || b.receivedDate || "";
    return bDate.localeCompare(aDate);
  });
}
function closedFsrListHTML(){
  const list = closedFsrFilteredSorted();
  if(!list.length) return "<div class=\"card card-pad hint\">"+(view.closedFsrSearch ? "No closed FSRs match your search." : "Nothing closed yet.")+"</div>";
  return "<div class=\"dept-doc-list\">"+list.map(function(v){ return amcVisitCardHTML(v,{managerView:true}); }).join("")+"</div>";
}

/* ============================== Invoice requests (Sales/Service -> Accounts) ==============================
   view.invoiceRequestDraft is used only for composing a brand-new request
   (Sales/Service); view.invoiceReviewDraft is Accounts' separate editable
   working copy of one pending request while reviewing it, keyed by
   view.invoiceReqExpandedId — both share the same field shape and the same
   form markup (invoiceRequestFieldsHTML) so the two flows never drift apart. */
// GST on every invoice is one of exactly two fixed 18%-total rates (chosen
// via the Tax Type toggle below) — never a per-item rate — so every item
// this app creates carries a fixed gstPercent of 18.
function newInvoiceItemRow(){ return { id: rowIdCounter(), description:"", hsn:"", unit:"Nos", qty:1, rate:0, gstPercent:18 }; }
// Flattens a linked quote's own line items (project quotes: Part A + Part B;
// AMC/service quotes: amcItems) into the same {name,hsn,unit,qty,rate} shape
// so "Request Invoice" can offer them as a pick-list, in addition to typing
// a fully custom line.
function quoteItemsFlat(q){
  if(!q) return [];
  if(q.quoteType==="service"){
    const items = q.serviceKind==="repair" ? (q.repairItems||[]) : (q.amcItems||[]);
    return items.map(function(it){ return { name:it.name||"", hsn:it.hsn||"", unit:it.unit||"Nos", qty:num(it.qty)||1, rate:num(it.rate)||0 }; });
  }
  const a = (q.partA||[]).map(function(it){ return { name:it.name||"", hsn:it.hsn||"", unit:it.unit||"Nos", qty:num(it.qty)||1, rate:itemEffectiveRate(it) }; });
  const b = (q.partB||[]).map(function(it){ return { name:it.name||"", hsn:it.hsn||"", unit:it.unit||"Nos", qty:num(it.qty)||1, rate:itemEffectiveRate(it) }; });
  return a.concat(b);
}

function boqItemRowHTML(item){
  const isOffer = item.source==="offer";
  const b = view.executionBoqDraft;
  // A "size split" row (see add-boq-size-split) is a breakdown of ONE
  // quoted item into a site-specific size/variant — e.g. a single quoted
  // "Refrigerant Copper Pipes" (billed to the customer at one MTR rate,
  // any size) executed across several distinct pipe sizes at site. Its
  // capItemName always names the ORIGINAL quoted item, which is what the
  // qty cap is actually enforced against (see boqQtyCommittedForItem/
  // save-execution-boq) — item.name/hsn instead identify the specific
  // catalog item (from the Purchase Item Database) this row represents,
  // so Store/Purchase see exactly which size to procure and dispatch.
  const capName = item.capItemName || item.name;
  const isSizeSplit = isOffer && item.hasOwnProperty("capItemName");
  const notYetPicked = isSizeSplit && !item.purchaseItemId;
  // The picker only offers items tagged with this row's own capGroup (see
  // add-boq-size-split/confirm-boq-group-pick) — e.g. only pipe-size items
  // for a copper-pipe group — so cable, drain pipe, or anything else
  // untagged can't be added by mistake and silently eat into the cap. If
  // nothing is tagged with that group yet, the row shows a blocked message
  // plus its own explicit "Show full catalog instead" link — the one
  // deliberate way to fall back to every item, rather than that happening
  // silently the moment the group is empty.
  const groupMatchCount = notYetPicked ? state.purchaseItems.filter(function(pi){ return (pi.groupName||"").trim().toLowerCase()===(item.capGroup||"").trim().toLowerCase(); }).length : 0;
  const showFullCatalog = notYetPicked && (view.boqShowFullCatalogFor||{})[item.id];
  // Display-only reference column, per the user's request — the PO/offer's
  // own quantity for this item (or a higher Management-approved qty-increase
  // total, if one exists — see effectiveOfferQtyForItem), shown right next
  // to the "Qty at site" (claimed) column purely so an approver can compare
  // the two at a glance. Never fed into any cap/total/amount calculation —
  // maxAllowedQtyForOfferItem (used in the save-time validation below) is
  // the only thing that actually enforces the offer-qty cap.
  const poQty = (isOffer && b) ? effectiveOfferQtyForItem(b.quoteId, capName) : null;
  // Balance = PO Qty less this row's own claimed qty — a plain, literal
  // "what's left of the PO" figure. Previously this hint showed
  // maxAllowedQtyForOfferItem(...) + item.qty as "max at site", which in the
  // common case of a single BOQ against the item (the usual case) reduces to
  // PO qty + claimed qty added together — i.e. it looked like it was adding
  // the two up rather than netting them, which is exactly what it was doing.
  // This is purely informational, like the PO Qty column — it plays no part
  // in the actual cap enforced at save time. For a size-split row it's shown
  // against the SHARED capName total, not this one row's own slice, since
  // "balance" only makes sense at the level the cap is actually enforced.
  const balanceQty = (isOffer && poQty!==null) ? (poQty - num(item.qty)) : null;
  return "<tr data-row-id=\""+item.id+"\">"+
    "<td>"+
      (notYetPicked
        ? (groupMatchCount
            ? "<select class=\"boq-item-purchase-pick\">"+purchaseItemOptionsHTMLForGroup("", item.capGroup)+"</select>"
            : (showFullCatalog
                ? "<select class=\"boq-item-purchase-pick\">"+purchaseItemOptionsHTML("")+"</select>"
                : "<div class=\"hint\">No items tagged with \""+esc(item.capGroup||"")+"\" yet.</div>"+
                  "<button type=\"button\" class=\"btn btn-sm btn-ghost\" data-action=\"boq-show-full-catalog\" data-id=\""+item.id+"\">Show full catalog instead</button>"))
        : "<input type=\"text\" class=\"boq-item-name\" value=\""+esc(item.name)+"\""+(isOffer?" disabled title=\"From the final offer — remove and re-add from the dropdown to change item\"":"")+" placeholder=\"Item description\">")+
      (isSizeSplit ? "<div class=\"hint\">size of: "+esc(capName)+"</div>" : "")+
    "</td>"+
    "<td style=\"width:100px\"><input type=\"text\" class=\"boq-item-hsn\" value=\""+esc(item.hsn||"")+"\" placeholder=\"HSN/SAC\""+(isOffer?" disabled":"")+"></td>"+
    "<td style=\"width:80px\"><input type=\"text\" class=\"boq-item-unit\" value=\""+esc(item.unit||"")+"\""+(isOffer?" disabled":"")+"></td>"+
    "<td style=\"width:100px\" class=\"num tabular\" title=\"Quantity as per the customer's PO/offer — shown for reference only, has no effect on any calculation\">"+(poQty!==null ? fmtNum(poQty,2) : "—")+"</td>"+
    "<td style=\"width:120px\" class=\"num\"><input type=\"number\" step=\"any\" min=\"0\" class=\"boq-item-qty num-in\" value=\""+item.qty+"\""+(notYetPicked?" disabled":"")+">"+
      (isOffer ? "<div class=\"hint\" title=\"PO Qty less this row's claimed qty — for reference only\">balance: "+fmtNum(balanceQty,2)+"</div>" : "")+"</td>"+
    "<td style=\"width:110px\" class=\"num\"><input type=\"number\" step=\"any\" min=\"0\" class=\"boq-item-rate num-in\" value=\""+item.rate+"\""+(isOffer?" disabled":"")+"></td>"+
    "<td style=\"width:120px\" class=\"amount-cell tabular\" data-boqamount-for=\""+item.id+"\">"+fmtINR(num(item.qty)*num(item.rate))+"</td>"+
    "<td style=\"width:150px\">"+(isOffer ? "<button class=\"btn btn-sm btn-ghost\" data-action=\"open-request-extra-qty\" data-item=\""+esc(capName)+"\" data-unit=\""+esc(item.unit||"")+"\" title=\"Ask Sales/Management for more than the offer qty\">Need more?</button>" : "")+
      (isOffer ? " <button class=\"btn btn-sm btn-ghost\" data-action=\"add-boq-size-split\" data-cap=\""+esc(capName)+"\" title=\"Break "+esc(capName)+" into separate site-size rows — e.g. different pipe ODs — all counted against the same quoted qty\">+ Size</button>" : "")+
      " <button class=\"btn btn-sm btn-ghost icon-btn\" data-action=\"remove-boq-item\" data-id=\""+item.id+"\" title=\"Remove\">✕</button></td>"+
  "</tr>";
}

// Material Request items are free-text (name/hsn/unit/qty/rate inherited
// from the Execution BOQ, which in turn came from free-text quote items) —
// there's no purchaseItemId link into the Purchase Item Database / Store
// Inventory ledger. To show Store a live stock figure without a schema
// change reaching all the way back through BOQ and quote item creation, we
// match on normalized item name against the Purchase Item Database and read
// the existing inventory ledger balance for that match. An item with no
// catalog match (e.g. a one-off/custom item never added to the Purchase
// Item Database) has no stock figure to show — Store still sees the row,
// just without a number to check against, rather than being blocked.
function normalizeItemNameForStockMatch(name){
  return String(name||"").trim().toLowerCase().replace(/\s+/g," ");
}
function findPurchaseItemByName(name){
  const key = normalizeItemNameForStockMatch(name);
  if(!key) return null;
  return state.purchaseItems.find(function(pi){ return normalizeItemNameForStockMatch(pi.name)===key; }) || null;
}
function stockAvailableForMrItem(item){
  const pi = findPurchaseItemByName(item.name);
  if(!pi) return null;
  return currentBalanceForPurchaseItem(pi.id);
}
// Store's dispatch-quantity row — same shape, but the qty cap is the
// REQUESTED qty (Project's own ask), not the BOQ's qty: Store can send less
// than asked, never more. Now also shows the live stock balance next to the
// demand qty, so Store can see at a glance whether there's enough on hand
// before dispatching or requesting an Invoice.
function mrDispatchRowHTML(item){
  const avail = stockAvailableForMrItem(item);
  const short = avail !== null && num(item.qty) > avail + 1e-9;
  const availCellHTML = avail===null
    ? "<span class=\"hint\" title=\"Not in Purchase Item Database — stock not tracked for this item\">— not tracked</span>"
    : "<span class=\"tabular\""+(short ? " style=\"color:var(--danger);font-weight:600\"" : "")+">"+fmtNum(avail,2)+"</span>";
  return "<tr data-row-id=\""+item.id+"\">"+

function renderMaterialRequestEditorView(){

  // Once saved, always read the live row back from state (not the stale
  // clone taken when the screen was opened) so a status-changing action
  // (Store dispatching, uploading proof, Project closing, etc.) shows its
  // new panel immediately after the save-and-reload round trip completes.
  const m = isNew ? draft : (findMaterialRequest(draft.id) || draft);

      "<button class=\"back-link\" data-action=\"back-to-material-requests\">← Back to Material Requests</button>"+

        "<div class=\"field\"><label>Site address <span style=\"font-weight:400;color:var(--text-faint)\">(from the final offer)</span></label><textarea rows=\"2\" disabled>"+esc(m.siteAddress||"")+"</textarea></div>"+

          "</select></div>" : "<div class=\"hint\" style=\"margin-bottom:8px\">This Project Execution BOQ has no items.</div>")+
        "<div class=\"table-wrap\"><table class=\"item-table\"><thead><tr><th>Item</th><th>HSN/SAC</th><th>Unit</th><th class=\"num\">Qty needed</th><th class=\"num\">Rate</th><th class=\"num\">Amount</th><th></th></tr></thead>"+
        "<tbody data-mr-items-body>"+
          ((m.requestedItems||[]).length ? m.requestedItems.map(function(it){ return mrItemRowHTML(it, m.boqId); }).join("") : "<tr><td colspan=\"7\" style=\"padding:16px;color:var(--text-muted);text-align:center\">No items yet — add one above</td></tr>")+
        "</tbody></table></div>"+
      "</div>"+
      "<div class=\"section-gap toolbar\" style=\"justify-content:flex-end\">"+
        "<button class=\"btn\" data-action=\"back-to-material-requests\">Cancel</button>"+
        "<button class=\"btn btn-primary\" data-action=\"save-material-request\">Raise Material Request</button>"+
      "</div>";

    (m.requestedItems||[]).map(function(it){ return "<tr><td>"+esc(it.name)+"</td><td>"+esc(it.hsn||"")+"</td><td>"+esc(it.unit||"")+"</td><td class=\"num tabular\">"+fmtNum(it.qty,2)+"</td><td class=\"num tabular\">"+fmtINR(num(it.rate))+"</td><td class=\"num tabular\">"+fmtINR(num(it.qty)*num(it.rate))+"</td></tr>"; }).join("")+

        "<h3 class=\"section-title\">Select what's being dispatched</h3>"+
        "<div class=\"hint\" style=\"margin-bottom:8px\">Qty can be less than requested (partial stock) but never more.</div>"+
        "<div class=\"table-wrap\"><table class=\"item-table\"><thead><tr><th>Item</th><th>HSN/SAC</th><th>Unit</th><th class=\"num\">Requested</th><th class=\"num\">Qty Available in Stock</th><th class=\"num\">Dispatch qty</th></tr></thead>"+

      "</div>";

  } else if(m.status==="invoice_generated"){

    actionPanel = "<div class=\"status-banner info section-gap\">Delivered"+(m.deliveredAt?" on "+fmtDate(m.deliveredAt):"")+".</div>"+
      "<div class=\"toolbar\">"+
        dcButtonHTML+
        (m.challanFilePath ? " <button class=\"btn btn-sm btn-ghost\" data-action=\"view-mr-file\" data-path=\""+esc(m.challanFilePath)+"\">View signed Challan</button>" : "")+
        (m.invoiceScanFilePath ? " <button class=\"btn btn-sm btn-ghost\" data-action=\"view-mr-file\" data-path=\""+esc(m.invoiceScanFilePath)+"\">View Invoice copy</button>" : "")+
      "</div>"+
      (isProjectDept() ? "<div class=\"toolbar\"><button class=\"btn btn-primary\" data-action=\"mr-close-request\" data-id=\""+m.id+"\">Close request</button></div>" : "<div class=\"hint\">Waiting on Project to close this request.</div>");
  } else if(m.status==="closed"){
    actionPanel = "<div class=\"status-banner section-gap\">Closed"+(m.closedAt?" on "+fmtDate(m.closedAt):"")+".</div>"+
      "<div class=\"toolbar\">"+

        (m.invoiceScanFilePath ? " <button class=\"btn btn-sm btn-ghost\" data-action=\"view-mr-file\" data-path=\""+esc(m.invoiceScanFilePath)+"\">View Invoice copy</button>" : "")+
      "</div>";
  }
  return head+
    "<div class=\"section-gap\"><h3 class=\"section-title\">Requested items</h3>"+materialRequestStatusBadge(m)+"</div>"+
    itemsTableHTML+
    actionPanel;
}

        "<tbody data-stockreq-items-body>"+
          ((m.requestedItems||[]).length ? m.requestedItems.map(stockReqItemRowHTML).join("") : "<tr><td colspan=\"7\" style=\"padding:16px;color:var(--text-muted);text-align:center\">No items yet — add one above</td></tr>")+
        "</tbody></table></div>"+
      "</div>"+
      "<div class=\"section-gap toolbar\" style=\"justify-content:flex-end\">"+
        "<button class=\"btn\" data-action=\"back-to-material-requests\">Cancel</button>"+
        "<button class=\"btn btn-primary\" data-action=\"save-stock-request\">Raise Stock Request</button>"+
      "</div>";
  }

  const itemsTableHTML = "<div class=\"table-wrap\"><table class=\"item-table\"><thead><tr><th>Item</th><th>Unit</th><th class=\"num\">Qty requested</th></tr></thead><tbody>"+
    (m.requestedItems||[]).map(function(it){ return "<tr><td>"+esc(it.name)+"</td><td>"+esc(it.unit||"")+"</td><td class=\"num tabular\">"+fmtNum(it.qty,2)+"</td></tr>"; }).join("")+
    "</tbody></table></div>";

  const pos = purchaseOrdersForMaterialRequest(m.id);
  const latestPo = pos.length ? pos[0] : null;
  let actionPanel = "";

  if(m.status==="pending_purchase"){
    const rejectedPo = pos.find(function(p){ return p.status==="rejected"; });
    const rejectedBannerHTML = rejectedPo ? "<div class=\"status-banner warn section-gap\">Previous PO "+esc(rejectedPo.poNo)+" ("+esc(rejectedPo.vendorName)+") was rejected by Director"+(rejectedPo.rejectionReason?": "+esc(rejectedPo.rejectionReason):".")+" — raise a revised PO below.</div>" : "";
    const draftPo = pos.find(function(p){ return p.status==="draft"; });
    if(isPurchaseManager()){
      const d = (view.poDraft && view.poDraft.materialRequestId===m.id) ? view.poDraft : null;
      if(d){
        actionPanel = rejectedBannerHTML+poFormHTML(d);
      } else if(draftPo){
        actionPanel = rejectedBannerHTML+
          "<div class=\"status-banner info section-gap\">A draft Purchase Order to "+esc(draftPo.vendorName)+" is saved and awaiting review.</div>"+
          "<div class=\"section-gap toolbar\"><button class=\"btn btn-primary\" data-action=\"resume-po-draft\" data-id=\""+draftPo.id+"\">Continue Draft PO</button></div>";
      } else {
        actionPanel = rejectedBannerHTML+"<div class=\"section-gap toolbar\"><button class=\"btn btn-primary\" data-action=\"start-po\" data-id=\""+m.id+"\">Raise Purchase Order</button></div>";
      }
    } else {
      actionPanel = rejectedBannerHTML+"<div class=\"status-banner info section-gap\">Waiting on Purchase to raise a Purchase Order.</div>";
    }
  } else if(m.status==="po_pending_approval"){
    actionPanel = "<div class=\"section-gap\">"+poSummaryHTML(latestPo)+
      (isDeptDirector() ?
        "<div class=\"toolbar\" style=\"margin-top:10px\">"+
          "<button class=\"btn btn-primary\" data-action=\"approve-po\" data-id=\""+(latestPo?latestPo.id:"")+"\">Approve PO</button>"+
          "<input type=\"text\" class=\"po-reject-reason\" placeholder=\"Reason (for reject, optional)\" style=\"max-width:280px\">"+
          "<button class=\"btn btn-danger\" data-action=\"reject-po\" data-id=\""+(latestPo?latestPo.id:"")+"\">Reject</button>"+
        "</div>"
       : "<div class=\"status-banner info\">Awaiting Director's approval.</div>")+
    "</div>";
  } else if(m.status==="po_approved"){
    const fullyReceived = latestPo ? poFullyReceived(latestPo) : false;
    let grnPanel = "";
    if(isStoreDept() && latestPo){
      const gd = (view.grnDraft && view.grnDraft.purchaseOrderId===latestPo.id) ? view.grnDraft : null;
      grnPanel = gd ? grnFormHTML(gd) : (
        fullyReceived ? "" :
        "<div class=\"toolbar\"><button class=\"btn btn-primary\" data-action=\"start-grn\" data-id=\""+latestPo.id+"\">File GRN (Goods Receipt)</button></div>"
      );
    }
    actionPanel = "<div class=\"section-gap\">"+poSummaryHTML(latestPo)+poReceivingTableHTML(latestPo)+grnHistoryTableHTML(latestPo)+grnPanel+
      (isStoreDept() ? "<div class=\"toolbar\" style=\"margin-top:10px\"><button class=\"btn btn-ghost\" data-action=\"close-stock-request\" data-id=\""+m.id+"\">Close Request</button></div>" : "")+
    "</div>";
  } else if(m.status==="closed"){
    actionPanel = "<div class=\"section-gap\">"+
      "<div class=\"status-banner section-gap\">Closed"+(m.closedAt?" on "+fmtDate(m.closedAt):"")+".</div>"+
      (latestPo ? poSummaryHTML(latestPo)+poReceivingTableHTML(latestPo)+grnHistoryTableHTML(latestPo) : "")+
    "</div>";
  }

  return head+
    "<div class=\"section-gap\"><h3 class=\"section-title\">Requested items</h3>"+materialRequestStatusBadge(m)+"</div>"+
    itemsTableHTML+
    actionPanel;
}

  // against Sales' AC Project customers, so a Project-raised request

  const source = dept==="service" ? "service" : "sales";
  return {

    consigneeName:"", consigneeAddress:"", consigneePincode:"", consigneeGstin:"",
    sameAsConsignee:true, deliveryName:"", deliveryAddress:"", deliveryPincode:"", deliveryGstin:"",
    poNo:"", poDate:"", taxType:"intra", items:[ newInvoiceItemRow() ], notes:"",
    linkedQuoteId:"", linkedVisitId:"", linkedComplaintId:""

}
function invoiceReviewDraftFrom(req){

// Which department's draft is currently on screen — the compose form
// (request-invoice) or Accounts' review form (invoice-requests, expanded).
function currentInvoiceDraft(){
  if(view.tab==="request-invoice") return view.invoiceRequestDraft;
  if(view.tab==="invoice-requests") return view.invoiceReviewDraft;
  return null;
}
// Mirrors applyCustomerToComplaintDraft's customer/site pick, against
// whichever customer base (Sales or Service) this draft's department owns.
function applyCustomerToInvoiceRequestDraft(customerId, siteId){
  const d = currentInvoiceDraft();
  if(!d) return;
  d.customerId = customerId || "";
  d.siteId = "";
  const c = customerId ? findAnyCustomer(d.customerSource, customerId) : null;
  if(!c){
    d.consigneeName=""; d.consigneeAddress=""; d.consigneePincode=""; d.consigneeGstin="";
  } else {
    d.consigneeName = c.name||"";
    d.consigneeGstin = c.gstin||"";
    let addr = c.billingAddressLines||"", pin = c.pincode||"";
    if(siteId){
      const site = findAnySite(d.customerSource, c, siteId);
      if(site){ d.siteId = site.id; addr = site.addressLines||addr; pin = site.pincode||pin; }
    }
    d.consigneeAddress = addr;
    d.consigneePincode = pin;
  }
  if(d.sameAsConsignee){
    d.deliveryName=d.consigneeName; d.deliveryAddress=d.consigneeAddress; d.deliveryPincode=d.consigneePincode; d.deliveryGstin=d.consigneeGstin;
  }
}

// Recomputes an item's amount cell + the totals strip without a full
// re-render, mirroring recomputeEditorTotals — keeps focus in the input
// the user is actively typing in.
function recomputeInvoiceTotalsStrip(){
  const d = currentInvoiceDraft();
  if(!d) return;
  const t = invoiceTotals(d.items, d.taxType);
  const strip = document.querySelector("[data-inv-totals]");
  if(!strip) return;
  const taxableEl = strip.querySelector("[data-inv-total='taxable']");
  if(taxableEl) taxableEl.textContent = fmtINR(t.taxable);
  const totalEl = strip.querySelector("[data-inv-total='total']");
  if(totalEl) totalEl.textContent = fmtINR(t.total);
  const cgstsgstEl = strip.querySelector("[data-inv-total='cgstsgst']");
  if(cgstsgstEl) cgstsgstEl.textContent = fmtINR(t.cgst+t.sgst);
  const igstEl = strip.querySelector("[data-inv-total='igst']");
  if(igstEl) igstEl.textContent = fmtINR(t.igst);
}

function renderSalesRegisterView(){

  // Sales (matching Service's Order Book, which only ever shows Service's
  // own orders) — Accounts still sees every department's invoices here
  // since it's the only cross-department invoicing hub. Sales' own quotes
  // always carry quoteType "project" (Service's are quoteType "service"),
  // so filtering out "service" quotes from the un-invoiced list keeps a
  // client-approved AMC/repair order from appearing in both this register
  // and the Service Order Book at the same time.
  const dept = view.activeDepartment || myDepartment() || "sales";
  const scoped = dept === "sales";
  const invoices = (scoped ? state.invoices.filter(function(i){ return i.department==="sales"; }) : state.invoices.slice())
    .sort(function(a,b){ return (b.invoiceDate||"").localeCompare(a.invoiceDate||""); });

      "<button class=\"back-link\" data-nav=\"departments\">← Back to Departments</button>"+

      "<div class=\"panel-hint\">"+(scoped ? "Every Proforma Invoice generated by Accounts for Sales' own orders, most recent first." : "Every Proforma Invoice generated by Accounts, most recent first.")+"</div>"+
    "</div></div>"+
    (invoices.length ? "<div class=\"table-wrap\"><table class=\"list-table\"><thead><tr>"+
      "<th>Invoice No</th><th>Date</th><th>Dept</th><th>Customer</th><th class=\"num\">Taxable</th><th class=\"num\">GST</th><th class=\"num\">Total</th><th>Payment</th><th></th>"+
    "</tr></thead><tbody>"+
      invoices.map(function(i){
        const gst = num(i.cgstAmount)+num(i.sgstAmount)+num(i.igstAmount);
        return "<tr>"+
          "<td>"+esc(i.invoiceNo)+"</td>"+
          "<td>"+fmtDate(i.invoiceDate)+"</td>"+
          "<td>"+esc(DEPARTMENT_LABELS[i.department]||i.department)+"</td>"+

      (uninvoiced.length ? "<div class=\"table-wrap\"><table class=\"list-table\"><thead><tr><th>Quote No</th><th>Customer</th><th>Date</th><th></th></tr></thead><tbody>"+
        uninvoiced.map(function(q){

// plain informational option (no real choices) when nothing is tagged yet —
// callers show their own "view full catalog instead" escape hatch rather

function purchaseItemOptionsHTMLForGroup(selectedId, groupName){
  const key = (groupName||"").trim().toLowerCase();
  const matches = state.purchaseItems.filter(function(it){ return (it.groupName||"").trim().toLowerCase()===key; });

  let html = "<option value=\"\">— choose a size/variant —</option>";
  matches.slice().sort(function(a,b){ return a.name.localeCompare(b.name); }).forEach(function(it){

/* ============================== Store Inventory (Store's stock in/out ledger, per user request) ==============================
   Items always come from the shared Purchase Item Database (never typed
   free-text) — balance qty per item is derived from the ledger of moves,
   never stored directly, so it can never drift out of sync with it. */
function newStoreInventoryMoveDraft(){
  return { purchaseItemId:"", moveType:"in", qty:0, moveDate: todayISO(), reference:"", notes:"" };
}
function currentBalanceForPurchaseItem(itemId){
  let bal = 0;
  state.storeInventoryMoves.forEach(function(m){
    if(m.purchaseItemId===itemId) bal += (m.moveType==="in" ? num(m.qty) : -num(m.qty));
  });
  return bal;
}
function storeInventoryBalances(){
  const rows = state.purchaseItems.map(function(it){
    return { itemId:it.id, name:it.name, unit:it.unit||"", inQty:0, outQty:0 };
  });
  const byId = {};
  rows.forEach(function(r){ byId[r.itemId] = r; });
  state.storeInventoryMoves.forEach(function(m){
    const r = byId[m.purchaseItemId];
    if(!r) return; // item since removed from the Purchase Item Database
    if(m.moveType==="in") r.inQty += num(m.qty); else r.outQty += num(m.qty);
  });
  return rows.map(function(r){ return Object.assign({}, r, { balance: r.inQty - r.outQty }); })
    .sort(function(a,b){ return a.name.localeCompare(b.name); });
}
function storeInventoryMoveFormHTML(d){
  const balHint = d.purchaseItemId ? currentBalanceForPurchaseItem(d.purchaseItemId) : null;
  const item = d.purchaseItemId ? state.purchaseItems.find(function(x){ return x.id===d.purchaseItemId; }) : null;
  return "<div class=\"card card-pad section-gap\">"+
    "<h3 class=\"section-title\">Record stock movement</h3>"+
    (view.storeInventoryMsg ? "<div class=\"status-banner warn\" style=\"margin-bottom:10px\">"+esc(view.storeInventoryMsg)+"</div>" : "")+
    "<div class=\"grid-3\">"+
      "<div class=\"field wide\"><label>Item <span style=\"font-weight:400;color:var(--text-faint)\">(from the Purchase Item Database)</span></label>"+
        "<select data-role=\"inv-item-select\">"+purchaseItemOptionsHTML(d.purchaseItemId)+"</select>"+
        (item ? "<div class=\"hint\">Current balance: "+fmtNum(balHint,2)+" "+esc(item.unit||"")+"</div>" : "")+
      "</div>"+
      "<div class=\"field\"><label>Movement</label><select data-role=\"inv-movetype-select\">"+
        "<option value=\"in\""+(d.moveType==="in"?" selected":"")+">Stock In (received)</option>"+
        "<option value=\"out\""+(d.moveType==="out"?" selected":"")+">Stock Out (issued)</option>"+
      "</select></div>"+
      "<div class=\"field\"><label>Qty</label><input type=\"number\" step=\"any\" min=\"0\" data-ifield=\"qty\" value=\""+num(d.qty)+"\"></div>"+
      "<div class=\"field\"><label>Date</label><input type=\"date\" data-ifield=\"moveDate\" value=\""+esc(d.moveDate)+"\"></div>"+
      "<div class=\"field\"><label>Reference <span style=\"font-weight:400;color:var(--text-faint)\">(vendor/invoice, or site/Material Request)</span></label><input type=\"text\" data-ifield=\"reference\" value=\""+esc(d.reference||"")+"\"></div>"+
      "<div class=\"field wide\"><label>Notes</label><textarea data-ifield=\"notes\" rows=\"2\">"+esc(d.notes||"")+"</textarea></div>"+
    "</div>"+
    "<div class=\"toolbar\" style=\"margin-top:10px\">"+
      "<button class=\"btn btn-primary\" data-action=\"save-store-inventory-move\">Save movement</button>"+
      "<button class=\"btn btn-ghost\" data-action=\"cancel-store-inventory-move\">Cancel</button>"+
    "</div>"+

/* ============================== Proforma Invoice — A4 print/PDF ==============================
   A dedicated bordered-table layout (not the Daikin/Pride letterhead used by
   quotes/FSRs) built to match the uploaded sample Proforma Invoice format
   field-for-field: company header bar, Consignee/Delivery boxes, Inv No/PO
   No box, a GST-split item table, totals block, amount-in-words, signatory
   + terms + receiver's-sign footer, and the bank details line. */
function invoiceGstColHTML(rate, amount){
  return "<td class=\"num tabular\">"+(rate?fmtNum(rate,0)+"%":"0%")+"</td><td class=\"num tabular\">"+fmtINR(amount)+"</td>";
}
function invoiceItemPrintRowHTML(item, idx, taxType){
  const amount = invoiceItemAmount(item);
  const taxAmt = invoiceItemTax(item);
  const isInter = taxType==="inter";
  const cgst = isInter ? 0 : taxAmt/2, sgst = isInter ? 0 : taxAmt/2, igst = isInter ? taxAmt : 0;
  const rate = num(item.gstPercent);
  // The per-column "Rate %" is the CGST/SGST/IGST rate itself, not the total
  // GST rate — for an 18% intra-state item that's 9% + 9%, matching the
  // sample invoice (never 18% shown twice).
  const halfRate = rate/2;
  return "<tr>"+
    "<td class=\"num\">"+(idx+1)+"</td>"+
    "<td>"+esc(item.description||"")+"</td>"+
    "<td>"+esc(item.hsn||"")+"</td>"+
    "<td class=\"num tabular\">"+fmtNum(item.qty,2)+"</td>"+
    "<td>"+esc(item.unit||"")+"</td>"+
    "<td class=\"num tabular\">"+fmtINR(item.rate)+"</td>"+
    "<td class=\"num tabular\">"+fmtINR(amount)+"</td>"+
    invoiceGstColHTML(isInter?0:halfRate, cgst)+
    invoiceGstColHTML(isInter?0:halfRate, sgst)+
    invoiceGstColHTML(isInter?rate:0, igst)+
  "</tr>";
}

    "</div>"+

function exportInvoicePDF(inv){
  if(!pdfLibsReady()){
    setPrintMsg("warn","PDF export library didn't load — check your internet connection and try again, or use Ctrl/Cmd+P instead.");
    return;
  }
  const source = document.querySelector(".print-page");
  if(!source){ setPrintMsg("warn","Nothing to export yet."); return; }
  setPrintMsg("info","Generating PDF…");
  const clip = document.createElement("div");
  clip.style.position = "absolute";
  clip.style.left = "0";
  clip.style.top = "0";
  clip.style.width = "1px";
  clip.style.height = "1px";
  clip.style.overflow = "hidden";
  clip.style.opacity = "0.01";
  clip.style.pointerEvents = "none";
  clip.style.zIndex = "-1";
  document.body.appendChild(clip);
  const holder = buildPdfExportHolder(source);
  clip.appendChild(holder);
  const filename = safeFileName(inv.invoiceNo||"Invoice")+".pdf";
  function cleanup(){ if(clip.parentNode) document.body.removeChild(clip); }
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      renderHolderPagesToPdf(holder, filename).then(function(){
        cleanup();
        setPrintMsg("ok","Saved "+filename+" — check your browser's downloads (or the folder you chose).");
      }).catch(function(err){
        cleanup();
        if(err && err.name==="AbortError"){ setPrintMsg("info","Export cancelled."); return; }
        setPrintMsg("warn","Couldn't generate the PDF ("+((err&&err.message)||"unknown error")+") — try Ctrl/Cmd+P instead.");
      });
    });
  });
}

function interDeptRequestStats(dept){
  const all = state.invoiceRequests||[];
  const made = all.filter(function(r){ return r.department===dept; });
  // Currently the only inter-department request flow in the app is the
  // Invoice Request (Sales/Service -> Accounts), so Accounts is the sole
  // "receiving" department; every other department only ever "makes"
  // requests (or, like Project/Purchase/Store, has none at all — they'll
  // simply show zeros here).
  const received = (dept==="accounts") ? all.slice() : [];
  const combined = made.concat(received);
  const complete = combined.filter(function(r){ return r.status==="generated"; }).length;
  const incomplete = combined.filter(function(r){ return r.status==="pending"; }).length;
  return { received: received.length, made: made.length, complete: complete, incomplete: incomplete };
}

function interDeptRequestStatsHTML(dept){
  const s = interDeptRequestStats(dept);
  return "<div class=\"section-gap\">"+

      "<div class=\"stat\"><div class=\"stat-label\">Requests Made</div><div class=\"stat-value tabular\">"+s.made+"</div></div>"+
      "<div class=\"stat\"><div class=\"stat-label\">Completed</div><div class=\"stat-value tabular\" style=\"color:var(--accent-strong)\">"+s.complete+"</div></div>"+
      "<div class=\"stat\"><div class=\"stat-label\">Incomplete</div><div class=\"stat-value tabular\" style=\"color:var(--danger)\">"+s.incomplete+"</div></div>"+
    "</div></div>";
}

// tile in renderDepartmentHomeView). Two things a director wants at a
// glance across the whole company: how inter-department request traffic

// waiting for an approval (a dept-head's, or the director's own).

// offers waiting on "Approval for execution"; Planning gets its own extra-

function pendingApprovalCountForDept(dept){
  return pendingApprovalRowsForDept(dept).length;
}
function pendingApprovalRowsForDept(dept){
  const rows = [];
  state.documents.filter(function(d){ return d.department===dept && d.status==="pending"; })
    .sort(function(a,b){ return (b.createdAt||"").localeCompare(a.createdAt||""); })
    .forEach(function(d){
      rows.push({ typeLabel: DOC_TYPE_LABELS[d.docType]||d.docType, titleHTML: esc(d.title||"—"), dateISO: d.createdAt,
        actionsHTML: "<button class=\"btn btn-sm btn-ghost\" data-action=\"goto-dept-for-approval\" data-dept=\""+d.department+"\">Review</button>" });
    });
  state.invoiceRequests.filter(function(r){ return r.department===dept && r.status==="pending"; })
    .sort(function(a,b){ return (a.requestedAt||"").localeCompare(b.requestedAt||""); })
    .forEach(function(r){
      const c = findAnyCustomer(r.customerSource, r.customerId);
      rows.push({ typeLabel:"Invoice Request", titleHTML: esc((c&&c.name)||r.consigneeName||"—"), dateISO: r.requestedAt,
        actionsHTML: "<button class=\"btn btn-sm btn-ghost\" data-action=\"goto-invoice-requests\">Review</button>" });
    });
  // Part J: Execution BOQs awaiting Management's approval, grouped under
  // whichever department actually prepared each one (Planning or Project).
  boqsAwaitingApproval().filter(function(b){ return b.department===dept; }).forEach(function(b){
    const q = state.quotes.find(function(x){ return x.id===b.quoteId; });
    rows.push({ typeLabel:"Approval for Project Execution BOQ",
      titleHTML: esc(b.boqNo||"(untitled BOQ)")+(q?" — "+quoteProjectLabel(q)+" — "+esc((q.client&&q.client.name)||"(no client)"):""),
      dateISO: b.createdAt,
      actionsHTML: "<button class=\"btn btn-sm\" data-action=\"approve-boq\" data-id=\""+b.id+"\">Approve BOQ</button> "+
        "<button class=\"btn btn-sm btn-ghost\" data-action=\"open-execution-boq\" data-id=\""+b.id+"\">View BOQ</button>" });
  });
  if(dept==="sales"){
    quotesAwaitingExecutionApproval().forEach(function(q){
      rows.push({ typeLabel:"Approval for Execution", titleHTML: esc(q.quoteNo)+" — "+esc((q.client&&q.client.name)||"(no client)"), dateISO: q.updatedAt,
        actionsHTML: "<div style=\"display:flex;gap:6px;align-items:center;flex-wrap:wrap\">"+
          (q.projectCode ? "<span class=\"hint\" style=\"margin-right:4px\">"+esc(q.projectCode)+"</span>" : "")+
          "<input type=\"text\" class=\"approve-exec-project-name\" placeholder=\"Project name (required)\" value=\""+esc(q.projectName||"")+"\" style=\"max-width:180px\">"+
          "<button class=\"btn btn-sm\" data-action=\"approve-execution\" data-id=\""+q.id+"\">Approve for execution</button> "+
          "<button class=\"btn btn-sm btn-ghost\" data-action=\"goto-quote-for-approval\" data-id=\""+q.id+"\">View offer</button> "+
          (quotePoDocument(q.id) ? "<button class=\"btn btn-sm btn-ghost\" data-action=\"view-quote-po\" data-id=\""+q.id+"\">View PO</button> " : "")+
          (quoteOafDocument(q.id) ? "<button class=\"btn btn-sm btn-ghost\" data-action=\"view-quote-oaf\" data-id=\""+q.id+"\">View OAF</button> " : "")+
          (quoteDrawingDocument(q.id) ? "<button class=\"btn btn-sm btn-ghost\" data-action=\"view-quote-drawing\" data-id=\""+q.id+"\">View Drawing</button>" : "")+
        "</div>" });
    });
  }
  if(dept==="service"){
    serviceQuotesAwaitingApproval().forEach(function(q){
      rows.push({ typeLabel:"Approval for "+((q.serviceKind||"amc")==="repair"?"Repair execution":"AMC execution"),
        titleHTML: esc(q.quoteNo)+" — "+esc((q.client&&q.client.name)||"(no client)"), dateISO: q.updatedAt,
        actionsHTML: "<div style=\"display:flex;gap:6px;align-items:center;flex-wrap:wrap\">"+
          "<button class=\"btn btn-sm\" data-action=\"approve-service-execution\" data-id=\""+q.id+"\">Approve</button> "+
          "<button class=\"btn btn-sm btn-ghost\" data-action=\"goto-quote-for-approval\" data-id=\""+q.id+"\">View offer</button> "+
          (quotePoDocument(q.id) ? "<button class=\"btn btn-sm btn-ghost\" data-action=\"view-quote-po\" data-id=\""+q.id+"\">View PO</button> " : "")+
          (quoteOafDocument(q.id) ? "<button class=\"btn btn-sm btn-ghost\" data-action=\"view-quote-oaf\" data-id=\""+q.id+"\">View OAF</button>" : "")+
        "</div>" });
    });
  }
  if(dept==="planning"){
    state.qtyIncreaseRequests.filter(function(r){ return r.status==="pending"; })
      .sort(function(a,b){ return (a.requestedAt||"").localeCompare(b.requestedAt||""); })
      .forEach(function(r){
        const q = state.quotes.find(function(x){ return x.id===r.quoteId; });
        rows.push({ typeLabel:"Extra Quantity Approval",
          titleHTML: (q?quoteProjectLabel(q)+" — ":"")+esc(r.itemName)+" <span class=\"hint\">(site needs "+fmtNum(r.requestedQty,2)+" "+esc(r.unit||"")+", offer had "+fmtNum(r.offerQty,2)+")</span>",
          dateISO: r.requestedAt,
          actionsHTML: "<button class=\"btn btn-sm\" data-action=\"decide-qty-increase\" data-id=\""+r.id+"\" data-decision=\"approved\">Approve extra qty</button> "+
            "<button class=\"btn btn-sm btn-ghost\" data-action=\"decide-qty-increase\" data-id=\""+r.id+"\" data-decision=\"rejected\">Reject</button>" });
      });
  }
  if(dept==="purchase"){
    state.purchaseOrders.filter(function(p){ return p.status==="pending_approval"; })
      .sort(function(a,b){ return (a.createdAt||"").localeCompare(b.createdAt||""); })
      .forEach(function(p){
        const total = (p.items||[]).reduce(function(s,it){ return s+num(it.qty)*num(it.rate); }, 0);
        rows.push({ typeLabel:"Purchase Order Approval",
          titleHTML: esc(p.poNo)+" — "+esc(p.vendorName)+" <span class=\"hint\">("+fmtINR(total)+")</span>",
          dateISO: p.createdAt,
          actionsHTML: "<button class=\"btn btn-sm\" data-action=\"approve-po\" data-id=\""+p.id+"\">Approve PO</button> "+
            (p.materialRequestId ? "<button class=\"btn btn-sm btn-ghost\" data-action=\"open-material-request\" data-id=\""+p.materialRequestId+"\">Review / Reject</button>" : "") });
      });
  }
  return rows;
}

function renderDepartmentDetailView(active, depts){

  if(active===myDepartment() && !isDeptDirector()){

  if(active!=="service" && !isPartnerView && (isDeptDirector() || myDeptSeniority()==="dept_head")){
